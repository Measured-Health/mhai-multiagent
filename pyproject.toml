"mhai/knowledge_base/kb_builder.py" = ["B007", "F401", "F841", "I001", "UP006", "UP015", "UP035", "UP045"]
"mhai/knowledge_base/patient_parser.py" = ["B905", "F401", "F541", "F821", "F841", "I001", "UP006", "UP015", "UP035", "UP045"]
"mhai/pipeline/cross_milestone.py" = ["B007", "F401", "F541", "I001", "UP006", "UP035"]
"mhai/pipeline/integration.py" = ["F401", "F541", "I001", "UP006", "UP035", "UP045"]
"mhai/security/hipaa.py" = ["F401", "F541", "I001", "UP006", "UP035", "UP045"]
"mhai/tools/guideline_parser.py" = ["I001", "UP006", "UP035"]
"mhai/tools/pubmed_client.py" = ["I001", "UP006", "UP035"]
"tests/evaluation/evaluator.py" = ["B018", "E701", "F401", "F541", "F821", "I001", "UP006", "UP015", "UP035", "UP045"]
"tests/evaluation/m3_evaluator.py" = ["B018", "F401", "F541", "F821", "F841", "I001", "UP006", "UP015", "UP035"]
