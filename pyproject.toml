[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhai"
version = "1.0.0"
description = "A 5-agent hallucination-resistant clinical decision-support system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Promit Ghosal", email = "promit@bhai.uchicago.edu" }]
keywords = ["medical-ai", "multi-agent", "hallucination-detection", "clinical", "transformer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "transformers>=4.30",
    "accelerate>=0.20",
    "peft>=0.5",
    "bitsandbytes>=0.41",
    "sentence-transformers>=2.2",
    "rank-bm25>=0.2",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "requests>=2.28",
    "cryptography>=41.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "fakeredis>=2.0",
    "locust>=2.15",
    "diff-cover>=9",
]
# PyTorch build. CPU is the default; for a CUDA machine use
# `uv sync --no-group cpu --group cu128`.
cpu = ["torch>=2.0"]
cu128 = ["torch>=2.0"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
mhai = "mhai.cli:main"

[project.urls]
Homepage = "https://github.com/promit-ghosal/mhai"

[tool.setuptools.packages.find]
where = ["."]
include = ["mhai*"]

[tool.setuptools.package-data]
mhai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]
markers = [
    "models: needs real ML models (downloads weights; run scripts/e2e_models.py)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
# Apply exclusions even when tools pass explicit paths (pre-commit does).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
# Legacy files not yet run through the formatter. Format a file and drop it
# from this list when you next change it substantially.
exclude = [
    "mhai/agents/cca.py",
    "mhai/agents/dia.py",
    "mhai/agents/hga_nli.py",
    "mhai/agents/hga.py",
    "mhai/agents/orchestrator.py",
    "mhai/agents/qda.py",
    "mhai/cli.py",
    "mhai/config/agent_http.py",
    "mhai/config/secrets_manager.py",
    "mhai/config/settings.py",
    "mhai/guardrails/__init__.py",
    "mhai/guardrails/l1_persona_vector.py",
    "mhai/guardrails/l2_semantic_entropy.py",
    "mhai/guardrails/l3_nli_citation.py",
    "mhai/guardrails/l4_trust_escalation.py",
    "mhai/__init__.py",
    "mhai/knowledge_base/kb_builder.py",
    "mhai/knowledge_base/patient_parser.py",
    "mhai/models/deberta_moe.py",
    "mhai/models/ft_transformer.py",
    "mhai/models/swin_v2.py",
    "mhai/pipeline/cross_milestone.py",
    "mhai/pipeline/integration.py",
    "mhai/queue/consumer.py",
    "mhai/queue/dlq.py",
    "mhai/queue/producer.py",
    "mhai/retrieval/dense_retriever.py",
    "mhai/retrieval/hybrid.py",
    "mhai/retrieval/sparse_retriever.py",
    "mhai/security/hipaa.py",
    "mhai/tools/guideline_parser.py",
    "mhai/tools/hf_client.py",
    "mhai/tools/pubmed_client.py",
    "mhai/utils/device.py",
    "mhai/utils/logging.py",
    "mhai/utils/retry.py",
    "mhai/utils/seeding.py",
    "mhai/utils/tokens.py",
    "scripts/run_pipeline.py",
    "tests/evaluation/evaluator.py",
    "tests/evaluation/m3_evaluator.py",
    "tests/harness/guardrail_harness.py",
    "tests/regression/e2e_regression.py",
    "tests/unit/test_cli.py",
    "tests/unit/test_config.py",
    "tests/unit/test_security.py",
]

[tool.ruff.lint.per-file-ignores]
# Baseline for code ported from the original notebooks: the rules each file
# broke when linting was enforced. Don't add entries; remove them as files
# are cleaned up. New and changed files must pass the full rule set.
"mhai/agents/cca.py" = ["F401", "F541", "I001", "UP006", "UP035", "UP045"]
"mhai/agents/dia.py" = ["B905", "F541", "I001", "UP006", "UP024", "UP035", "UP045"]
"mhai/agents/hga.py" = ["F401", "F541", "I001", "UP006", "UP035"]
"mhai/agents/hga_nli.py" = ["B007", "F401", "F541", "F841", "I001", "UP006", "UP035", "UP045"]
"mhai/agents/orchestrator.py" = ["B007", "F401", "I001", "UP006", "UP035", "UP045"]
"mhai/agents/qda.py" = ["F401", "F541", "F841", "I001", "UP006", "UP035", "UP045"]
"mhai/cli.py" = ["F541", "I001"]
"mhai/config/settings.py" = ["I001", "UP006", "UP035"]
"mhai/guardrails/l1_persona_vector.py" = ["B006", "B905", "E741", "F401", "F541", "I001", "UP006", "UP035", "UP045"]
"mhai/guardrails/l2_semantic_entropy.py" = ["F401", "F541", "F841", "I001", "UP006", "UP035", "UP045"]
