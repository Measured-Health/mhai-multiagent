"tests/regression/e2e_regression.py" = ["E714", "E741", "F401", "F541", "F841", "I001", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["mhai"]

[[tool.mypy.overrides]]
# Baseline: modules ported from the notebooks that failed type checking when
# it was enforced. Don't add modules; remove them as they are fixed.
module = [
    "mhai.agents.cca",
    "mhai.agents.dia",
    "mhai.agents.hga_nli",
    "mhai.agents.hga",
    "mhai.agents.orchestrator",
    "mhai.agents.qda",
    "mhai.knowledge_base.kb_builder",
    "mhai.knowledge_base.patient_parser",
    "mhai.pipeline.cross_milestone",
    "mhai.pipeline.integration",
    "mhai.security.hipaa",
    "mhai.tools.pubmed_client",
    "mhai.guardrails.l1_persona_vector",
    "mhai.guardrails.l2_semantic_entropy",
    "mhai.guardrails.l4_trust_escalation",
]
ignore_errors = true
