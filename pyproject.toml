[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhai"
version = "1.0.0"
description = "A 5-agent hallucination-resistant clinical decision-support system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Promit Ghosal", email = "promit@bhai.uchicago.edu" }]
keywords = ["medical-ai", "multi-agent", "hallucination-detection", "clinical", "transformer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "transformers>=4.30",
    "accelerate>=0.20",
    "peft>=0.5",
    "bitsandbytes>=0.41",
    "sentence-transformers>=2.2",
    "rank-bm25>=0.2",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "requests>=2.28",
    "cryptography>=41.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "fakeredis>=2.0",
]

[project.scripts]
mhai = "mhai.cli:main"

[project.urls]
Homepage = "https://github.com/promit-ghosal/mhai"

[tool.setuptools.packages.find]
where = ["."]
include = ["mhai*"]

[tool.setuptools.package-data]
mhai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["mhai"]
