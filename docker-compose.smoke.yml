# The end-to-end smoke stack (Plan 3 Task 15, spec §12), on top of
# docker-compose.yml:
#
#   .github/scripts/boundary-smoke.sh [--build]
#
# which generates throwaway secrets, runs
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --wait
# and then `go test -tags smoke ./internal/smoke/...` from services/core.
#
# Differences from the dev stack: the pipeline worker uses the synthetic
# stub models (INTELLIGENCE_MODEL_CLIENT=stub, development only; it never
# loads a model), so Ollama is not started; and the test-only echo worker
# is on. Synthetic data only.

services:
  # Not needed with the stub models. Under a profile nothing here enables.
  ollama:
    profiles: ["models"]
  ollama-init:
    profiles: ["models"]

  pipeline:
    environment:
      INTELLIGENCE_MODEL_CLIENT: stub
    # The dev stack also waits for the model pull; the stub needs none.
    depends_on: !override
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }

  # The test-only echo worker (profile `test` in docker-compose.yml).
  echo:
    profiles: !reset []

  # Patient Analysis's four keys, for the smoke run only (the drill-down
  # needs the drill key): made once in their own volume, owned by core's
  # user (distroless nonroot, 65532) and readable by it alone. The paths
  # come from the generated env file (.github/scripts/boundary-smoke.sh).
  analysis-keys:
    image: postgres:16.15-alpine
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for k in ref_hmac ref_enc drill note; do
          [ -s "/keys/$$k" ] || head -c 32 /dev/urandom | base64 > "/keys/$$k"
        done
        chown 65532:65532 /keys/*
        chmod 0600 /keys/*
    volumes:
      - analysiskeys:/keys

  core:
    volumes:
      - analysiskeys:/analysis-keys:ro
    depends_on:
      analysis-keys: { condition: service_completed_successfully }

volumes:
  analysiskeys:
