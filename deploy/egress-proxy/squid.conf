# The egress proxy for the cloud model providers (cloud models plan Task 14,
# design section 6). The pipeline reaches the outside only through it, and
# only with CONNECT to port 443 of a host listed in /etc/squid/allowed-hosts
# (one per enabled provider, from intelligence/boundary/cloud/vocab.py
# HOSTS). TLS runs end to end through the tunnel: the proxy never sees the
# request, the key or the reply. Everything else is refused.
#
# The host is matched by the name the client sent, exactly as written
# (no leading dot, so no subdomain), never by an address:
#   - dstdomain -n: no reverse DNS, so an IP literal whose PTR record names
#     an allowed host doesn't match;
#   - IP literals (v4 and v6, bracketed or not) are refused first;
#   - no address (dst) acl allows anything, so nothing the client supplies
#     is resolved and then trusted. Squid resolves an allowed name itself
#     when it opens the tunnel.

http_port 3128

acl providers dstdomain -n "/etc/squid/allowed-hosts"
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[?[0-9a-fA-F:]+\]?$
acl SSL_port port 443

http_access deny ip_literal
http_access deny to_localhost
http_access deny to_linklocal
http_access allow CONNECT SSL_port providers
http_access deny all

# Nothing is cached or stored; no TLS interception (no ssl_bump, no CA).
cache deny all
cache_mem 0 MB
memory_pools off

# No headers that name the pipeline or the proxy; none of Squid's version.
forwarded_for delete
via off
httpd_suppress_version_string on

# The access log: time, method, host, port and status. No path, no client
# address, no headers (the tunnel carries nothing else Squid could log).
logformat egress %ts %rm %>rd %>rP %>Hs
access_log stdio:/dev/stdout egress
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0

# Runs read-only as the proxy user: no pid file, no core dumps, no spool.
pid_filename none
coredump_dir none
shutdown_lifetime 1 seconds
