# clamd for the documents service (documents design §5 step 3, §5.2):
# INSTREAM only, on the internal network, limits that alert rather than
# pass. Signatures come from the freshclam sidecar into the shared
# database volume; clamd reloads them (SelfCheck). The documents service
# refuses to scan with signatures older than 48 hours.
Foreground yes
User clamav
LogTime yes
LogClean no
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
SelfCheck 600
MaxConnectionQueueLength 30
MaxThreads 4
CommandReadTimeout 30
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
DetectPUA yes
ScanPDF yes
ScanArchive yes
ScanOLE2 yes
HeuristicAlerts yes
