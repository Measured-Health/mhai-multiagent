# Postgres client rules in production mode (deploy/compose.production.yml;
# deploy/README.md, "Production mode"). Static: no address is rendered in.
# The first matching line wins.

# Inside the container only (the health check, docker compose exec psql:
# premigrate-check.sh, live-site.sh, ops/backup.sh): the image's own default.
local    all  all                  trust
# Every service (core, core-migrate, core-cli, the pipeline, notifications,
# emr): TLS and a password, from the networks this Postgres is on only
# (samenet: backend, an internal network; never published on the host).
hostssl  all  all  samenet         scram-sha-256
# Anything without TLS, and anything from elsewhere, is refused.
host     all  all  all             reject
