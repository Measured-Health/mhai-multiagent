# Postgres client rules for the split mode (docs/deploy/remote-intelligence.md).
# render-hba.sh writes postgres/pg_hba.conf from this file (enable-split.sh
# runs it): @INTELLIGENCE_ADDR@ becomes the intelligence host's private IPv4
# address, and the @DOCKER_SUBNET@ line is repeated once for each of this
# host's Docker networks Postgres is on (backend, edge). compose.split.yml
# points Postgres at the result. The first matching line wins.

# Inside the container only (the health check, docker compose exec psql, the
# ops scripts): the image's own default.
local   all   all                                         trust
# The pipeline worker: TLS, its own database, its own address, nothing else.
hostssl mhai  intelligence_app  @INTELLIGENCE_ADDR@/32    scram-sha-256
# Nothing else from the intelligence host (core_app, pgadmin, plaintext).
host    all   all               @INTELLIGENCE_ADDR@/32    reject
# The worker's login from nowhere else.
host    all   intelligence_app  all                       reject
# core, core-migrate and core-cli on this host's Docker networks (named, not
# samenet: a Postgres ever run on the host's own network must not admit the
# whole private network).
host    all   all               @DOCKER_SUBNET@           scram-sha-256
# Anything else (another machine on the private network) matches no line and
# is refused.
