# Host nginx site for the public API docs on the demo server:
# https://api-dev.measured-health.org/api/docs (product owner, 28 Oct).
# Installed as /etc/nginx/sites-available/mhai-api-dev and linked into
# sites-enabled. See deploy/README.md, "Public API docs (api-dev)".
#
# Only the docs page, its script and the spec are served. Every other path,
# the API itself included, is 404: the frontend reaches core over NATS, and
# the API is not for browsers. The allow list (/etc/nginx/mhai-api-dev-allow.conf,
# `allow <ip>;` lines then `deny all;`, or `allow all;` for the demo) applies
# to the docs too.
#
# The :443 block needs the certificate, so install this file only after
# certbot has issued it (README step 2 serves the :80 block alone first).

server {
    listen 80;
    server_name api-dev.measured-health.org;
    server_tokens off;

    access_log /var/log/nginx/mhai-api-dev.access.log;
    error_log  /var/log/nginx/mhai-api-dev.error.log;

    # Let's Encrypt's HTTP-01 check; certbot --webroot writes under /var/www/html.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 443 ssl;
    server_name api-dev.measured-health.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api-dev.measured-health.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.measured-health.org/privkey.pem;

    access_log /var/log/nginx/mhai-api-dev.access.log;
    error_log  /var/log/nginx/mhai-api-dev.error.log;

    include /etc/nginx/mhai-api-dev-allow.conf;

    # Exact paths only; core serves its own security headers on these.
    location = /api/docs                         { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8092; include /etc/nginx/mhai-api-dev-proxy.conf; }
    location = /api/docs/redoc.standalone.js     { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8092; include /etc/nginx/mhai-api-dev-proxy.conf; }
    location = /api/docs/redoc-shim.js           { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8092; include /etc/nginx/mhai-api-dev-proxy.conf; }
    location = /api/docs/logo.png                { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8092; include /etc/nginx/mhai-api-dev-proxy.conf; }
    location = /api/openapi.yaml                 { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8092; include /etc/nginx/mhai-api-dev-proxy.conf; }
    location = /                                 { return 302 /api/docs; }

    location / { return 404; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
