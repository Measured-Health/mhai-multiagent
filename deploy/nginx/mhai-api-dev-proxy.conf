# Proxy settings for the api-dev docs locations (mhai-api-dev.conf).
# Installed as /etc/nginx/mhai-api-dev-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
# No request bodies: the docs are GET only.
client_max_body_size 1k;
proxy_read_timeout 10s;
