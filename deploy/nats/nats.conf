# NATS for the backend demo on the preview instance (deploy/compose.yml).
#
# The same server as services/nats/nats.conf, with two differences:
#   - the core service signs in with an NKey, not a password. Only the
#     public key is here, read from NATS_GATEWAY_NKEY (set by
#     deploy/setup-host.sh in /srv/mhai-backend/.env). The seed stays in
#     /srv/mhai-backend/secrets/, mounted into the core container only.
#   - a placeholder `bff` user for the frontend's BFF (NATS_BFF_NKEY), with
#     no publish permissions until Plan 3;
#   - there is no `worker` user yet: the intelligence service is not
#     deployed (see the placeholder in deploy/compose.yml). Add it back,
#     with its own NKey and the permissions from services/nats/nats.conf,
#     when the boundary plan wires the workers.
#
# Keep the gateway permissions identical to services/nats/nats.conf. When
# they change there, change them here in the same PR.
#
# Who can reach it: the core service on `backend`; the frontend's
# containers on the shared network `mhai-bff`; processes on the host on
# 127.0.0.1. Every user is an NKey user and there is no `no_auth_user`, so an
# anonymous connection is refused.
#
# No TLS yet: the core service's NATS client has no TLS settings. Until it
# does, NATS traffic stays on the host (Docker networks and loopback). See
# deploy/README.md, known limits.

port: 4222
server_name: mhai-nats-preview
http: 127.0.0.1:8222   # monitoring, inside the container only (health check)

jetstream {
  store_dir: /data
  # The instance is small and shared with the EMR stack. The core service's
  # KV buckets are file-backed and short-lived (minutes to an hour).
  max_memory_store: 32MB
  max_file_store: 512MB
}

authorization {
  users = [
    {
      nkey: $NATS_GATEWAY_NKEY
      permissions: {
        publish: {
          allow: [
            "inference.v1.>"
            "jobs.v1.>"
            "$KV.>"                          # KV puts and deletes
            "$JS.API.INFO"
            "$JS.API.STREAM.CREATE.>"
            "$JS.API.STREAM.UPDATE.>"
            "$JS.API.STREAM.INFO.>"
            "$JS.API.STREAM.NAMES"
            "$JS.API.STREAM.LIST"
            "$JS.API.STREAM.MSG.GET.>"
            "$JS.API.DIRECT.GET.>"           # KV reads
            "$JS.API.CONSUMER.>"             # KV watchers, JOBS consumers
          ]
          deny: [
            "$JS.API.STREAM.DELETE.>"
            "$JS.API.STREAM.PURGE.>"
          ]
        }
        subscribe: {
          allow: ["_INBOX_gateway.>", "dead.v1.>"]
        }
      }
    }
    # The frontend's BFF (mhai-web). A placeholder until Plan 3 builds the
    # NATS routes: it may sign in, but publish nothing, and receive only on
    # its own inbox prefix. Plan 3 adds the request subjects it may publish
    # (and the matching rules in services/nats/nats.conf).
    {
      nkey: $NATS_BFF_NKEY
      permissions: {
        publish: { deny: [">"] }
        subscribe: { allow: ["_INBOX_bff.>"] }
      }
    }
    # Intelligence workers (not deployed yet). Copy the `worker` permissions
    # from services/nats/nats.conf and give them their own NKey:
    # {
    #   nkey: $NATS_WORKER_NKEY
    #   permissions: { ... }
    # }
  ]
}
