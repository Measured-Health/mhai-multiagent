# NATS for the backend demo on the preview instance (deploy/compose.yml).
#
# The same server as services/nats/nats.conf, with these differences:
#   - every user is an NKey user, not a password user. Only the public keys
#     are here, from /srv/mhai-backend/.env (deploy/setup-host.sh). The
#     gateway's seed stays in /srv/mhai-backend/secrets/, mounted into the
#     core container only.
#   - the clinical BFF (mhai-web) is the NKey in NATS_BFF_NKEY (the name
#     predates the per-app split, spec §17.1): publish api.v1.clinical
#     only, receive on _INBOX_bff.clinical only. It never gets the
#     test-only bff_direct subjects of services/nats/bff-clinical.test.conf
#     (a test holds this). The platform app's BFF (bff_platform) needs its
#     own NKey, made by setup-host.sh, before mhai-web's platform BFF moves
#     to NATS: not on the demo yet (TODO.md).
#   - no intelligence workers (pipeline, echo): they are not deployed on
#     the demo in Plan 3 (the instance is small and the models are heavy;
#     see deploy/compose.yml). Add the pipeline user, with its own NKey and
#     the permissions from services/nats/nats.conf, when they are. echo is
#     test-only and never comes here.
#   - no JetStream encryption at rest (NATS_JS_KEY) yet: turning it on
#     needs the store converted or recreated (TODO.md).
#
# Keep the gateway permissions identical to services/nats/nats.conf. When
# they change there, change them here in the same PR: a test compares them
# (services/core/internal/bus/conf_test.go).
#
# This is the production-shaped config: NKeys only, and it never includes
# services/nats/bff-clinical.test.conf (no test-only bff_direct subject).
#
# Who can reach it: the core service on `backend`; the frontend's
# containers on the shared network `mhai-bff`; processes on the host on
# 127.0.0.1. Every user is an NKey user and there is no `no_auth_user`, so an
# anonymous connection is refused.
#
# No TLS on the demo: NATS traffic stays on the host (Docker networks and
# loopback). TLS is required before any worker runs outside one host, and
# in production (TODO.md). The production block, with verify (client
# certificates) and the workers' TLS-first handshake:
#
#   tls {
#     cert_file: /etc/nats/tls/server.pem
#     key_file:  /etc/nats/tls/server-key.pem
#     ca_file:   /etc/nats/tls/ca.pem
#     verify:    true
#     # The Python workers start TLS before INFO outside development.
#     # After 300 ms without a TLS handshake the server sends INFO first
#     # for INFO-first clients (core, the BFFs), which must then upgrade
#     # to TLS too: the fallback is the ordinary TLS handshake, never
#     # plaintext, and verify still applies.
#     handshake_first: 300ms
#   }

port: 4222
server_name: mhai-nats-preview
http: 127.0.0.1:8222   # monitoring, inside the container only (health check)
max_payload: 1MB

jetstream {
  store_dir: /data
  # The instance is small and shared with the EMR stack. The core service's
  # KV buckets are file-backed and short-lived (minutes to an hour). JOBS
  # (256 MiB) and DEAD (64 MiB) reserve 320 MiB of max_file_store, which
  # leaves 192 MiB for the KV buckets.
  max_memory_store: 32MB
  max_file_store: 512MB
}

authorization {
  users = [
    {
      nkey: $NATS_GATEWAY_NKEY
      permissions: {
        publish: {
          allow: [
            "inference.v1.>"                             # requests to the workers
            "jobs.v1.>"                                  # jobs, on the JOBS stream
            "$KV.denylist.>"                             # KV puts and deletes, the four buckets only
            "$KV.login_attempts.>"
            "$KV.mfa_attempts.>"
            "$KV.login_ceiling.>"
            # JetStream: the four KV streams, JOBS and DEAD only. No stream
            # delete or purge, no message delete, no other stream.
            "$JS.API.INFO"                                  # account info (nats.go checks it before opening a bucket)
            "$JS.API.STREAM.CREATE.KV_denylist"
            "$JS.API.STREAM.UPDATE.KV_denylist"
            "$JS.API.STREAM.INFO.KV_denylist"
            "$JS.API.STREAM.CREATE.KV_login_attempts"
            "$JS.API.STREAM.UPDATE.KV_login_attempts"
            "$JS.API.STREAM.INFO.KV_login_attempts"
            "$JS.API.STREAM.CREATE.KV_mfa_attempts"
            "$JS.API.STREAM.UPDATE.KV_mfa_attempts"
            "$JS.API.STREAM.INFO.KV_mfa_attempts"
            "$JS.API.STREAM.CREATE.KV_login_ceiling"
            "$JS.API.STREAM.UPDATE.KV_login_ceiling"
            "$JS.API.STREAM.INFO.KV_login_ceiling"
            "$JS.API.STREAM.CREATE.JOBS"
            "$JS.API.STREAM.UPDATE.JOBS"
            "$JS.API.STREAM.INFO.JOBS"
            "$JS.API.STREAM.CREATE.DEAD"
            "$JS.API.STREAM.UPDATE.DEAD"
            "$JS.API.STREAM.INFO.DEAD"
            "$JS.API.STREAM.MSG.GET.KV_denylist"
            "$JS.API.DIRECT.GET.KV_denylist.>"
            "$JS.API.STREAM.MSG.GET.KV_login_attempts"
            "$JS.API.DIRECT.GET.KV_login_attempts.>"
            "$JS.API.STREAM.MSG.GET.KV_mfa_attempts"
            "$JS.API.DIRECT.GET.KV_mfa_attempts.>"
            "$JS.API.STREAM.MSG.GET.KV_login_ceiling"
            "$JS.API.DIRECT.GET.KV_login_ceiling.>"
            "$JS.API.CONSUMER.CREATE.KV_denylist.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_denylist.>"
            "$JS.API.CONSUMER.INFO.KV_denylist.>"
            "$JS.API.CONSUMER.CREATE.KV_login_attempts.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_login_attempts.>"
            "$JS.API.CONSUMER.INFO.KV_login_attempts.>"
            "$JS.API.CONSUMER.CREATE.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.INFO.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.CREATE.KV_login_ceiling.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_login_ceiling.>"
            "$JS.API.CONSUMER.INFO.KV_login_ceiling.>"
            "$JS.API.CONSUMER.CREATE.JOBS.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.JOBS.>"
            "$JS.API.CONSUMER.INFO.JOBS.>"
            "$JS.API.CONSUMER.CREATE.DEAD.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.DEAD.>"
            "$JS.API.CONSUMER.INFO.DEAD.>"
            "$JS.API.CONSUMER.MSG.NEXT.DEAD.core_dead"     # the dead-letter consumer
            "$JS.ACK.DEAD.core_dead.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX_gateway.>"                           # its own replies
            "api.v1.* core"                              # the BFFs' requests (api.v1.<app>), in queue group core only
            "authz.v1.grant.> core"                      # the workers' grant requests, in queue group core only
          ]
        }
        # Answers the BFF and the workers: one publish per request received,
        # within a minute, to the reply subject the REQUESTER chose. NATS
        # doesn't check that subject, so core's handlers must (README.md,
        # "Responders must check the reply subject").
        allow_responses: { max: 1, expires: "1m" }
      }
    }
    # The clinical app's BFF (mhai-web): its API subject and its own inbox,
    # as bff_clinical in services/nats/bff-clinical.test.conf without the
    # test-only bff_direct subjects (no production operation is bff_direct
    # yet, spec §17.2). A test compares the two.
    {
      nkey: $NATS_BFF_NKEY
      permissions: {
        publish: {
          allow: ["api.v1.clinical"]
        }
        subscribe: {
          allow: ["_INBOX_bff.clinical.>"]
        }
      }
    }
    # The pipeline worker (not deployed on the demo in Plan 3). Copy the
    # `pipeline` permissions from services/nats/nats.conf and give it its
    # own NKey:
    # {
    #   nkey: $NATS_PIPELINE_NKEY
    #   permissions: { ... }
    # }
  ]
}
