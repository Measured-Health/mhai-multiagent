# NATS with TLS: production mode (deploy/production/enable-production.sh,
# deploy/compose.production.yml) and the split mode
# (docs/deploy/remote-intelligence.md, deploy/compose.split.yml) start NATS
# with this file instead of nats.conf; the development demo never does, so
# TLS stays off there.
#
# Everything in nats.conf (users, NKeys, permissions, JetStream) is included
# unchanged; this adds only the TLS block. The files are issued from the
# operator's private CA (deploy/tls/) by enable-production.sh or
# enable-split.sh, mounted read-only, the key owned by the NATS user, mode
# 0400.
#
#   - verify: every client presents a certificate from the CA (core, the
#     BFFs, the pipeline worker, notifications and emr each have their own),
#     and still signs in with its NKey: the certificate says the client is
#     ours, the NKey says which user it is.
#   - handshake_first: the Python worker starts TLS before any NATS byte (it
#     refuses a server that doesn't). After 300 ms without a TLS ClientHello
#     the server sends INFO first for INFO-first clients (core, the BFFs),
#     which must then upgrade: the fallback is the ordinary TLS handshake,
#     never plaintext, and verify still applies.
#   - TLS 1.2 at least (the server's default), the Go defaults for ciphers.

include ./nats.conf

tls {
  cert_file: /etc/nats/tls/server.pem
  key_file:  /etc/nats/tls/server-key.pem
  ca_file:   /etc/nats/tls/ca.pem
  verify:    true
  handshake_first: 300ms
  timeout:   2
}
