# NATS with TLS: the split mode (docs/deploy/remote-intelligence.md), when the
# pipeline worker runs on its own server. The app host's compose override
# (deploy/compose.split.yml) starts NATS with this file instead of nats.conf;
# the single-host demo never does, so TLS stays off there.
#
# Everything in nats.conf (users, NKeys, permissions, JetStream) is included
# unchanged; this adds only the TLS block. The files are written by
# deploy/enable-split.sh (issued from the operator's private CA,
# deploy/tls/), mounted read-only, the key owned by the NATS user, mode 0400.
#
#   - verify: every client presents a certificate from the CA (core, the BFFs
#     and the worker each have one), and still signs in with its NKey: the
#     certificate says the client is ours, the NKey says which user it is.
#   - handshake_first: the Python worker starts TLS before any NATS byte (it
#     refuses a server that doesn't). After 300 ms without a TLS ClientHello
#     the server sends INFO first for INFO-first clients (core, the BFFs),
#     which must then upgrade: the fallback is the ordinary TLS handshake,
#     never plaintext, and verify still applies.
#   - TLS 1.2 at least (the server's default), the Go defaults for ciphers.

include ./nats.conf

tls {
  cert_file: /etc/nats/tls/server.pem
  key_file:  /etc/nats/tls/server-key.pem
  ca_file:   /etc/nats/tls/ca.pem
  verify:    true
  handshake_first: 300ms
  timeout:   2
}
