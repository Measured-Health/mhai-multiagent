# The backend demo (core service, Postgres, NATS) on the shared preview
# instance, next to the EMR stack and the mhai-web demo. Lives at
# /srv/mhai-backend on the instance. deploy/setup-host.sh prepares it once;
# .github/workflows/deploy.yml then copies this file in, pulls the core image
# and restarts. Nothing here touches the EMR containers, their ports or nginx.
#
# Secrets are only in /srv/mhai-backend/.env (mode 600) and
# /srv/mhai-backend/secrets/ (the NATS seed), written by setup-host.sh.
# Compose refuses to start without them (${VAR:?}).
#
# Network: core (HTTP) and NATS (client port) publish on 127.0.0.1 only.
# Postgres is on `backend` only, an internal network with no route out and
# no published port. NATS is also on `mhai-bff`, an internal network shared
# with the frontend's containers. Docker's iptables rules sit in front of
# the security group, so a 0.0.0.0 binding would be on the internet: never
# add one.
#
# Memory: the instance has 3.7 GiB shared with MongoDB, the EMR and the
# web demo. Every container is capped. The pilot pipeline (profile pilot)
# takes up to 1600 MiB: enable-pilot.sh refuses to start it without room.

name: mhai-backend

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-core-image: &core-image
  image: ${CORE_IMAGE:-ghcr.io/measured-health/mhai-multiagent-core:latest}
  # The workflow pulls before every `up`, so a plain restart needs no GHCR login.
  pull_policy: missing

services:
  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine}
    restart: unless-stopped
    # The image's postgres user, so the entrypoint needs no root and no
    # capabilities. The data volume is owned by it (setup-host.sh).
    user: "70:70"
    environment:
      POSTGRES_DB: mhai
      # The owner, a superuser inside this Postgres. Only core-migrate
      # connects as it (see there); the services never do.
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /srv/mhai-backend/.env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=40
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    shm_size: 64m
    mem_limit: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d mhai"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    <<: *hardening
    image: ${NATS_IMAGE:-nats:2.10.29-alpine}
    restart: unless-stopped
    user: "1000:1000"
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      # Public keys, not secrets. The core seed is only in the core
      # container; each BFF seed is a file in secrets/bff/ for the frontend.
      # NATS_BFF_NKEY is the clinical app's BFF (bff_clinical),
      # NATS_BFF_PLATFORM_NKEY the platform app's (bff_platform).
      NATS_GATEWAY_NKEY: ${NATS_GATEWAY_NKEY:?set in /srv/mhai-backend/.env}
      NATS_BFF_NKEY: ${NATS_BFF_NKEY:?set in /srv/mhai-backend/.env}
      NATS_BFF_PLATFORM_NKEY: ${NATS_BFF_PLATFORM_NKEY:?set in /srv/mhai-backend/.env (run setup-host.sh)}
      # The pilot pipeline's public key (deploy/pilot/enable-pilot.sh writes
      # it). The default is a public key whose seed never existed: the user
      # is in nats.conf from the start, and no one can sign in as it.
      NATS_PIPELINE_NKEY: ${NATS_PIPELINE_NKEY:-UBAAQAZYHQ5QQDODQD742E2H6PQD734J54VXQT23CDN7AKSAYLBA23W6}
      GOMEMLIMIT: 96MiB
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    tmpfs:
      - /tmp
    # The client port, for the frontend's BFF (Plan 3). Loopback only, for
    # processes on the host; the frontend's containers use the shared
    # network mhai-bff instead (a container's 127.0.0.1 is its own).
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
    mem_limit: 128m
    networks:
      backend: {}
      # Publishing a port needs a network that is not internal.
      edge: {}
      bff:
        aliases: [mhai-nats]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot, on every deploy: apply the goose migrations, then create or
  # reset the two logins: core_app (a member of mhai_app only, for core) and
  # core_provision (a member of mhai_provision only, for core-cli).
  # It connects as the owner, as services/core/README.md says: migration
  # 00003 makes the owner a member of mhai_migrate, and every table, view
  # and function is handed to mhai_migrate, never to a login the services
  # use. This one-shot container is the only place the owner password goes,
  # and it carries no core service secrets. (A CREATEROLE, non-superuser
  # owner is not used yet: on Postgres 16 it can't re-run EnsureLogin;
  # see deploy/README.md, known limits.)
  core-migrate:
    <<: [*hardening, *core-image]
    restart: "no"
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://pgadmin:${POSTGRES_PASSWORD:?set in /srv/mhai-backend/.env}@postgres:5432/mhai?sslmode=disable
      CORE_DB_USER: core_app
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set in /srv/mhai-backend/.env}
      PROVISION_DB_USER: core_provision
      PROVISION_DB_PASSWORD: ${PROVISION_DB_PASSWORD:?set in /srv/mhai-backend/.env}
      # The pilot pipeline's login (intelligence_app, a member of
      # mhai_worker_app only): made only when set (deploy/pilot/).
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:-}
    mem_limit: 128m
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: make the access-token signing key in the corekeys volume if it
  # isn't there yet, keep it otherwise (core keys ensure).
  core-keys:
    <<: [*hardening, *core-image]
    restart: "no"
    command: ["keys", "ensure", "--out", "/keys/access.pem"]
    network_mode: none
    volumes:
      - corekeys:/keys
    mem_limit: 64m

  # One-shot: the request-token signing key (a different key from the
  # access-token key, spec §7.2) in corekeys, and its public half in the
  # trusted-keys file on its own volume, for the workers to mount read-only.
  # Kept when already there (core keys ensure).
  core-request-key:
    <<: [*hardening, *core-image]
    restart: "no"
    command: ["keys", "ensure", "--kind", "request", "--out", "/keys/request.pem",
              "--trusted-out", "/trusted/request-keys.json"]
    network_mode: none
    volumes:
      - corekeys:/keys
      - trustedkeys:/trusted
    mem_limit: 64m
    depends_on:
      core-keys: { condition: service_completed_successfully }

  # The core service: the API the BFFs call. Its environment holds only its
  # own settings and secrets: the core_app login, its NATS NKey seed (a
  # file), the signing key (a file), the MFA key and the BFF keys.
  core:
    <<: [*hardening, *core-image]
    restart: unless-stopped
    command: ["serve"]
    environment:
      # The demo server runs as development (product owner, 28 Oct), which
      # turns on Redoc at /api/docs on the loopback port (view it through an
      # SSH tunnel), and lets core reach NATS without TLS (outside
      # development core refuses to start without NATS_TLS_*). Production
      # must not be development.
      CORE_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://core_app:${CORE_DB_PASSWORD:?set in /srv/mhai-backend/.env}@postgres:5432/mhai?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED_PATH: /run/secrets/nats-gateway.nk
      ACCESS_KEY_PATH: /keys/access.pem
      REQUEST_KEY_PATH: /keys/request.pem
      REQUEST_TRUSTED_KEYS_PATH: /trusted/request-keys.json   # public; dead-letter re-mint after a rotation
      INTELLIGENCE_QUERY_CAP: "10"   # questions in flight per hospital (decision 8)
      # The cloud providers a hospital's policy may name: none unless the
      # pilot set it in .env (deploy/pilot/enable-pilot.sh).
      CORE_CLOUD_PROVIDERS: ${CORE_CLOUD_PROVIDERS:-}
      # The API over HTTP too: the frontend still calls HTTP until mhai-web's
      # BFF moves to NATS (spec §17.1). Core serves api.v1.<app> over NATS
      # as well.
      CORE_HTTP_API: "on"
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set in /srv/mhai-backend/.env}
      BFF_SERVICE_KEYS: ${BFF_SERVICE_KEYS:?set in /srv/mhai-backend/.env}
      # Who the platform app's audit integrity page names (setup-host.sh
      # asks for them; never generated). Core refuses to start without them
      # outside development; on this development demo the integrity status
      # answers 503 until they are set, and the deploy still goes ahead.
      SECURITY_CONTACT_NAME: ${SECURITY_CONTACT_NAME:-}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-}
      GOMEMLIMIT: 256MiB
    # Loopback only. Nothing is in front of it yet; see deploy/nginx/ for the
    # disabled site to enable once the frontend's BFF calls it.
    ports:
      - "127.0.0.1:${CORE_HOST_PORT:-8092}:8080"
    volumes:
      - corekeys:/keys:ro
      - trustedkeys:/trusted:ro
      # Owned by the container's user (65532), mode 400 (setup-host.sh).
      - ./secrets/nats-gateway.nk:/run/secrets/nats-gateway.nk:ro
    tmpfs:
      - /tmp
    # argon2 takes 64 MiB per sign-in, with one slot per CPU the process
    # sees. Two CPUs bound that to 128 MiB, inside the cap.
    cpuset: ${CORE_CPUSET:-0-1}
    mem_limit: 320m
    networks: [backend, edge]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-keys: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }
    # The image is distroless (no shell or curl): the deploy workflow probes
    # GET /api/v1/readyz from the host.
    healthcheck:
      disable: true

  # The seed CLI, as the provisioning login (never the owner, never core_app).
  # Not started by `up`; see deploy/README.md for its commands.
  core-cli:
    <<: [*hardening, *core-image]
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://core_provision:${PROVISION_DB_PASSWORD:?set in /srv/mhai-backend/.env}@postgres:5432/mhai?sslmode=disable
      # hospitals model-policy set checks the provider against this.
      CORE_CLOUD_PROVIDERS: ${CORE_CLOUD_PROVIDERS:-}
    mem_limit: 128m
    networks: [backend]
    depends_on:
      core-migrate: { condition: service_completed_successfully }

  # The pipeline worker, for the pilot only (profile pilot; off by default:
  # the demo never starts it and needs none of its files or variables).
  # deploy/pilot/enable-pilot.sh makes everything it needs and starts it;
  # deploy/pilot/README.md is the runbook. Without it, core still serves
  # everything else and a question fails at its 10-minute deadline. echo is
  # test-only and never comes here.
  #   - its own NATS NKey (the seed a 0400 file; its public key is
  #     NATS_PIPELINE_NKEY, the `pipeline` user in nats/nats.conf);
  #   - its own database login, intelligence_app (a member of
  #     mhai_worker_app only; core-migrate makes it when
  #     INTELLIGENCE_DB_PASSWORD is set), the password from a 0400 file;
  #   - the trusted keys read-only (trustedkeys:/trusted:ro), never corekeys;
  #   - no env_file: it must not see the core service's secrets;
  #   - on `backend` only, no published port: the egress proxy (profile
  #     cloud) is its only way out, named by INTELLIGENCE_CLOUD_PROXY (never
  #     HTTPS_PROXY), and only to the one provider's API host;
  #   - production, with INTELLIGENCE_SINGLE_HOST=on: NATS and Postgres
  #     without TLS, to the service names nats and postgres on this host
  #     only (TLS is required before any worker runs off this host);
  #   - the embedding and NLI weights baked into the image (Dockerfile
  #     target pilot), loaded offline: it has no route to Hugging Face;
  #   - one question at a time, under a memory cap (the host is small).
  # The provider and its settings come from .env (empty by default), and
  # the key is a 0400 file, never a variable. Never set any OPENAI_*,
  # ANTHROPIC_*, AZURE_OPENAI_*, XAI_* or GEMINI_* variable here.
  pipeline:
    <<: *hardening
    image: ${PIPELINE_IMAGE:-ghcr.io/measured-health/mhai-multiagent-pipeline-pilot:latest}
    pull_policy: missing
    profiles: ["pilot"]
    restart: unless-stopped
    command: ["worker", "--service", "pipeline"]
    environment:
      APP_ENV: production
      INTELLIGENCE_SINGLE_HOST: "on"
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED_PATH: /run/secrets/nats-pipeline.nk
      INTELLIGENCE_TRUSTED_KEYS_PATH: /trusted/request-keys.json
      INTELLIGENCE_DB_URL: postgres://postgres:5432/mhai?sslmode=disable
      INTELLIGENCE_DB_USER: intelligence_app
      INTELLIGENCE_DB_PASSWORD_FILE: /run/secrets/intelligence-db-password
      INTELLIGENCE_MODEL_CLIENT: orchestrator
      INTELLIGENCE_MAX_CONCURRENCY: "1"
      INTELLIGENCE_WARMUP_PAGE: /app/warmup/page.png   # shipped in the image
      # The weights are in the image; nothing is downloaded.
      HF_HOME: /home/appuser/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      # The cloud route (deploy/README.md, "Cloud models").
      INTELLIGENCE_CLOUD_PROXY: http://egress-proxy:3128
      INTELLIGENCE_CLOUD_PROVIDERS: ${PILOT_CLOUD_PROVIDER:-}
      INTELLIGENCE_CLOUD_ANTHROPIC_MODEL: ${PILOT_ANTHROPIC_MODEL:-}
      INTELLIGENCE_CLOUD_ANTHROPIC_KEY_FILE: ${PILOT_ANTHROPIC_KEY_FILE:-}
      INTELLIGENCE_CLOUD_ANTHROPIC_ZDR_REF: ${PILOT_ANTHROPIC_ZDR_REF:-}
      INTELLIGENCE_CLOUD_GEMINI_MODEL: ${PILOT_GEMINI_MODEL:-}
      INTELLIGENCE_CLOUD_GEMINI_KEY_FILE: ${PILOT_GEMINI_KEY_FILE:-}
      INTELLIGENCE_CLOUD_GEMINI_ZDR_REF: ${PILOT_GEMINI_ZDR_REF:-}
    volumes:
      - trustedkeys:/trusted:ro
      # Each mode 0400, owned by the image's user (enable-pilot.sh).
      - ./secrets/nats-pipeline.nk:/run/secrets/nats-pipeline.nk:ro
      - ./secrets/intelligence-db-password:/run/secrets/intelligence-db-password:ro
      - ./secrets/pilot-cloud-api-key:/run/secrets/cloud-api-key:ro
    tmpfs:
      - /tmp
    cpus: 1.5
    mem_limit: 1600m
    memswap_limit: 1600m
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }
    # Health is a NATS request (pipeline.health); enable-pilot.sh checks
    # the log for the worker's start line.
    healthcheck:
      disable: true

  # The egress proxy for the cloud model providers (design section 6): the
  # only service on `egress`, the one network here with a route out. It
  # allows CONNECT to port 443 of the hosts in egress-proxy/allowed-hosts
  # and nothing else (egress-proxy/squid.conf). Off by default: it starts
  # only with `--profile cloud`, after the steps in deploy/README.md
  # ("Cloud models"). The demo never starts it and needs none of its files.
  egress-proxy:
    <<: *hardening
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    profiles: ["cloud"]
    restart: unless-stopped
    # Squid without the image's entrypoint (which writes certificates and
    # log files): no daemon, our config, as the image's proxy user.
    entrypoint: ["/usr/sbin/squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    user: "13:13"
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ${EGRESS_ALLOWED_HOSTS:-./egress-proxy/allowed-hosts}:/etc/squid/allowed-hosts:ro
    tmpfs:
      - /tmp
      - /var/run/squid
    mem_limit: 128m
    networks: [backend, egress]

  # The EMR integration (ADR 0014; EMR design §6.4). Off on the demo: the
  # demo has neither the emr NATS user nor its database login yet
  # (services/emr/README.md), so the emr service below stays commented
  # until it does. When it runs it is on backend (internal: Postgres,
  # NATS) and emr-proxy (internal: egress-emr only), with no route out;
  # it needs, as the pipeline above does, its own NATS NKey and database
  # login, the trusted keys read-only, and no env_file.
  # emr:
  #   image: ${EMR_IMAGE:-ghcr.io/measured-health/mhai-multiagent-emr:latest}
  #   profiles: ["emr"]
  #   command: ["serve"]
  #   environment:
  #     APP_ENV: staging
  #     EMR_NATS_URL: tls://nats:4222
  #     EMR_NATS_NKEY_FILE: /run/secrets/nats-emr.nk
  #     EMR_DATABASE_URL: postgres://emr_app@postgres:5432/mhai?sslmode=verify-full
  #     EMR_TRUSTED_KEYS_PATH: /trusted/request-keys.json
  #     EMR_SEAL_KEY_PATH: /emr-keys
  #     EMR_SECRETS_DIR: /emr-secrets
  #     EMR_RULE_SET_ACTIVE: ""
  #     # The only way out (never HTTPS_PROXY).
  #     EMR_PROXY_URL: http://egress-emr:3128
  #     EMR_PROXY_KEY_PATH: /run/secrets/emr-proxy.key
  #     EMR_EGRESS_DIR: /emr-egress
  #   volumes:
  #     - trustedkeys:/trusted:ro
  #     - emr-egress-conf:/emr-egress
  #     - ./secrets/emr-proxy.key:/run/secrets/emr-proxy.key:ro
  #   networks: [backend, emr-proxy]
  #   mem_limit: 256m

  # egress-emr, the emr service's own CONNECT proxy (services/emr/cmd/
  # egress-emr): the only service on egress-emr, the network with a route
  # out, and on emr-proxy, where only the emr service reaches it; never on
  # backend. Each CONNECT names its connection (Proxy-Authorization from
  # K_proxy) and reaches only that connection's hosts; a name is resolved
  # once and the checked address dialled. With no fresh allow-list (written
  # by the emr service) it refuses everything. Off by default (profile
  # emr); the demo never starts it. K_proxy is the 0400 file
  # secrets/emr-proxy.key owned by 65532 (emr keys proxy-init writes one).
  # EGRESS_EMR_INTERNAL_CIDRS must be set in .env: the backend network's
  # subnet (docker network inspect mhai-backend_backend) and the host's own
  # addresses (its VPC address, /32), never reached even when declared. It
  # runs as production, so it refuses to start without them. The backend
  # network keeps its subnet (fixing one would recreate it under the demo).
  egress-emr:
    <<: *hardening
    image: ${EMR_IMAGE:-ghcr.io/measured-health/mhai-multiagent-emr:latest}
    pull_policy: missing
    profiles: ["emr"]
    restart: unless-stopped
    entrypoint: ["/egress-emr"]
    command: []
    user: "65532:65532"
    environment:
      EGRESS_EMR_ALLOW_LIST: /emr-egress/allow.json
      EGRESS_EMR_KEY_PATH: /run/secrets/emr-proxy.key
      EGRESS_EMR_ENV: production
      EGRESS_EMR_INTERNAL_CIDRS: ${EGRESS_EMR_INTERNAL_CIDRS:-}
    volumes:
      - emr-egress-conf:/emr-egress:ro
      - ${EMR_PROXY_KEY_FILE:-./secrets/emr-proxy.key}:/run/secrets/emr-proxy.key:ro
    mem_limit: 64m
    networks: [emr-proxy, egress-emr]

networks:
  # No route out: Postgres and NATS can't reach anything but each other and
  # core, and nothing reaches them from the host.
  backend:
    internal: true
  # Only for the loopback ports of core and NATS.
  edge: {}
  # The egress proxy's way out, and only its (profile cloud).
  egress: {}
  # The emr service and egress-emr only, no route out (profile emr).
  emr-proxy:
    internal: true
  # egress-emr's way out, and only its (profile emr).
  egress-emr: {}
  # Shared with the frontend's compose project (mhai-web), made by
  # setup-host.sh with --internal. Only NATS is on it here: the BFF reaches
  # it as mhai-nats:4222 and nothing else in this stack.
  bff:
    external: true
    name: mhai-bff

# Made once by setup-host.sh (trustedkeys also by the deploy workflow, if
# missing). External, so `docker compose down -v` can never delete the
# database, the JetStream store or the signing keys.
volumes:
  pgdata:
    external: true
    name: mhai-backend-pgdata
  natsdata:
    external: true
    name: mhai-backend-natsdata
  corekeys:
    external: true
    name: mhai-backend-corekeys
  # Public keys only (the request-token trusted-keys file).
  trustedkeys:
    external: true
    name: mhai-backend-trustedkeys
  # The allow-list the emr service writes and egress-emr reads (profile
  # emr); rewritten every 15 s, so not external.
  emr-egress-conf: {}
