# app-link: the intelligence host's only way to the app host
# (docs/deploy/remote-intelligence.md, decision D5). A plain TCP relay: it
# forwards two ports to one address, APP_HOST_ADDR (from .env, checked by
# enable-intelligence-host.sh), and nothing else. TLS runs from the worker to
# NATS and to Postgres through it, so it only ever sees ciphertext; the
# worker checks the app host's certificates (name mhai-app, our CA) itself.
global
  maxconn 64
  log stdout format raw local0 notice

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  # NATS pings every 2 minutes; the worker's database pool recycles idle
  # connections well inside an hour.
  timeout client 1h
  timeout server 1h
  option clitcpka
  option srvtcpka

frontend nats
  bind :4222
  default_backend nats

backend nats
  server app "${APP_HOST_ADDR}:4222"

frontend postgres
  bind :5432
  default_backend postgres

backend postgres
  server app "${APP_HOST_ADDR}:5432"
