name: Deploy backend demo

# After CI passes on main: build the backend images (core, intelligence,
# notifications) in GitHub for linux/amd64 and linux/arm64, each natively on
# its own runner, push them to GHCR as one multi-arch tag (latest and
# sha-<commit>), then have the preview host pull them and restart the backend
# stack (/srv/mhai-backend: Postgres, NATS, migrations, core). Each host
# pulls its own architecture from the same tag, so the demo can run on an
# arm64 (Graviton) or an x86_64 server. Building on the host is avoided on
# purpose. See deploy/README.md.

on:
  # Guarded below: only a green CI run of a push to this repository's own main.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-demo
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # One leg per image and architecture, each on a native runner (no QEMU).
  # Each pushes its image by digest only; merge below puts the two digests
  # of an image under the tags the hosts pull.
  build:
    # Only a green CI run for a push to this repository's main. The branch
    # filter above matches by name alone, so a fork's PR from a branch called
    # "main" would otherwise build (and deploy) untrusted code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      matrix:
        image: [core, intelligence, notifications]
        arch: [amd64, arm64]
        include:
          # Core requires services/gokit, so the context is services/ (ADR 0014).
          - image: core
            context: services
            file: services/core/Dockerfile
          # The public demo's sample-answer worker (deploy/demo/enable-demo.sh,
          # compose service sample-ai): the intelligence image's default
          # runtime target, CPU PyTorch. The sample path loads no model;
          # nothing is downloaded at run time.
          - image: intelligence
            context: services/intelligence
            file: services/intelligence/Dockerfile
            target: runtime
            build-args: TORCH=cpu
          # The notifications service (compose profile notifications,
          # deploy/README.md "Turn on email for the demo"): published on every
          # deploy, started on a host only when its .env has
          # NOTIFY_ENABLED=true. It requires services/gokit, as core.
          - image: notifications
            context: services
            file: services/notifications/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}-${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.name.outputs.value }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.value }},push-by-digest=true,name-canonical=true,push=true
          # arm64 keeps the cache scope it had when only arm64 was built.
          cache-from: type=gha,scope=${{ matrix.arch == 'arm64' && matrix.image || format('{0}-amd64', matrix.image) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch == 'arm64' && matrix.image || format('{0}-amd64', matrix.image) }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per image: one multi-arch tag over the amd64 and arm64 digests, under the
  # same tags as before (latest, sha-<commit>), so each host pulls its own
  # architecture from the same name.
  merge:
    needs: [build]
    strategy:
      matrix:
        image: [core, intelligence, notifications]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}-${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.name.outputs.value }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Push the multi-arch tags
        env:
          IMAGE_NAME: ${{ steps.name.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          n=$(find . -maxdepth 1 -type f | wc -l)
          [ "$n" = 2 ] || { echo "::error::expected 2 digests (amd64, arm64), found $n"; exit 1; }
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          for d in *; do args+=("$IMAGE_NAME@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

  deploy:
    needs: [merge]
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      # The instance pulls the core image with this job's token.
      packages: read
    # Set the repository variable DEPLOY_ENABLED=true once the instance is
    # set up (deploy/README.md). Until then this workflow only publishes the
    # image.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # The compose file, the NATS config and the pre-migration check of
      # this commit go to the instance with the deploy, so the host never
      # runs a stale config. None holds a secret.
      - name: Bundle the deploy config
        id: bundle
        run: |
          set -euo pipefail
          b=$(tar -C deploy -czf - compose.yml nats/nats.conf premigrate-check.sh demo/enable-demo.sh demo/reset-demo.sh \
            notifications/enable-notifications.sh | base64 -w0)
          echo "value=$b" >> "$GITHUB_OUTPUT"

      # Without a host-key check the SSH step would trust whatever answers at
      # DEPLOY_HOST, and hand it the GHCR token. Refuse to deploy without one.
      - name: Require the host key fingerprint
        env:
          FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          case "$FINGERPRINT" in
            SHA256:?*) echo "Host key fingerprint set." ;;
            *) echo "::error::Secret DEPLOY_HOST_FINGERPRINT is missing or not SHA256:... (deploy/README.md)"; exit 1 ;;
          esac

      - name: Pull and restart on the instance
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Short-lived and scoped to this repo's packages; expires with the job.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_BUNDLE: ${{ steps.bundle.outputs.value }}
          # The demo's sample answers: on unless the repository variable
          # DEMO_SAMPLE_AI is off (deploy/README.md, "Public demo").
          DEMO_SAMPLE_AI: ${{ vars.DEMO_SAMPLE_AI == 'off' && 'off' || 'on' }}
        with:
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_BUNDLE,DEMO_SAMPLE_AI
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host's ECDSA key, as "SHA256:..." (deploy/README.md).
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /srv/mhai-backend
            if [ ! -f .env ] || [ ! -f secrets/nats-gateway.nk ]; then
              echo "The instance is not set up: run deploy/setup-host.sh first (deploy/README.md)."
              exit 1
            fi

            before=$(sha256sum nats/nats.conf 2>/dev/null || true)
            printf '%s' "$DEPLOY_BUNDLE" | base64 -d | tar -xzf - -C /srv/mhai-backend
            docker compose config --quiet
            # NATS reads its config at start: recreate it when the file
            # changed. A restart would keep the container's old environment,
            # and the config names its NKeys as variables (a new one, such as
            # NATS_BFF_PLATFORM_NKEY, would be undefined and NATS would not
            # start). `up -d core` below waits for nats to be healthy.
            if [ "$before" != "$(sha256sum nats/nats.conf)" ] && [ -n "$(docker compose ps -q nats)" ]; then
              echo "nats.conf changed; recreating nats"
              docker compose up -d --force-recreate --no-deps nats
            fi

            # Volumes added since setup-host.sh first ran (it makes them too):
            # created empty, so the image fills them on first mount.
            for v in mhai-backend-trustedkeys; do
              if ! docker volume inspect "$v" >/dev/null 2>&1; then
                docker volume create --label org.measured-health.stack=mhai-backend "$v" >/dev/null
                echo "created volume $v"
              fi
            done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull core

            # Migration 00007 (Plan 3) validates existing clinical_queries
            # rows: stop here, before anything migrates, if one doesn't fit.
            bash premigrate-check.sh

            # Migrations and the keys run first (depends_on); a failed
            # migration stops here and leaves the running core alone.
            if ! docker compose up -d --remove-orphans core; then
              echo "Start failed. Recent logs:"
              docker compose logs --tail=80 postgres nats core-migrate core-keys core-request-key core
              exit 1
            fi
            docker compose logs --no-log-prefix core-migrate | tail -n 20

            # Straight to the container on loopback: the service is up, and
            # Postgres, NATS and every KV bucket answer.
            port=$(sed -n 's/^CORE_HOST_PORT=\([0-9][0-9]*\)$/\1/p' .env | tail -n1)
            port=${port:-8092}
            ok=0
            for _ in $(seq 1 24); do
              live=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/v1/healthz" || echo 000)
              ready=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/v1/readyz" || echo 000)
              if [ "$live" = 200 ] && [ "$ready" = 200 ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "Backend unhealthy (healthz=$live, readyz=$ready). Recent logs:"
              docker compose logs --tail=120 core
              exit 1
            fi
            echo "Backend healthy."

            # Email (profile notifications): only when .env says
            # NOTIFY_ENABLED=true (deploy/notifications/enable-notifications.sh
            # sets it, after the key and password files exist). Otherwise
            # the profile stays down, and is stopped if it was running.
            notify=$(sed -n 's/^NOTIFY_ENABLED=\(.*\)$/\1/p' .env | tail -n1)
            if [ "$notify" = true ]; then
              for f in secrets/nats-notifications.nk secrets/smtp_password; do
                if [ ! -f "$f" ]; then
                  echo "NOTIFY_ENABLED=true but $f is missing: run notifications/enable-notifications.sh (deploy/README.md)."
                  exit 1
                fi
              done
              docker compose --profile notifications pull notifications mail-relay
              if ! docker compose --profile notifications up -d mail-relay notifications; then
                docker compose --profile notifications logs --tail=60 notifications mail-relay
                exit 1
              fi
              started=0
              for _ in $(seq 1 24); do
                if docker compose --profile notifications logs --no-log-prefix notifications 2>/dev/null | grep -q 'notifications serving'; then started=1; break; fi
                sleep 5
              done
              if [ "$started" != 1 ]; then
                echo "The notifications service did not start. Recent logs:"
                docker compose --profile notifications logs --tail=60 notifications mail-relay
                exit 1
              fi
              echo "Notifications running."
            elif [ -n "$(docker compose --profile notifications ps -q notifications mail-relay 2>/dev/null)" ]; then
              docker compose --profile notifications stop notifications mail-relay
              docker compose --profile notifications rm -f notifications mail-relay
              echo "NOTIFY_ENABLED is not true: notifications stopped."
            fi

            # The public demo: the seeded demo hospital and accounts, and the
            # sample answers (deploy/README.md, "Public demo: sample answers").
            DEMO_SAMPLE_AI="$DEMO_SAMPLE_AI" bash demo/enable-demo.sh

            # Only this repository's dangling images; other stacks' are left alone.
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/Measured-Health/mhai-multiagent" >/dev/null || true
