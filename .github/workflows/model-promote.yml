name: Model promotion

# Promote a trained run into the model store (plan Task 24, design section 7.3). Dispatch
# it twice: first without expect_files (a dry run: the files hash, the evaluation and its
# report, nothing written to the store), then with expect_files set to the dry run's
# files hash (the promotion: the same files, evaluated again on the locked split, uploaded
# and signed). The version is then pinned by a normal PR (mhai-models pin); lock-check
# verifies it there, and one reviewer's approval is the sign-off.
#
# No environment: the store's writer and reader and the signing key are repository
# secrets (TODO.md, "Before scale"). Every input reaches the shell only through env:,
# quoted, and the CLI checks every name again before any I/O (P18).
#
# Rehearsal mode: while the repository variable MODEL_STORE_ENDPOINT is empty, the job
# starts MinIO from docker-compose.models.yml, builds a small test split with an in-job
# development key, and forces source local-fixture and the rehearsal gate, in development
# (both switches). The job summary says "rehearsal". Outside rehearsal mode both switches
# are production, and the production secrets reach a step only then. The job runs on main
# only.
#
# Gate answer (role cca, own answer model plan PR 2): the run's GGUF itself is scored
# through llama-server, built here at llama.cpp's pinned commit (the export step's), on
# loopback and offline. The retriever and NLI models the answer checks use are downloaded
# first at the exact revisions in models/answer-gate-models.lock and verified file by file
# against its hashes; the evaluation loads them from that folder only, hub offline. Production mode only
# (rehearsal mode forces the rehearsal gate, a document gate).

on:
  workflow_dispatch:
    inputs:
      name:
        description: Model name (^[a-z0-9][a-z0-9-]{1,62}$)
        required: true
        type: string
      version:
        description: Version to promote (semver)
        required: true
        type: string
      run:
        description: Run id (^[A-Za-z0-9_-]{1,64}$)
        required: true
        type: string
      source:
        description: Where the run is
        required: true
        type: choice
        options: [drive, hf, local-fixture]
      hf_repo:
        description: Hugging Face repo (source hf)
        required: false
        type: string
      hf_revision:
        description: Hugging Face commit sha (source hf)
        required: false
        type: string
      gate:
        description: Gate the promotion is measured against
        required: true
        type: choice
        options: [phase1, phase3, answer, rehearsal]
      expect_files:
        description: The dry run's files hash; empty for a dry run
        required: false
        type: string

permissions: {}

concurrency:
  group: model-promote-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  promote:
    # Main only: the repository secrets below reach this job from main's dispatch only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      REHEARSAL: ${{ vars.MODEL_STORE_ENDPOINT == '' }}
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      RUN: ${{ inputs.run }}
      SOURCE_INPUT: ${{ inputs.source }}
      GATE_INPUT: ${{ inputs.gate }}
      HF_REPO: ${{ inputs.hf_repo }}
      HF_REVISION: ${{ inputs.hf_revision }}
      EXPECT_FILES: ${{ inputs.expect_files }}
    steps:
      - name: Main only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] ||
            { echo "::error::this job runs on main only (ref $REF refused)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install
        working-directory: services/intelligence
        run: uv sync --locked

      - name: Mode
        run: |
          case "$REHEARSAL" in true | false) ;; *) echo "::error::bad mode"; exit 1 ;; esac
          # The names the CLI checks again; RUN also names a folder in rehearsal mode.
          [[ "$NAME" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || { echo "::error::bad name"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$RUN" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "::error::bad run id"; exit 1; }
          [[ -z "$EXPECT_FILES" || "$EXPECT_FILES" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::bad expect_files"; exit 1; }
          if [ "$REHEARSAL" = true ]; then
            {
              echo MHAI_MODELS_ENV=development
              echo APP_ENV=development
              echo SOURCE=local
              echo GATE=rehearsal
            } >>"$GITHUB_ENV"
            echo '## rehearsal: no production store; source local-fixture, gate rehearsal, development key' >>"$GITHUB_STEP_SUMMARY"
          else
            case "$SOURCE_INPUT" in
              drive | hf) source="$SOURCE_INPUT" ;;
              *) echo "::error::local-fixture is for rehearsal only"; exit 1 ;;
            esac
            # P14: production promotions are measured against a production gate only.
            case "$GATE_INPUT" in phase1 | phase3 | answer) ;; *) echo "::error::the rehearsal gate is for rehearsal mode only"; exit 1 ;; esac
            {
              echo MHAI_MODELS_ENV=production
              echo APP_ENV=production
              echo "SOURCE=$source"
              echo "GATE=$GATE_INPUT"
              echo MHAI_EVAL_ROLE=locked
              echo "MHAI_MODELS_TESTSETS_LOCK=$GITHUB_WORKSPACE/models/testsets.lock"
              echo "MHAI_MODELS_TRUST_POLICY=$GITHUB_WORKSPACE/models/trust-policy.json"
            } >>"$GITHUB_ENV"
          fi

      # The store's settings and both roles' throwaway passwords go to $GITHUB_ENV, masked.
      - name: Rehearsal store
        if: env.REHEARSAL == 'true'
        working-directory: services/intelligence
        run: uv run --no-sync scripts/rehearse-promotion.sh store-up "$GITHUB_ENV" writer reader

      - name: Rehearsal key, test split and fixture run
        if: env.REHEARSAL == 'true'
        working-directory: services/intelligence
        run: uv run --no-sync scripts/rehearse-promotion.sh prepare "$RUNNER_TEMP/rehearsal" "$NAME" "$RUN" "$GITHUB_ENV"

      # The answer gate's runtime: llama-server at the pinned commit (LLAMA_CPP_COMMIT in
      # intelligence/doceval/answers/llama_runtime.py), built without curl, so it cannot
      # fetch a model. Then the answer checks' retriever and NLI models, pinned and verified.
      - name: llama.cpp and the answer checks' models (answer gate)
        if: env.GATE == 'answer'
        working-directory: services/intelligence
        env:
          LLAMA_CPP_COMMIT: b1b770d90d94cad9e9ea5b993bdbc383a522fb28
        run: |
          src="$RUNNER_TEMP/llama.cpp"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$LLAMA_CPP_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$LLAMA_CPP_COMMIT" ] || { echo "::error::llama.cpp commit"; exit 1; }
          cmake -S "$src" -B "$src/build" -DLLAMA_CURL=OFF -DLLAMA_BUILD_IS_DEV=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --target llama-server -j 4
          echo "MHAI_LLAMA_SERVER=$src/build/bin/llama-server" >>"$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/gate-models"
          uv run --no-sync python -m intelligence.doceval.answers.gate_models fetch "$RUNNER_TEMP/gate-models"
          echo "MHAI_ANSWER_GATE_MODELS=$RUNNER_TEMP/gate-models" >>"$GITHUB_ENV"

      # A short-lived, read-only Drive token from the service account's key (repository
      # secret MODEL_DRIVE_SA_KEY); the CLI runs drive_check before it reads the run.
      - name: Drive token
        id: drive
        if: env.REHEARSAL == 'false' && env.SOURCE == 'drive'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.MODEL_DRIVE_SA_KEY || '' }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Dry run or promote
        working-directory: services/intelligence
        env:
          P_ENDPOINT: ${{ vars.MODEL_STORE_ENDPOINT != '' && vars.MODEL_STORE_ENDPOINT || '' }}
          P_BUCKET: ${{ vars.MODEL_STORE_ENDPOINT != '' && vars.MODEL_STORE_BUCKET || '' }}
          P_REGION: ${{ vars.MODEL_STORE_ENDPOINT != '' && vars.MODEL_STORE_REGION || '' }}
          P_DRIVE_FOLDER: ${{ vars.MODEL_STORE_ENDPOINT != '' && vars.MODEL_DRIVE_FOLDER_ID || '' }}
          P_DRIVE_TOKEN: ${{ steps.drive.outputs.access_token }}
          P_READER_ACCESS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MODEL_STORE_ENDPOINT != '' && secrets.MODEL_STORE_READER_ACCESS_KEY || '' }}
          P_READER_SECRET: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MODEL_STORE_ENDPOINT != '' && secrets.MODEL_STORE_READER_SECRET_KEY || '' }}
          P_WRITER_ACCESS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MODEL_STORE_ENDPOINT != '' && inputs.expect_files != '' && secrets.MODEL_STORE_WRITER_ACCESS_KEY || '' }}
          P_WRITER_SECRET: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MODEL_STORE_ENDPOINT != '' && inputs.expect_files != '' && secrets.MODEL_STORE_WRITER_SECRET_KEY || '' }}
          P_SIGNING_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MODEL_STORE_ENDPOINT != '' && inputs.expect_files != '' && secrets.MHAI_MODELS_SIGNING_KEY || '' }}
        run: |
          if [ "$REHEARSAL" != true ]; then
            export MODEL_STORE_ENDPOINT="$P_ENDPOINT" MODEL_STORE_BUCKET="$P_BUCKET"
            export MODEL_STORE_REGION="$P_REGION" MHAI_MODELS_DRIVE_FOLDER_ID="$P_DRIVE_FOLDER"
            export MODEL_STORE_READER_ACCESS_KEY="$P_READER_ACCESS"
            export MODEL_STORE_READER_SECRET_KEY="$P_READER_SECRET"
            if [ -n "$P_DRIVE_TOKEN" ]; then
              printf '%s' "$P_DRIVE_TOKEN" >"$RUNNER_TEMP/drive-token"
              chmod 600 "$RUNNER_TEMP/drive-token"
              export MHAI_MODELS_DRIVE_TOKEN_FILE="$RUNNER_TEMP/drive-token"
            fi
            if [ -n "$EXPECT_FILES" ]; then
              export MODEL_STORE_WRITER_ACCESS_KEY="$P_WRITER_ACCESS"
              export MODEL_STORE_WRITER_SECRET_KEY="$P_WRITER_SECRET"
              # The signing key, in a file only this job's user can read.
              (umask 077 && printf '%s\n' "$P_SIGNING_KEY" >"$RUNNER_TEMP/signing-key.pem")
              export MHAI_MODELS_SIGNER="$RUNNER_TEMP/signing-key.pem"
            fi
          fi
          args=(promote "$NAME" "$VERSION" --source "$SOURCE" --run "$RUN" --gate "$GATE")
          if [ "$SOURCE" = hf ]; then
            args+=(--hf-repo "$HF_REPO" --hf-revision "$HF_REVISION")
          fi
          install -d -m 700 "$RUNNER_TEMP/report" "$RUNNER_TEMP/summary"
          code=0
          if [ -z "$EXPECT_FILES" ]; then
            what="dry run"
            out="$(uv run --no-sync mhai-models "${args[@]}" --dry-run --report-dir "$RUNNER_TEMP/report")" || code=$?
          else
            what="promotion"
            # Rehearsal: the writer comes from the rehearsal store, the key from prepare.
            out="$(uv run --no-sync mhai-models "${args[@]}" --expect-files "$EXPECT_FILES")" || code=$?
          fi
          rm -f "$RUNNER_TEMP/signing-key.pem" "$RUNNER_TEMP/drive-token"
          printf '%s\n' "$out" | tee "$RUNNER_TEMP/summary/promote.json"
          { echo "### $what"; echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          [ "$code" -eq 0 ] || exit "$code"
          if [ -z "$EXPECT_FILES" ]; then
            # The aggregate-only renderer: metrics per field and gate verdicts, no document rows.
            if [ "$GATE" = answer ]; then
              uv run --no-sync python -m intelligence.doceval.answers.report "$RUNNER_TEMP/report/evaluation.json" >"$RUNNER_TEMP/summary/evaluation.md"
            else
              uv run --no-sync mhai-doceval report "$RUNNER_TEMP/report/evaluation.json" >"$RUNNER_TEMP/summary/evaluation.md"
            fi
            cat "$RUNNER_TEMP/summary/evaluation.md" >>"$GITHUB_STEP_SUMMARY"
            files="$(printf '%s' "$out" | jq -r .files_sha256)"
            [[ "$files" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no files hash"; exit 1; }
            echo "Promote with expect_files=$files" >>"$GITHUB_STEP_SUMMARY"
          fi

      # The CLI's JSON summary (names, hashes, verdicts) and the aggregate evaluation.md.
      # Never weights, pages, evaluation.json or keys.
      - name: Keep the summary and the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promote-summary
          path: |
            ${{ runner.temp }}/summary/promote.json
            ${{ runner.temp }}/summary/evaluation.md
          if-no-files-found: ignore
          retention-days: 30
