name: Pilot pipeline image

# The pipeline worker's image for the pilot on the demo host
# (deploy/pilot/README.md): services/intelligence/Dockerfile, target pilot
# (the runtime plus the pinned embedding and NLI weights, loaded offline in
# the build), for arm64 (the demo host is Graviton) or, with arch amd64, for
# an x86 intelligence host (docs/deploy/remote-intelligence.md; tags
# latest-amd64 and sha-...-amd64). Started by hand from main only; it pushes
# the image and does nothing on the host.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture: arm64 (the demo host) or amd64 (an x86 intelligence host)"
        type: choice
        options: [arm64, amd64]
        default: arm64

concurrency:
  group: pilot-image-${{ inputs.arch }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-pipeline-pilot
          tags: |
            type=raw,value=latest
            type=sha,format=long
          flavor: |
            suffix=${{ inputs.arch == 'amd64' && '-amd64' || '' }},onlatest=true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/intelligence
          target: pilot
          build-args: TORCH=cpu
          platforms: ${{ inputs.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No shared cache: the image is pushed (zizmor cache-poisoning).
          no-cache: true
