name: Model lock check

# lock-check on every PR and again on every review (an approval or a dismissal changes the
# result). A required status check (H4), so it has no path filter: a PR that changes
# neither models.lock nor models/ passes at once, before any store or GitHub access.
#
# What it trusts (D31, Task 20 and 21 reviews): main's tip for everything the check reads
# and runs (the code, reviewers.json, the trust policy, testsets.lock, the thresholds)
# and, from the PR, only the lock at its head commit, read with git from that exact
# commit. The PR's code is checked out only as git data and never installed or run. D35b:
# a PR changing the lock may change nothing but models.lock, models/, docs/ and
# CHANGELOG.md; lock-check works that out from git itself.
#
# What it can't do (D37): main's code runs, but this workflow file is the PR's
# (pull_request runs the PR's copy). A PR that edits this file, in the same PR as a lock
# change or an earlier one, can skip the check and still report a green lock-check. Only
# people and settings stop that: code-owner review of .github/, approval of the most
# recent push, and the required reviewer on model-signoff (TODO(H4) in TODO.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: model-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      # Never development: lock-check is always production (no --rehearsal here).
      MHAI_MODELS_ENV: production
      APP_ENV: production
    steps:
      - name: Check out main's tip (code and data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR's head commit (git data only, never installed or run)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install main's mhai-models
        working-directory: main/services/intelligence
        run: uv sync --locked

      - name: The head lock, from the head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha"; exit 1; }
          git -C main fetch --no-tags --quiet "$GITHUB_WORKSPACE/head" HEAD
          [ "$(git -C main rev-parse --verify 'FETCH_HEAD^{commit}')" = "$HEAD_SHA" ] ||
            { echo "::error::the fetched head is not the PR's head sha"; exit 1; }
          # A PR that deletes models.lock fails here: never an empty or absent head lock.
          git -C main show "$HEAD_SHA:models.lock" >"$RUNNER_TEMP/head.lock"

      - name: lock-check
        working-directory: main/services/intelligence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_STORE_ENDPOINT: ${{ vars.MODEL_STORE_ENDPOINT }}
          MODEL_STORE_BUCKET: ${{ vars.MODEL_STORE_BUCKET }}
          MODEL_STORE_REGION: ${{ vars.MODEL_STORE_REGION }}
          # The read-only reader; fork PRs get no secrets and are refused on a pin.
          MODEL_STORE_READER_ACCESS_KEY: ${{ secrets.MODEL_STORE_READER_ACCESS_KEY }}
          MODEL_STORE_READER_SECRET_KEY: ${{ secrets.MODEL_STORE_READER_SECRET_KEY }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]{1,10}$ ]] || { echo "::error::bad PR number"; exit 1; }
          main="$GITHUB_WORKSPACE/main"
          code=0
          out="$(uv run --no-sync mhai-models lock-check \
            --base-dir "$main" \
            --head "$RUNNER_TEMP/head.lock" \
            --head-sha "$HEAD_SHA" \
            --pr "$PR_NUMBER" \
            --testsets "$main/models/testsets.lock" \
            --thresholds-dir "$main/services/intelligence/intelligence/doceval/thresholds")" || code=$?
          printf '%s\n' "$out"
          { echo '### lock-check'; echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"
