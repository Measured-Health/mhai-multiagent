name: Model lock check

# lock-check on every PR: an ordinary CI check, no environment. It compares main's
# models.lock (the base) with the PR's and verifies every changed role against the model
# store as the read-only reader: the signed manifest, every file's hash, the gate and, for
# a new version, its evaluation. A PR that changes no role passes at once, with no store
# access. One reviewer approving the PR is the sign-off (TODO.md, "Before scale").
#
# The trust policy, the test-set lock and the thresholds are main's when main has them,
# so a PR can't trust a key, a test split or a lower bar it adds in the same change. A
# rollback counts as one only to an entry main pinned before (main's models.lock history,
# from git); anything else is evaluated in full.
#
# Accepted startup risk (TODO.md, "Before scale"): this job runs the PR's own code, so a
# PR that edits lock-check (or this file) can pass itself. The safety net is the reviewer
# who approves the PR, and the AI service, which still verifies every pin's signature
# against the deployed trust policy and every file's hash before it loads a model.

on:
  pull_request:

permissions: {}

concurrency:
  group: model-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Never development: lock-check is always production (no --rehearsal here).
      MHAI_MODELS_ENV: production
      APP_ENV: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # main's lock and trust policy, from git
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install
        working-directory: services/intelligence
        run: uv sync --locked

      - name: Main's lock, its history, trust policy, test splits and thresholds
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$RUNNER_TEMP/main"
          mkdir -p "$base"
          # Every models.lock main has held, one per line (a deletion leaves no line).
          git log --first-parent --format=%H "origin/$BASE_REF" -- models.lock | while read -r c; do
            git show "$c:models.lock" 2>/dev/null || true
          done >"$base/history"
          if git show "origin/$BASE_REF:models/testsets.lock" >"$base/testsets.lock" 2>/dev/null; then
            echo "TESTSETS=$base/testsets.lock" >>"$GITHUB_ENV"
          else
            echo "TESTSETS=$GITHUB_WORKSPACE/models/testsets.lock" >>"$GITHUB_ENV"
          fi
          thresholds=services/intelligence/intelligence/doceval/thresholds
          if git archive "origin/$BASE_REF" "$thresholds" 2>/dev/null | tar -x -C "$base"; then
            echo "THRESHOLDS=$base/$thresholds" >>"$GITHUB_ENV"
          else
            echo "THRESHOLDS=$GITHUB_WORKSPACE/$thresholds" >>"$GITHUB_ENV"
          fi
          # No models.lock on main yet: the empty lock (nothing pinned).
          git show "origin/$BASE_REF:models.lock" >"$base/models.lock" 2>/dev/null ||
            printf '%s\n' '{"models":{},"schema":"mhai.models.lock/1"}' >"$base/models.lock"
          if git show "origin/$BASE_REF:models/trust-policy.json" >"$base/trust-policy.json" 2>/dev/null; then
            echo "TRUST_POLICY=$base/trust-policy.json" >>"$GITHUB_ENV"
          else
            echo "TRUST_POLICY=$GITHUB_WORKSPACE/models/trust-policy.json" >>"$GITHUB_ENV"
          fi

      - name: lock-check
        working-directory: services/intelligence
        env:
          MODEL_STORE_ENDPOINT: ${{ vars.MODEL_STORE_ENDPOINT }}
          MODEL_STORE_BUCKET: ${{ vars.MODEL_STORE_BUCKET }}
          MODEL_STORE_REGION: ${{ vars.MODEL_STORE_REGION }}
          # The read-only reader; fork PRs get no secrets and are refused on a pin.
          MODEL_STORE_READER_ACCESS_KEY: ${{ secrets.MODEL_STORE_READER_ACCESS_KEY }}
          MODEL_STORE_READER_SECRET_KEY: ${{ secrets.MODEL_STORE_READER_SECRET_KEY }}
        run: |
          code=0
          out="$(uv run --no-sync mhai-models lock-check \
            --base "$RUNNER_TEMP/main/models.lock" \
            --head "$GITHUB_WORKSPACE/models.lock" \
            --history "$RUNNER_TEMP/main/history" \
            --trust-policy "$TRUST_POLICY" \
            --testsets "$TESTSETS" \
            --thresholds-dir "$THRESHOLDS")" || code=$?
          printf '%s\n' "$out"
          { echo '### lock-check'; echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"
