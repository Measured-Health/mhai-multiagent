name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Python service is a uv project in its own directory (ADR 0002).
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover compares against the base branch

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lockfile is current
        run: uv lock --check

      # The contract in proto/ (spec 6.3): buf lint, buf breaking against
      # origin/main (fetch-depth 0 above; skipped only while main has no
      # proto/), and the committed generated code matches a fresh
      # `make proto`. Runs from the repository root.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install buf and protoc-gen-go
        working-directory: .
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Protobuf lint, breaking and generated code
        working-directory: .
        run: make proto-check

      # The workflows: actionlint (syntax, expressions, shellcheck of run: blocks) and
      # zizmor (template injection, unpinned actions, excessive permissions, ...).
      - name: Workflow lint
        working-directory: .
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Workflow security (zizmor)
        run: uv run zizmor --offline ../../.github/workflows

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy
      # Tests marked boundary need Docker and run in intelligence-boundary;
      # store (MinIO) and slow (a full-size synthetic set, several GB) run on
      # the build server. The coverage job combines both runs before
      # diff-cover (F17).
      - name: Test
        env:
          COVERAGE_FILE: coverage.checks
        run: uv run pytest -m "not models and not boundary and not store and not slow" --cov=intelligence --cov-report=

      - name: Keep the coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-checks
          path: services/intelligence/coverage.checks
          retention-days: 1

  # Spec section 12: the Python tests marked boundary, against Postgres 16
  # and NATS 2.10 (testcontainers) with the real services/nats/nats.conf,
  # and core's migrations from the mhai-core image.
  intelligence-boundary:
    runs-on: ubuntu-latest  # ships Docker
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Build the core image (migrations)
        working-directory: .
        run: docker build -t mhai-core:test -f services/core/Dockerfile services
      - name: Boundary tests
        env:
          COVERAGE_FILE: coverage.boundary
        run: uv run pytest -m boundary tests/boundary --cov=intelligence --cov-report=
      - name: Keep the coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-boundary
          path: services/intelligence/coverage.boundary
          retention-days: 1

  # diff-cover on both runs together: boundary code is covered mostly by
  # the Docker tests, the rest by checks. pb/ is omitted (pyproject.toml).
  coverage:
    if: github.event_name == 'pull_request'
    needs: [checks, intelligence-boundary]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover compares against the base branch
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked --no-default-groups --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: services/intelligence
      - name: Combine
        run: |
          uv run coverage combine coverage.checks coverage.boundary
          uv run coverage xml
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=80

  # Plan Task 24: the whole model promotion flow on MinIO from docker-compose.models.yml,
  # with development keys made in $RUNNER_TEMP and GitHub's answers from a file
  # (services/intelligence/scripts/rehearse-promotion.sh), then the store tests. Synthetic
  # data only; no credential outside this job's throwaway MinIO.
  model-promotion-e2e:
    runs-on: ubuntu-latest  # ships Docker and Compose
    defaults:
      run:
        working-directory: services/intelligence
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked
      # The store's settings and the five roles' throwaway passwords go to $GITHUB_ENV, masked.
      - name: Rehearsal store
        run: uv run --no-sync scripts/rehearse-promotion.sh store-up "$GITHUB_ENV" promoter signoff reader eval-reader eval-writer
      - name: Rehearse the promotion flow
        run: uv run --no-sync scripts/rehearse-promotion.sh run
      - name: Store tests (MinIO with testcontainers)
        run: uv run --no-sync pytest -q -m store tests/modelstore

  core:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: services/core/go.mod
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags integration ./...
      - name: Integration tests with the test-only fixture routes
        run: go test -race -tags "integration test" ./...
      # Plan 7c (A7, R41a-5): the analytics history properties at full size
      # (500 guard-level histories, the unions and the JSON-side set check).
      # The -race runs above use smaller samples to fit Go's package limit.
      - name: Analytics history properties (full size)
        run: >
          go test -count=1 -timeout 30m
          -run 'TestHistoryAnchoredAtOnboarding|TestUnionsOfHiddenWeeksMeasured|TestFullyHiddenAlwaysPasses|TestHistoryFromRouteJSON|TestHistorySetsFromRouteJSON'
          ./internal/smallgroup/...
      # The smoke test runs in boundary-smoke; here it only has to build.
      - name: Vet the smoke test
        run: go vet -tags smoke ./internal/smoke/...

  # The Go module core and the emr service share (ADR 0014): a defect here
  # reaches both.
  gokit:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/gokit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: services/gokit/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags integration ./...

  # The emr service (ADR 0014). Its integration tests run on core's
  # migrations (internal/testpg).
  emr:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/emr
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache-dependency-path: services/emr/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags integration ./...

  # ADR 0012: a breaking change to the HTTP contract needs a new major
  # version (/api/v2), so it may not change /api/v1 in place.
  openapi-breaking:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No breaking change against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:services/core/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml" || : > "$RUNNER_TEMP/base-openapi.yaml"
          .github/scripts/openapi-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" services/core/openapi.yaml

  # Build the image when anything that goes into it changes, so a bad base
  # image or dependency bump fails here rather than at deploy time.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's changed files
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            image:
              - .github/workflows/ci.yml
              - services/intelligence/Dockerfile
              - services/intelligence/.dockerignore
              - services/intelligence/README.md
              - services/intelligence/pyproject.toml
              - services/intelligence/uv.lock
              - services/intelligence/intelligence/**
              - services/intelligence/warmup/**
            go_image:
              - .github/workflows/ci.yml
              - services/.dockerignore
              - services/core/**
              - services/gokit/**
              - services/emr/**
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.changes.outputs.image == 'true'
      # Layers are cached between runs, so only changed layers rebuild.
      - name: Build CPU image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/intelligence
          build-args: TORCH=cpu
          load: true
          tags: mhai-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm mhai-intelligence:ci --help
          docker run --rm --entrypoint python mhai-intelligence:ci -c "import intelligence.agents, intelligence.security.hipaa"
      # F13: the generated operations table and catalogue are package data,
      # so the installed (not editable) image loads them without a mount.
      - name: The image ships the warm-up page
        if: steps.changes.outputs.image == 'true'
        run: docker run --rm --entrypoint test mhai-intelligence:ci -s /app/warmup/page.png
      - name: The image ships operations.json and catalogue.json
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm --entrypoint python mhai-intelligence:ci -c "
          from intelligence.boundary.operations import Operations, clinical_roles
          ops = Operations.load(development=False)
          assert ops.for_subject('inference.v1.pipeline.health') is not None
          assert ops.for_subject('inference.v1.echo.ping') is None  # test-only, left out in production
          assert clinical_roles()
          print('operations.json and catalogue.json load from the installed package')
          "

      # The Go images build from services/ (they require services/gokit,
      # ADR 0014), as the deploy workflow builds core.
      - name: Build the core image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-core:ci -f services/core/Dockerfile services
          out=$(docker run --rm mhai-core:ci help 2>&1 || true)
          case "$out" in "usage: core"*) echo "the core image runs" ;; *) echo "::error::the core image doesn't run"; exit 1 ;; esac
      - name: Build the emr image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-emr:ci -f services/emr/Dockerfile services
          out=$(docker run --rm mhai-emr:ci help 2>&1 || true)
          case "$out" in "usage: emr"*) echo "the emr image runs" ;; *) echo "::error::the emr image doesn't run"; exit 1 ;; esac

  # Spec section 12: the whole boundary end to end. The smoke stack
  # (docker-compose.yml + docker-compose.smoke.yml: core, NATS, Postgres,
  # the pipeline worker with the stub models, the echo worker), then
  # services/core/internal/smoke as the clinical BFF over NATS, then down.
  # Every secret is generated for the run (.github/scripts/boundary-smoke.sh).
  boundary-smoke:
    needs: [image]
    runs-on: ubuntu-latest  # ships Docker and Compose
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: false  # this job builds the images the smoke test runs (zizmor cache-poisoning)
      # Every compose file parses with the example settings (never run
      # before Task 15), the test profile included.
      - name: Compose files are valid
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile test --profile observability config -q
          docker compose --env-file .env.example --profile emr config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.smoke.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.gpu.yml config -q
          # The demo deploy's file, with synthetic values for the host's .env.
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml config -q
          # The same with the tools, cloud and emr profiles (the egress proxies).
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml --profile tools --profile cloud --profile emr config -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The same layers as the image job, from the GitHub Actions cache.
      - name: Build the intelligence image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/intelligence
          build-args: TORCH=cpu
          load: true
          tags: mhai-intelligence:cpu
          cache-from: type=gha
      - name: Build the core image
        run: docker build -t mhai-core:local -f services/core/Dockerfile services
      # The demo deploy's pre-migration check, against a throwaway Postgres
      # with core's migrations (fails closed on every error).
      - name: Pre-migration check tests
        run: .github/scripts/premigrate-check-test.sh
      - name: Smoke test
        run: .github/scripts/boundary-smoke.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
