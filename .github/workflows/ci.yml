name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares against the base branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not models" --cov=mhai --cov-report=xml

      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: >
          uv run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80

  gateway:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: gateway/go.mod
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags integration ./...

  # Build the image when anything that goes into it changes, so a bad base
  # image or dependency bump fails here rather than at deploy time.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's changed files
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            image:
              - Dockerfile
              - .github/workflows/ci.yml
              - pyproject.toml
              - uv.lock
              - mhai/**
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.image == 'true'
      # Layers are cached between runs, so only changed layers rebuild.
      - name: Build CPU image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH=cpu
          load: true
          tags: mhai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm mhai:ci --help
          docker run --rm --entrypoint python mhai:ci -c "import mhai.agents, mhai.security.hipaa"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
