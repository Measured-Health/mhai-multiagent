name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. On main every push must finish, because
  # the demo deploy runs only after a successful CI run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Python service is a uv project in its own directory (ADR 0002).
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover compares against the base branch

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lockfile is current
        run: uv lock --check

      # The contract in proto/ (spec 6.3): buf lint, buf breaking against
      # origin/main (fetch-depth 0 above; skipped only while main has no
      # proto/), and the committed generated code matches a fresh
      # `make proto`. Runs from the repository root.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install buf and protoc-gen-go
        working-directory: .
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Protobuf lint, breaking and generated code
        working-directory: .
        run: make proto-check

      # The workflows: actionlint (syntax, expressions, shellcheck of run: blocks) and
      # zizmor (template injection, unpinned actions, excessive permissions, ...).
      - name: Workflow lint
        working-directory: .
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Workflow security (zizmor)
        run: uv run zizmor --offline ../../.github/workflows

      # The NATS configs start: nats-server -t on deploy/nats/nats.conf with
      # the nats service's environment as the default deploy renders it
      # (compose defaults included), and on the dev config, in the deploy's
      # pinned NATS image. A key or line nats-server refuses would stop NATS,
      # and core and the demo with it.
      - name: NATS configs (nats-server -t)
        working-directory: .
        run: bash deploy/nats/check-configs.sh

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy
      # Tests marked boundary need Docker and run in intelligence-boundary;
      # store (MinIO) and slow (a full-size synthetic set, several GB) run on
      # the build server. The coverage job combines both runs before
      # diff-cover (F17).
      - name: Test
        env:
          COVERAGE_FILE: coverage.checks
        run: uv run pytest -m "not models and not boundary and not store and not slow" --cov=intelligence --cov-report=

      - name: Keep the coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-checks
          path: services/intelligence/coverage.checks
          retention-days: 1

  # Spec section 12: the Python tests marked boundary, against Postgres 16
  # and NATS 2.10 (testcontainers) with the real services/nats/nats.conf,
  # and core's migrations from the mhai-core image.
  intelligence-boundary:
    runs-on: ubuntu-latest  # ships Docker
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Build the core image (migrations)
        working-directory: .
        run: docker build -t mhai-core:test -f services/core/Dockerfile services
      - name: Boundary tests
        env:
          COVERAGE_FILE: coverage.boundary
        run: uv run pytest -m boundary tests/boundary --cov=intelligence --cov-report=
      - name: Keep the coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-boundary
          path: services/intelligence/coverage.boundary
          retention-days: 1

  # diff-cover on the three runs together: boundary code is covered mostly by
  # the Docker tests, the model store's MinIO paths by the store tests, the rest
  # by checks. pb/ is omitted (pyproject.toml).
  coverage:
    if: github.event_name == 'pull_request'
    needs: [checks, intelligence-boundary, model-promotion-e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover compares against the base branch
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked --no-default-groups --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: services/intelligence
      - name: Combine
        run: |
          uv run coverage combine coverage.checks coverage.boundary coverage.store
          uv run coverage xml
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=80

  # Plan Task 24: the whole model promotion flow on MinIO from docker-compose.models.yml,
  # with a development key made in $RUNNER_TEMP
  # (services/intelligence/scripts/rehearse-promotion.sh), then the store tests. Synthetic
  # data only; no credential outside this job's throwaway MinIO.
  model-promotion-e2e:
    runs-on: ubuntu-latest  # ships Docker and Compose
    defaults:
      run:
        working-directory: services/intelligence
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install
        run: uv sync --locked
      # The store's settings and both roles' throwaway passwords go to $GITHUB_ENV, masked.
      - name: Rehearsal store
        run: uv run --no-sync scripts/rehearse-promotion.sh store-up "$GITHUB_ENV" writer reader
      - name: Rehearse the promotion flow
        run: uv run --no-sync scripts/rehearse-promotion.sh run
      - name: Store tests (MinIO with testcontainers)
        env:
          COVERAGE_FILE: coverage.store
        run: uv run --no-sync pytest -q -m store tests/modelstore --cov=intelligence --cov-report=
      - name: Keep the coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-store
          path: services/intelligence/coverage.store
          retention-days: 1

  # The core suites run as parallel jobs, each package once
  # (.github/scripts/go-test-packages.sh). The race run of every
  # package goes to exactly one job: "lint and unit" takes the packages whose
  # test build the integration tag doesn't change, "integration" the ones it
  # does (which include their untagged tests; three shards, below), and
  # "integration with fixture routes" the ones the test tag changes again. The property tests' big runs
  # are in the property jobs below, split into shards.
  core:
    name: core (${{ matrix.suite }})
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lint and unit
            run: |
              test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
              go vet ./...
              go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
              # Every test this job skips runs, without -race, in a property job.
              bash ../../.github/scripts/core-property-tests.sh check
              bash ../../.github/scripts/go-test-packages.sh test same "" integration \
                -race -timeout 25m -skip "$(bash ../../.github/scripts/core-property-tests.sh race-skip)"
              # The smoke test runs in boundary-smoke; here it only has to build.
              go vet -tags smoke ./internal/smoke/...
          - suite: integration with fixture routes
            run: bash ../../.github/scripts/go-test-packages.sh test differ integration "integration test" -race -timeout 25m
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/core/go.sum
      - name: ${{ matrix.suite }}
        env:
          SUITE_RUN: ${{ matrix.run }}
        run: bash -eo pipefail -c "$SUITE_RUN"

  # The integration packages in three shards that run at once, heaviest
  # packages first (weights: seconds on a runner, PR #213); every package in
  # exactly one shard.
  core-integration:
    name: core (integration ${{ matrix.shard }})
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/core/go.sum
      - name: integration ${{ matrix.shard }}
        env:
          PACKAGE_SHARD: ${{ matrix.shard }}
          PACKAGE_WEIGHTS: >-
            internal/db=330 internal/auth=320 internal/audit=190 internal/bus=130
            cmd/core=120 internal/analysis/routes=95 internal/intel=80 internal/platform=60
            internal/queries=55 internal/testutil=40 internal/emrctl=40 internal/analysis=30
        run: bash ../../.github/scripts/go-test-packages.sh test differ "" integration -race -timeout 25m

  # The check name from before the split: passes only when every shard did.
  core-integration-all:
    name: core (integration)
    if: ${{ !cancelled() }}
    needs: [core-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.core-integration.result }}
        run: |
          echo "integration, all shards: $RESULT"
          test "$RESULT" = success

  # The property tests at their non-race size, split into shards that run at
  # once (internal/proptest: PROPERTY_SHARD=i/n runs every n-th case, each
  # case in exactly one shard, in parallel on the runner's CPUs). The sizes
  # are unchanged; the shards together run every case.
  #
  # Analysis (plan Tasks 6-8, ruling C10): the disclosure properties (P1 one
  # response, P2 every context of a period, small and realistic worlds, P4
  # histories, P5 bounds). ANALYSIS_LONG=1 runs the full size
  # (2,000 / 100 / 500 / 100).
  # Plan 7c (A7, R41a-5): the analytics history properties at full size (500
  # guard-level histories, the unions and the JSON-side set check), and A8's
  # modular check and the fallback on their histories. The -race runs use
  # smaller samples to fit Go's package limit; these runs are their superset.
  core-disclosure:
    name: core (analysis disclosure properties ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/core/go.sum
      - name: analysis disclosure properties ${{ matrix.shard }}
        env:
          PROPERTY_SHARD: ${{ matrix.shard }}
        run: bash ../../.github/scripts/core-property-tests.sh run disclosure

  # The check name from before the split: passes only when every shard did.
  core-disclosure-all:
    name: core (analysis disclosure properties)
    if: ${{ !cancelled() }}
    needs: [core-disclosure]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.core-disclosure.result }}
        run: |
          echo "analysis disclosure properties, all shards: $RESULT"
          test "$RESULT" = success

  core-history:
    name: core (analytics history properties ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/core/go.sum
      - name: analytics history properties ${{ matrix.shard }}
        env:
          PROPERTY_SHARD: ${{ matrix.shard }}
        run: bash ../../.github/scripts/core-property-tests.sh run history

  # The check name from before the split: passes only when every shard did.
  core-history-all:
    name: core (analytics history properties)
    if: ${{ !cancelled() }}
    needs: [core-history]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.core-history.result }}
        run: |
          echo "analytics history properties, all shards: $RESULT"
          test "$RESULT" = success

  # The Go module core and the emr service share (ADR 0014): a defect here
  # reaches both.
  gokit:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/gokit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/gokit/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # Each package once: the integration build of a package with
      # integration tests includes its unit tests (go-test-packages.sh).
      - name: Test
        run: bash ../../.github/scripts/go-test-packages.sh test same "" integration -race -timeout 25m
      - name: Integration tests
        run: bash ../../.github/scripts/go-test-packages.sh test differ "" integration -race -timeout 25m

  # The emr service (ADR 0014). Its integration tests run on core's
  # migrations (internal/testpg).
  emr:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/emr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/emr/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # Each package once: the integration build of a package with
      # integration tests includes its unit tests (go-test-packages.sh).
      - name: Test
        run: bash ../../.github/scripts/go-test-packages.sh test same "" integration -race -timeout 25m
      - name: Integration tests
        run: bash ../../.github/scripts/go-test-packages.sh test differ "" integration -race -timeout 25m

  # The documents service (ADR 0016). Off by default; the same gates as the
  # emr service. Its NATS rights are tested from core (internal/bus).
  documents:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/documents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/documents/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # Each package once: the integration build of a package with
      # integration tests includes its unit tests (go-test-packages.sh).
      - name: Test
        run: bash ../../.github/scripts/go-test-packages.sh test same "" integration -race -timeout 25m
      - name: Integration tests
        run: bash ../../.github/scripts/go-test-packages.sh test differ "" integration -race -timeout 25m

  # The notifications service (ADR 0018). Off by default; the same gates as
  # the documents service. Its NATS rights are tested from core (internal/bus).
  notifications:
    runs-on: ubuntu-latest  # ships Docker, which the integration tests use
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/notifications/go.sum
      - name: Formatted (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w on the files above"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # Each package once: the integration build of a package with
      # integration tests includes its unit tests (go-test-packages.sh).
      - name: Test
        run: bash ../../.github/scripts/go-test-packages.sh test same "" integration -race -timeout 25m
      - name: Integration tests
        run: bash ../../.github/scripts/go-test-packages.sh test differ "" integration -race -timeout 25m

  # The documents scan's sidecars (documents PR 4): docsandbox's renderer,
  # server and real jail (the image's test stage, run with the privileges
  # compose gives it: nsjail builds each jail), and clamd with the deployed
  # clamd.conf against EICAR (DS6, DS9, B1-B5).
  docsandbox:
    runs-on: ubuntu-latest  # ships Docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The jailed tests (docsandbox image, test stage)
        run: |
          # The self-test's cache once read a freshly booted runner as fresh
          # (time.monotonic counts from boot); the uptime is here for that.
          docker build --target test -t mhai-docsandbox:test services/docsandbox
          echo "runner uptime (s): $(cut -d' ' -f1 /proc/uptime)"
          # Exactly the container docker-compose.yml runs.
          docker run --rm --cap-drop ALL --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --cap-add SYS_CHROOT --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt no-new-privileges:true \
            --network none --read-only --tmpfs /jobs:size=512m,mode=0700 --tmpfs /tmp:size=16m \
            --tmpfs /run/docsandbox:size=512m,mode=0700 --tmpfs /run/user:size=16m,mode=0700 mhai-docsandbox:test
      - name: The image compose runs builds
        run: docker build -t mhai-docsandbox:ci services/docsandbox
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/documents/go.sum
      - name: clamd against EICAR
        working-directory: services/documents
        run: go test -race -timeout 20m -tags sidecars ./internal/clamd/

  # ADR 0012: a breaking change to the HTTP contract needs a new major
  # version (/api/v2), so it may not change /api/v1 in place.
  openapi-breaking:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No breaking change against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:services/core/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml" || : > "$RUNNER_TEMP/base-openapi.yaml"
          .github/scripts/openapi-breaking.sh "$RUNNER_TEMP/base-openapi.yaml" services/core/openapi.yaml

  # Build the image when anything that goes into it changes, so a bad base
  # image or dependency bump fails here rather than at deploy time.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's changed files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            image:
              - .github/workflows/ci.yml
              - services/intelligence/Dockerfile
              - services/intelligence/.dockerignore
              - services/intelligence/README.md
              - services/intelligence/pyproject.toml
              - services/intelligence/uv.lock
              - services/intelligence/intelligence/**
              - services/intelligence/warmup/**
            go_image:
              - .github/workflows/ci.yml
              - services/.dockerignore
              - services/core/**
              - services/gokit/**
              - services/emr/**
              - services/documents/**
              - services/notifications/**
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.image == 'true'
      # Layers are cached between runs, so only changed layers rebuild.
      - name: Build CPU image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/intelligence
          build-args: TORCH=cpu
          load: true
          tags: mhai-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm mhai-intelligence:ci --help
          docker run --rm --entrypoint python mhai-intelligence:ci -c "import intelligence.agents, intelligence.security.hipaa"
      # F13: the generated operations table and catalogue are package data,
      # so the installed (not editable) image loads them without a mount.
      - name: The image ships the warm-up page
        if: steps.changes.outputs.image == 'true'
        run: docker run --rm --entrypoint test mhai-intelligence:ci -s /app/warmup/page.png
      - name: The image ships operations.json and catalogue.json
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm --entrypoint python mhai-intelligence:ci -c "
          from intelligence.boundary.operations import Operations, clinical_roles
          ops = Operations.load(development=False)
          assert ops.for_subject('inference.v1.pipeline.health') is not None
          assert ops.for_subject('inference.v1.echo.ping') is None  # test-only, left out in production
          assert clinical_roles()
          print('operations.json and catalogue.json load from the installed package')
          "

      # The Go images build from services/ (they require services/gokit,
      # ADR 0014), as the deploy workflow builds core.
      - name: Build the core image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-core:ci -f services/core/Dockerfile services
          out=$(docker run --rm mhai-core:ci help 2>&1 || true)
          case "$out" in "usage: core"*) echo "the core image runs" ;; *) echo "::error::the core image doesn't run"; exit 1 ;; esac
      - name: Build the emr image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-emr:ci -f services/emr/Dockerfile services
          out=$(docker run --rm mhai-emr:ci help 2>&1 || true)
          case "$out" in "usage: emr"*) echo "the emr image runs" ;; *) echo "::error::the emr image doesn't run"; exit 1 ;; esac
      - name: Build the documents image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-documents:ci -f services/documents/Dockerfile services
          out=$(docker run --rm mhai-documents:ci help 2>&1 || true)
          case "$out" in "usage: documents"*) echo "the documents image runs" ;; *) echo "::error::the documents image doesn't run"; exit 1 ;; esac
          # Non-root, as the image says.
          test "$(docker image inspect -f '{{.Config.User}}' mhai-documents:ci)" = "nonroot:nonroot"
      - name: Build the notifications image from services/
        if: steps.changes.outputs.go_image == 'true'
        run: |
          docker build -t mhai-notifications:ci -f services/notifications/Dockerfile services
          out=$(docker run --rm mhai-notifications:ci help 2>&1 || true)
          case "$out" in "usage: notifications"*) echo "the notifications image runs" ;; *) echo "::error::the notifications image doesn't run"; exit 1 ;; esac
          test "$(docker image inspect -f '{{.Config.User}}' mhai-notifications:ci)" = "nonroot:nonroot"

  # Spec section 12: the whole boundary end to end. The smoke stack
  # (docker-compose.yml + docker-compose.smoke.yml: core, NATS, Postgres,
  # the pipeline worker with the stub models, the echo worker), then
  # services/core/internal/smoke as the clinical BFF over NATS, then down.
  # Every secret is generated for the run (.github/scripts/boundary-smoke.sh).
  boundary-smoke:
    needs: [image]
    runs-on: ubuntu-latest  # ships Docker and Compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: false  # this job builds the images the smoke test runs (zizmor cache-poisoning)
      # Every compose file parses with the example settings (never run
      # before Task 15), the test profile included.
      - name: Compose files are valid
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile test --profile observability config -q
          docker compose --env-file .env.example --profile emr config -q
          docker compose --env-file .env.example --profile documents config -q
          docker compose --env-file .env.example --profile notifications config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.smoke.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.gpu.yml config -q
          # The demo deploy's file, with synthetic values for the host's .env.
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml config -q
          # The same with the tools, cloud and emr profiles (the egress proxies).
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml --profile tools --profile cloud --profile emr config -q
          # The public demo's seed and sample answers (deploy/demo/enable-demo.sh).
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml --profile demo config -q
          # The demo's email (deploy/README.md, "Turn on email for the demo").
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml --profile notifications config -q
          # The pilot with the own answer model (llama sidecar, model-fetch).
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            docker compose -f deploy/compose.yml --profile pilot --profile cloud --profile ownmodel config -q
          # The pilot with our own model on the GPU (profile gpu-model), switched on.
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x \
            GPU_MODEL_ENABLED=true GPU_MODEL_FILE=/srv/mhai-models/cca-v1/model-q4_k_m.gguf \
            docker compose -f deploy/compose.yml --profile pilot --profile gpu-model config -q
          # The split mode (docs/deploy/remote-intelligence.md): the app host's
          # override, and the intelligence host with every profile, CPU and GPU.
          env POSTGRES_PASSWORD=x CORE_DB_PASSWORD=x PROVISION_DB_PASSWORD=x MFA_ENCRYPTION_KEY=x \
            BFF_SERVICE_KEYS=x NATS_GATEWAY_NKEY=x NATS_BFF_NKEY=x NATS_BFF_PLATFORM_NKEY=x SPLIT_APP_ADDR=10.0.1.10 \
            docker compose -f deploy/compose.yml -f deploy/compose.split.yml config -q
          env APP_HOST_ADDR=10.0.1.10 docker compose -f deploy/intelligence-host/compose.yml \
            --profile cloud --profile ownmodel config -q
          env APP_HOST_ADDR=10.0.1.10 docker compose -f deploy/intelligence-host/compose.yml \
            -f deploy/intelligence-host/compose.gpu.yml --profile cloud --profile ownmodel config -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same layers as the image job, from the GitHub Actions cache.
      - name: Build the intelligence image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/intelligence
          build-args: TORCH=cpu
          load: true
          tags: mhai-intelligence:cpu
          cache-from: type=gha
      - name: Build the core image
        run: docker build -t mhai-core:local -f services/core/Dockerfile services
      # The demo deploy's pre-migration check, against a throwaway Postgres
      # with core's migrations (fails closed on every error).
      - name: Pre-migration check tests
        run: .github/scripts/premigrate-check-test.sh
      # The operations baseline (deploy/ops/): shellcheck, then backup ->
      # restore test against throwaway Postgres containers, the offsite copy
      # to a throwaway MinIO, and the health check's alert to a fake webhook.
      - name: Ops baseline tests
        run: |
          sudo apt-get install -y -qq age >/dev/null
          shellcheck -x deploy/ops/*.sh .github/scripts/ops-test.sh
          .github/scripts/ops-test.sh
      # The llama sidecar's entrypoint (own answer model): re-hash, refuse, alias. No
      # Docker, no model; deploy/llama/test-llama.sh is the Docker check.
      - name: llama sidecar entrypoint tests
        run: |
          shellcheck -x deploy/llama/*.sh
          bash deploy/llama/test-entrypoint.sh
      # Our own model on the GPU (deploy/gpu-model/): its entrypoint (re-hash, refuse,
      # alias) and the deploy's switch (settings, hash, health, alias) with a fake
      # docker. No Docker, no GPU, no model.
      - name: GPU model entrypoint and switch tests
        run: |
          shellcheck -x deploy/gpu-model/*.sh
          bash deploy/gpu-model/test-entrypoint.sh
          bash deploy/gpu-model/test-gpu-model.sh
      # The own model's switch scripts (deploy/pilot/): shellcheck, and the
      # pre-flight (memory, the pinned lock, the images) with a fake docker.
      - name: Own model switch pre-flight tests
        run: |
          shellcheck -x deploy/pilot/*.sh deploy/demo/*.sh
          bash deploy/pilot/test-preflight.sh
      # The live site (deploy/README.md, "Live site"): live-site.sh with a
      # fake compose (no demo hospital that can sign in, sample-ai off, the
      # marker), and the demo scripts refusing on a live host.
      - name: Live site tests
        run: |
          shellcheck -x deploy/live-site.sh .github/scripts/live-site-test.sh
          bash .github/scripts/live-site-test.sh
      # The split mode (docs/deploy/remote-intelligence.md): the private CA
      # scripts and the shared checks without Docker, then two hosts stood in
      # for by Docker networks, with the images built above.
      - name: Split mode tests
        run: |
          shellcheck -x deploy/enable-split.sh deploy/tls/*.sh deploy/postgres/*.sh deploy/intelligence-host/*.sh
          bash deploy/tls/test-tls.sh
          bash deploy/tls/test-split-lib.sh
          CORE_IMAGE=mhai-core:local INTEL_IMAGE=mhai-intelligence:cpu bash deploy/intelligence-host/test-split.sh
      - name: Smoke test
        run: .github/scripts/boundary-smoke.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
