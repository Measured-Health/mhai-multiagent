name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares against the base branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not models" --cov=mhai --cov-report=xml

      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: >
          uv run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80

  # Build the image when anything that goes into it changes, so a bad base
  # image or dependency bump fails here rather than at deploy time.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            image:
              - Dockerfile
              - pyproject.toml
              - uv.lock
              - mhai/**
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.image == 'true'
      - name: Build CPU image and run the CLI
        if: steps.changes.outputs.image == 'true'
        run: |
          docker buildx build --load --build-arg TORCH=cpu -t mhai:ci .
          docker run --rm mhai:ci --help
          docker run --rm --entrypoint python mhai:ci -c "import mhai.agents, mhai.security.hipaa"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
