name: Model sign-off

# After a merge to main that changes models.lock: re-check the merged PR's approvals and
# sign off each newly pinned version (mhai-models signoff; plan Task 21, rulings D32, D33).
#
# What it trusts: main before the push (github.event.before, which the CLI requires to be
# the merge commit's first parent) for the code that runs and for its data, read with git
# at that sha. The locks come from git at three exact commits: --before at the base,
# --after at the merge, --head-lock at the merged PR's head. D35: a merge that changes the
# lock may change nothing but models.lock, models/, docs/ and CHANGELOG.md; the CLI works
# that out from git (base..merge). The merged PR's own code is never installed or run.
#
# TODO(Task 26): the production sign-off signer. Until then MHAI_MODELS_SIGNER has only the
# development FileSigner, which refuses outside development, so a real sign-off is refused
# here (exit 2) and the loader keeps refusing the pin.
# What it can't do (D37): main's code runs, but this workflow file is the merge commit's,
# so a merged PR that edited it runs its own copy. The model-signoff environment must
# therefore have a required reviewer from the platform team ("prevent self-review" on),
# deployment branches main only, and the sign-off secrets as environment secrets only:
# no secret or id-token reaches this job without a person approving the run. TODO(H4) in
# TODO.md lists every setting; main allows merge commits only and requires branches to be
# up to date. A push that isn't a merge of a PR is refused (exit 2, summary written).

on:
  push:
    branches: [main]
    paths:
      - models.lock

permissions: {}

concurrency:
  group: model-signoff
  cancel-in-progress: false

jobs:
  signoff:
    runs-on: ubuntu-latest
    environment: model-signoff
    permissions:
      contents: read
      pull-requests: read
      id-token: write  # the production signer (Task 26)
    defaults:
      run:
        shell: bash
    env:
      # Never development: a sign-off is production only (no --rehearsal here).
      MHAI_MODELS_ENV: production
      APP_ENV: production
      BASE_SHA: ${{ github.event.before }}
    steps:
      # The environment allows main only (H4); this says so plainly if it doesn't.
      - name: Main only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] ||
            { echo "::error::this job runs on main only (ref $REF refused)"; exit 1; }

      - name: Check out main before the push (code and data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.before }}
          path: base
          fetch-depth: 0  # main's history: the merge commit and the PR head are in it
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install the base's mhai-models
        working-directory: base/services/intelligence
        run: uv sync --locked

      - name: The merged PR's head, and the three locks from git
        id: locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in "$BASE_SHA" "$GITHUB_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad commit sha"; exit 1; }
          done
          # A push that isn't the merge commit of a PR is refused as the CLI would refuse
          # it: one JSON line on stdout and in the summary, exit 2 (3 if GitHub is down).
          refuse() {
            local out="{\"refused\":\"$1\",\"detail\":\"$2\"}"
            printf '%s\n' "$out"
            { echo '### sign-off'; echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            exit "$3"
          }
          # The merged PR's head, from GitHub (the CLI checks it is the merge's second
          # parent and the PR's head).
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // ""')" ||
            refuse github_unavailable http 3
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || refuse not_approved not_a_merge_commit 2
          # Main's full history has it (the merge's second parent; a squash or rebase
          # merge doesn't); never fetched from anywhere else.
          git -C base rev-parse --verify --quiet "$head^{commit}" >/dev/null ||
            refuse not_approved not_a_merge_commit 2
          echo "HEAD_SHA=$head" >>"$GITHUB_ENV"
          # D38, the bootstrap: the merge that adds sign-off to main runs on a base that
          # has neither sign-off nor models.lock. Only then, and only if the merged lock is
          # byte for byte the empty mhai.models.lock/1 lock (nothing to sign off), is
          # there nothing to do; cmp is a runner tool, nothing from the merge runs. A base
          # without sign-off and any other case is refused; a base with it always runs it.
          base_lock_py="$GITHUB_WORKSPACE/base/services/intelligence/intelligence/modelstore/lock.py"
          if [ ! -e "$base_lock_py" ] && [ ! -L "$base_lock_py" ]; then
            git -C base cat-file -e "$BASE_SHA:models.lock" 2>/dev/null &&
              refuse not_approved bootstrap_base_has_a_lock 2
            git -C base show "$GITHUB_SHA:models.lock" >"$RUNNER_TEMP/after.lock"
            printf '%s\n' '{"models":{},"schema":"mhai.models.lock/1"}' |
              cmp -s - "$RUNNER_TEMP/after.lock" ||
              refuse not_approved bootstrap_lock_not_empty 2
            out='{"bootstrap":true,"detail":"base_has_no_signoff_and_the_lock_pins_nothing"}'
            printf '%s\n' "$out"
            { echo '### sign-off: bootstrap pass (D38)'
              echo "The base has no sign-off yet, and the merged lock is the empty \`mhai.models.lock/1\` lock, so there is nothing to sign off."
              echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            echo "bootstrap=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Each from its own commit; a missing models.lock fails the job.
          git -C base show "$BASE_SHA:models.lock" >"$RUNNER_TEMP/before.lock"
          git -C base show "$GITHUB_SHA:models.lock" >"$RUNNER_TEMP/after.lock"
          git -C base show "$head:models.lock" >"$RUNNER_TEMP/head.lock"

      - name: Sign off
        if: steps.locks.outputs.bootstrap != 'true'
        working-directory: base/services/intelligence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_STORE_ENDPOINT: ${{ vars.MODEL_STORE_ENDPOINT }}
          MODEL_STORE_BUCKET: ${{ vars.MODEL_STORE_BUCKET }}
          MODEL_STORE_REGION: ${{ vars.MODEL_STORE_REGION }}
          MODEL_STORE_APPROVED_RETENTION_DAYS: ${{ vars.MODEL_STORE_APPROVED_RETENTION_DAYS }}
          MODEL_STORE_SIGNOFF_ACCESS_KEY: ${{ secrets.MODEL_STORE_SIGNOFF_ACCESS_KEY }}
          MODEL_STORE_SIGNOFF_SECRET_KEY: ${{ secrets.MODEL_STORE_SIGNOFF_SECRET_KEY }}
        run: |
          base="$GITHUB_WORKSPACE/base"
          code=0
          out="$(uv run --no-sync mhai-models signoff \
            --base-dir "$base" \
            --base-sha "$BASE_SHA" \
            --before "$RUNNER_TEMP/before.lock" \
            --after "$RUNNER_TEMP/after.lock" \
            --commit "$GITHUB_SHA" \
            --head-sha "$HEAD_SHA" \
            --head-lock "$RUNNER_TEMP/head.lock" \
            --testsets "$base/models/testsets.lock" \
            --thresholds-dir "$base/services/intelligence/intelligence/doceval/thresholds")" || code=$?
          printf '%s\n' "$out"
          { echo '### sign-off'; echo '```json'; printf '%s\n' "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"
