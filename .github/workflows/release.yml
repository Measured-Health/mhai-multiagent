name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' services/intelligence/pyproject.toml | cut -d'"' -f2)
          test "$tag" = "$version" || { echo "Tag $tag != pyproject $version"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: services/intelligence
          build-args: TORCH=cpu
          push: true
          tags: |
            ghcr.io/measured-health/mhai-multiagent:${{ github.ref_name }}
            ghcr.io/measured-health/mhai-multiagent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
