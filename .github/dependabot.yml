# Weekly update PRs. Review them like any other PR: CI must pass, and model
# or ML-stack bumps (torch, transformers, sentence-transformers) need the
# end-to-end check (scripts/e2e_models.py) before merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /services/intelligence
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        patterns: ["torch", "transformers", "sentence-transformers", "accelerate", "peft", "bitsandbytes"]
      dev-tools:
        dependency-type: development

  - package-ecosystem: gomod
    directory: /services/core
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/gokit
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/emr
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/documents
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/notifications
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # Images: patch and minor updates only where they are safe. Python must stay
  # on 3.12 (requires-python), and a major Postgres upgrade needs a
  # data migration, so those are deliberate PRs, not weekly bumps.
  - package-ecosystem: docker
    directory: /services/intelligence
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ollama/ollama"
        update-types: ["version-update:semver-major"]
      # Frozen test-only images (TODO.md, "MinIO is test-only"): their
      # `latest` tag is an older build than the pins (2025.5.x against
      # 2025.7.x), so a digest "bump" is a downgrade. Update them by hand.
      - dependency-name: "bitnamilegacy/minio"
      - dependency-name: "bitnamilegacy/minio-client"
