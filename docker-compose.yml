services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mhai
      POSTGRES_USER: mhai
      POSTGRES_PASSWORD: mhai
    ports: ["5432:5432"]
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  mhai:
    build: .
    image: mhai:latest
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

volumes:
  pgdata:
