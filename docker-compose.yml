# MHAI local stack.
#
#   cp .env.example .env
#   make up                  # postgres, nats, core (+ migrations, keys), ollama (+ model pull), pipeline
#   make up-gpu              # same, with Ollama and PyTorch on an NVIDIA GPU
#   make up-observability    # also starts the OpenTelemetry collector
#   docker compose --profile test up -d   # also the test-only echo worker
#
# The end-to-end smoke stack (stub models, echo on) is this file plus
# docker-compose.smoke.yml: .github/scripts/boundary-smoke.sh.
#
# Every port is bound to 127.0.0.1; nothing is reachable from other hosts.

name: mhai

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mhai}
      POSTGRES_USER: ${POSTGRES_USER:-mhai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mhai}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # default as before; backend (internal) too, where the emr service
    # reaches it with no route out (profile emr).
    networks: [default, backend]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  # One-shot: apply the core service's goose migrations (the whole schema, roles
  # and row-level security), then create or reset the deployment logins:
  #   CORE_DB_USER          the core service's login, a member of mhai_app only
  #   PROVISION_DB_USER     the seed CLI's login, a member of mhai_provision only
  #   INTELLIGENCE_DB_USER  the pipeline worker's login, a member of
  #                         mhai_worker_app only (spec §8.2)
  # It connects as the owner (the local POSTGRES_USER is a superuser), and
  # carries no core service secrets. Placeholder passwords are refused.
  core-migrate:
    build:
      # Core requires services/gokit, so the context is services/ (ADR 0014).
      context: ./services
      dockerfile: core/Dockerfile
    image: mhai-core:local
    restart: "no"
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mhai}:${POSTGRES_PASSWORD:-mhai}@postgres:5432/${POSTGRES_DB:-mhai}?sslmode=disable
      CORE_DB_USER: ${CORE_DB_USER:-core_app}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
      PROVISION_DB_USER: ${PROVISION_DB_USER:-core_provision}
      PROVISION_DB_PASSWORD: ${PROVISION_DB_PASSWORD:?set PROVISION_DB_PASSWORD in .env}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:-intelligence_app}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?set INTELLIGENCE_DB_PASSWORD in .env}
      # The emr service's login (profile emr), optional: skipped while empty
      # and until its role exists (the EMR connections migration).
      EMR_DB_PASSWORD: ${EMR_DB_PASSWORD:-}
      # The operator's EMR login for core emr exclude (a member of
      # mhai_emr_admin only), optional: skipped while both are empty.
      EMR_ADMIN_DB_USER: ${EMR_ADMIN_DB_USER:-}
      EMR_ADMIN_DB_PASSWORD: ${EMR_ADMIN_DB_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: make the access-token signing key in the corekeys volume if
  # it isn't there yet (core keys ensure). Production mounts its own key.
  core-keys:
    image: mhai-core:local
    restart: "no"
    command: ["keys", "ensure", "--out", "/keys/access.pem"]
    volumes:
      - corekeys:/keys
    depends_on:
      core-migrate: { condition: service_completed_successfully }

  # One-shot: the request-token signing key (spec §7.2, a different key from
  # the access-token key) in corekeys, and its public half in the
  # trusted-keys file on its own volume, which the workers mount read-only
  # (it holds public keys only). Kept when already there.
  core-request-key:
    image: mhai-core:local
    restart: "no"
    command: ["keys", "ensure", "--kind", "request", "--out", "/keys/request.pem",
              "--trusted-out", "/trusted/request-keys.json"]
    volumes:
      - corekeys:/keys
      - trustedkeys:/trusted
    depends_on:
      core-keys: { condition: service_completed_successfully }

  # The core service (Go): the API the BFFs call. Its environment is only
  # its own settings (no env_file): the core login, the gateway NATS user,
  # its key and its secrets. The config rejects placeholder values.
  core:
    image: mhai-core:local
    restart: unless-stopped
    command: ["serve"]
    environment:
      CORE_ENV: ${CORE_ENV:-development}
      CORE_API_DOCS: ${CORE_API_DOCS:-true} # /api/docs on the loopback port
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${CORE_DB_USER:-core_app}:${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mhai}?sslmode=disable
      NATS_URL: nats://gateway:${NATS_GATEWAY_PASSWORD:?set NATS_GATEWAY_PASSWORD in .env}@nats:4222
      NATS_JS_REPLICAS: ${NATS_JS_REPLICAS:-1}   # one server in dev; 3 (R3) on the production cluster
      JOBS_PIPELINE_MAX_ACK_PENDING: ${JOBS_PIPELINE_MAX_ACK_PENDING:-8}
      ACCESS_KEY_PATH: /keys/access.pem
      REQUEST_KEY_PATH: /keys/request.pem
      REQUEST_TRUSTED_KEYS_PATH: /trusted/request-keys.json   # public; dead-letter re-mint after a rotation
      INTELLIGENCE_QUERY_CAP: ${INTELLIGENCE_QUERY_CAP:-10}   # questions in flight per hospital
      # The API over HTTP as well as over NATS (api.v1.<app>): on until
      # mhai-web's BFF uses NATS (spec §17.1). The BFF users' NATS
      # passwords go to the nats service only, never here.
      CORE_HTTP_API: ${CORE_HTTP_API:-on}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
      BFF_SERVICE_KEYS: ${BFF_SERVICE_KEYS:?set BFF_SERVICE_KEYS in .env}
      # Traces and metrics, off while empty. With the observability profile:
      # http://otel-collector:4317. Spans carry ids, codes and numbers only.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CORE_OTEL_ENDPOINT:-}
      # Who the audit integrity page names; unset, its status answers 503.
      SECURITY_CONTACT_NAME: ${SECURITY_CONTACT_NAME:-}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-}
      # The EMR integration (ADR 0014), off by default: no EMR stream, no
      # emr calls, the connection writes answer 503. On, it needs the emr
      # service's sealing public key (CORE_EMR_SEAL_PUBLIC_KEY_PATH) and the
      # idempotency HMAC key (CORE_IDEMPOTENCY_HMAC_KEY_PATH).
      CORE_EMR_ENABLED: ${CORE_EMR_ENABLED:-false}
      # With EMR on, core's maintenance loop purges excluded patients (legal
      # holds respected); the nightly retention sweep also needs this, off
      # until the privacy lead confirms the retention values (H5).
      CORE_EMR_RETENTION_SWEEP: ${CORE_EMR_RETENTION_SWEEP:-false}
      # Patient Analysis's four key files (none by default: no drill-down
      # and no ingest of a signed-off hospital). Paths inside the
      # container, each a 0600 file of 32 random bytes in base64; the smoke
      # stack mounts generated ones (docker-compose.smoke.yml).
      ANALYSIS_REF_HMAC_KEY_FILE: ${ANALYSIS_REF_HMAC_KEY_FILE:-}
      ANALYSIS_REF_ENC_KEY_FILE: ${ANALYSIS_REF_ENC_KEY_FILE:-}
      ANALYSIS_DRILL_KEY_FILE: ${ANALYSIS_DRILL_KEY_FILE:-}
      ANALYSIS_NOTE_KEY_FILE: ${ANALYSIS_NOTE_KEY_FILE:-}
    ports: ["127.0.0.1:${CORE_PORT:-8080}:8080"]
    volumes:
      - corekeys:/keys:ro
      - trustedkeys:/trusted:ro
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-keys: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }
    # The image is distroless (no shell or curl): probe from outside with
    # GET /api/v1/readyz (200 ready, 503 not ready).
    healthcheck:
      disable: true

  # The seed CLI, as the provisioning login (never the owner, never the
  # core login). Not started by `up`; run it with
  #   docker compose run --rm -T core-cli hospitals create ...
  core-cli:
    image: mhai-core:local
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${PROVISION_DB_USER:-core_provision}:${PROVISION_DB_PASSWORD:?set PROVISION_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mhai}?sslmode=disable
    depends_on:
      core-migrate: { condition: service_completed_successfully }

  # The only link between the core service, the BFFs and the Python
  # workers. One NATS user per service (gateway, pipeline, echo,
  # bff_clinical, bff_platform), each with its own password, and JetStream
  # encrypted at rest with NATS_JS_KEY; see services/nats. Only this
  # service holds every password; each worker gets its own, and the BFF
  # users' passwords go to mhai-web's BFF (its own compose), never to core
  # or a worker. TestComposeSplitsSecretsPerService checks this.
  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    # Refuse to start with a missing or placeholder secret, or a JetStream
    # key shorter than 32 characters or starting with a digit.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for v in "$$NATS_GATEWAY_PASSWORD" "$$NATS_PIPELINE_PASSWORD" "$$NATS_ECHO_PASSWORD" "$$NATS_BFF_CLINICAL_PASSWORD" "$$NATS_BFF_PLATFORM_PASSWORD" "$$NATS_JS_KEY"; do
          case "$$v" in
            ""|*[Cc][Hh][Aa][Nn][Gg][Ee][Mm][Ee]*|*[Cc][Hh][Aa][Nn][Gg][Ee]-[Mm][Ee]*|*[Pp][Ll][Aa][Cc][Ee][Hh][Oo][Ll][Dd][Ee][Rr]*) echo "NATS secrets are missing or placeholders" >&2; exit 1;;
          esac
        done
        case "$$NATS_JS_KEY" in [0-9]*) echo "NATS_JS_KEY must start with a letter" >&2; exit 1;; esac
        [ "$${#NATS_JS_KEY}" -ge 32 ] || { echo "NATS_JS_KEY must be at least 32 characters" >&2; exit 1; }
        # The emr user (ADR 0014) is off unless NATS_EMR_CONF=emr.conf (unset
        # is off); only then is NATS_EMR_PASSWORD needed, and checked.
        case "$$NATS_EMR_CONF" in
          ""|emr-off.conf) ;;
          emr.conf)
            case "$$NATS_EMR_PASSWORD" in
              ""|*[Cc][Hh][Aa][Nn][Gg][Ee][Mm][Ee]*|*[Cc][Hh][Aa][Nn][Gg][Ee]-[Mm][Ee]*|*[Pp][Ll][Aa][Cc][Ee][Hh][Oo][Ll][Dd][Ee][Rr]*) echo "NATS_EMR_PASSWORD is missing or a placeholder" >&2; exit 1;;
            esac;;
          *) echo "NATS_EMR_CONF must be emr-off.conf or emr.conf" >&2; exit 1;;
        esac
        exec nats-server -c /etc/nats/nats.conf
    environment:
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:?set NATS_GATEWAY_PASSWORD in .env}
      NATS_PIPELINE_PASSWORD: ${NATS_PIPELINE_PASSWORD:?set NATS_PIPELINE_PASSWORD in .env}
      NATS_ECHO_PASSWORD: ${NATS_ECHO_PASSWORD:?set NATS_ECHO_PASSWORD in .env}
      NATS_BFF_CLINICAL_PASSWORD: ${NATS_BFF_CLINICAL_PASSWORD:?set NATS_BFF_CLINICAL_PASSWORD in .env}
      NATS_BFF_PLATFORM_PASSWORD: ${NATS_BFF_PLATFORM_PASSWORD:?set NATS_BFF_PLATFORM_PASSWORD in .env}
      # Off by default; NATS_EMR_CONF=emr.conf and NATS_EMR_PASSWORD turn the
      # emr NATS user on (with the profile emr).
      NATS_EMR_CONF: ${NATS_EMR_CONF:-emr-off.conf}
      NATS_EMR_PASSWORD: ${NATS_EMR_PASSWORD:-}
      NATS_JS_KEY: ${NATS_JS_KEY:?set NATS_JS_KEY in .env}
    ports: ["127.0.0.1:${NATS_PORT:-4222}:4222"]
    volumes:
      - ./services/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./services/nats/bff-clinical.test.conf:/etc/nats/bff-clinical.test.conf:ro
      - ./services/nats/${NATS_EMR_CONF:-emr-off.conf}:/etc/nats/emr.conf:ro
      - natsdata:/data
    # As postgres: default, and backend for the emr service.
    networks: [default, backend]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]

  # The emr service (ADR 0014; services/emr). Off by default: only with
  #   NATS_EMR_CONF=emr.conf NATS_EMR_PASSWORD=... docker compose --profile emr up -d
  # (the first two switch its NATS user on; without them NATS runs as before).
  # One-shot first: the X25519 sealing key pair in the emr-keys volume
  # (emr keys seal-init; an existing pair is kept). Only the emr services
  # mount it, and only the emr service mounts emr-secrets (the file secret
  # store). Its own NATS user and password, the request-token trusted keys
  # (public, read-only) and its own database login; nothing of core's.
  #
  # No route out (EMR design §6.4; plan Task 15): emr is on backend
  # (internal: Postgres, NATS) and emr-proxy (internal: egress-emr only).
  # Its one way out is egress-emr, the only service on the egress-emr
  # network, which allows a CONNECT only to the hosts of the connection
  # named in it (deploy/egress-emr/test-egress.sh).
  emr-keys:
    build:
      # The emr service requires services/gokit, so the context is services/.
      context: ./services
      dockerfile: emr/Dockerfile
    image: mhai-emr:local
    profiles: ["emr"]
    restart: "no"
    command: ["keys", "seal-init", "--out", "/emr-keys"]
    volumes:
      - emr-keys:/emr-keys

  emr:
    image: mhai-emr:local
    profiles: ["emr"]
    restart: unless-stopped
    command: ["serve"]
    environment:
      APP_ENV: development
      EMR_NATS_URL: nats://nats:4222
      # Empty unless EMR is on (the emr service then refuses to start).
      EMR_NATS_PASSWORD: ${NATS_EMR_PASSWORD:-}
      EMR_DATABASE_URL: postgres://${EMR_DB_USER:-emr_app}:${EMR_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-mhai}?sslmode=disable
      EMR_TRUSTED_KEYS_PATH: /trusted/request-keys.json
      EMR_SEAL_KEY_PATH: /emr-keys
      EMR_SECRETS_DIR: /emr-secrets
      # Empty: no rule set is active, every finding is shadow.
      EMR_RULE_SET_ACTIVE: ""
      # The only way out: egress-emr, with K_proxy, and the allow-list the
      # service writes for it (only its own egress clients use the proxy;
      # never HTTPS_PROXY).
      EMR_PROXY_URL: http://egress-emr:3128
      EMR_PROXY_KEY_PATH: /emr-proxy-key/k_proxy
      EMR_EGRESS_DIR: /emr-egress
    volumes:
      - trustedkeys:/trusted:ro
      - emr-keys:/emr-keys:ro
      - emr-secrets:/emr-secrets
      - emr-egress-conf:/emr-egress
      - emr-proxy-key:/emr-proxy-key:ro
    networks: [backend, emr-proxy]
    depends_on:
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }
      emr-keys: { condition: service_completed_successfully }
      emr-proxy-key: { condition: service_completed_successfully }
    healthcheck:
      disable: true

  # One-shot: K_proxy, the key emr and egress-emr share for the
  # per-connection Proxy-Authorization (emr keys proxy-init; kept when
  # there). Only those two mount it, read-only.
  emr-proxy-key:
    image: mhai-emr:local
    profiles: ["emr"]
    restart: "no"
    command: ["keys", "proxy-init", "--out", "/emr-proxy-key"]
    network_mode: none
    volumes:
      - emr-proxy-key:/emr-proxy-key
    depends_on:
      emr-keys: { condition: service_completed_successfully }

  # egress-emr (services/emr/cmd/egress-emr): the emr service's own CONNECT
  # proxy. It resolves an allowed name once, checks every address and dials
  # the one it checked; it refuses everything without a fresh allow-list.
  # No database, no NATS, no secret but K_proxy. EGRESS_EMR_INTERNAL_CIDRS
  # names the backend network's fixed subnet (EMR_BACKEND_SUBNET, below)
  # and, outside development, the host's own addresses: never reached even
  # when a connection declares them. The proxy adds its own networks, its
  # routing table's gateways and Docker's default bridge itself.
  egress-emr:
    image: mhai-emr:local
    profiles: ["emr"]
    restart: unless-stopped
    entrypoint: ["/egress-emr"]
    command: []
    environment:
      EGRESS_EMR_ALLOW_LIST: /emr-egress/allow.json
      EGRESS_EMR_KEY_PATH: /emr-proxy-key/k_proxy
      EGRESS_EMR_ENV: development
      EGRESS_EMR_INTERNAL_CIDRS: ${EGRESS_EMR_INTERNAL_CIDRS:-${EMR_BACKEND_SUBNET:-10.231.0.0/24}}
    volumes:
      - emr-egress-conf:/emr-egress:ro
      - emr-proxy-key:/emr-proxy-key:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [emr-proxy, egress-emr]
    depends_on:
      emr-proxy-key: { condition: service_completed_successfully }
    healthcheck:
      disable: true

  # Serves the CCA LLM (CCA_BACKEND=ollama).
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.0}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "ollama", "list"]

  # One-shot: pull OLLAMA_MODEL into the ollama volume, then exit.
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.0}
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]

  # The intelligence workers (Python, spec §4): `intelligence worker
  # --service <name>`, joined to core only by NATS. Each gets only its own
  # settings: no env_file (.env also holds core's secrets), its own NATS
  # user and password, the request-token trusted keys (public keys only,
  # read-only; never the private key) and, for the pipeline, its own
  # database login. TestComposeSplitsSecretsPerService checks this.
  #
  # APP_ENV must name development here: an unset APP_ENV counts as
  # production, where a worker needs NKeys and TLS and refuses to start
  # without them. Health is a NATS request (pipeline.health), so there is
  # no compose health check.
  pipeline:
    build:
      context: ./services/intelligence
      args:
        TORCH: ${TORCH:-cpu}
    image: mhai-intelligence:${TORCH:-cpu}
    restart: unless-stopped
    command: ["worker", "--service", "pipeline"]
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NATS_URL: nats://pipeline:${NATS_PIPELINE_PASSWORD:?set NATS_PIPELINE_PASSWORD in .env}@nats:4222
      INTELLIGENCE_TRUSTED_KEYS_PATH: /trusted/request-keys.json
      INTELLIGENCE_MAX_CONCURRENCY: ${INTELLIGENCE_MAX_CONCURRENCY:-4}
      # Its own login (a member of mhai_worker_app only; core-migrate makes
      # it). The password is a separate variable, never in the URL.
      INTELLIGENCE_DB_URL: postgres://postgres:5432/${POSTGRES_DB:-mhai}?sslmode=disable
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:-intelligence_app}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?set INTELLIGENCE_DB_PASSWORD in .env}
      # orchestrator (the real models) or stub (synthetic answers, development only).
      INTELLIGENCE_MODEL_CLIENT: ${INTELLIGENCE_MODEL_CLIENT:-orchestrator}
      # The warm-up page the image ships, for pinned roles (INTELLIGENCE_MODEL_ROLES).
      INTELLIGENCE_WARMUP_PAGE: /app/warmup/page.png
      # Traces and metrics, off while empty. With the observability profile:
      # http://otel-collector:4317. Spans carry ids, codes and numbers only.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${INTELLIGENCE_OTEL_ENDPOINT:-}
      # The models, as before the boundary.
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /home/appuser/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      NLI_MODEL: ${NLI_MODEL:-cross-encoder/nli-deberta-v3-base}
      CCA_BACKEND: ${CCA_BACKEND:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      CCA_MODEL: ${CCA_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      DENSE_MODEL: ${DENSE_MODEL:-all-MiniLM-L6-v2}
      DIA_MODEL: ${DIA_MODEL:-microsoft/swinv2-base-patch4-window8-256}
      QWEN_RPM: ${QWEN_RPM:-15}
      QWEN_TPM: ${QWEN_TPM:-30000}
      DEBERTA_RPM: ${DEBERTA_RPM:-120}
      TRUST_PASS_DEFAULT: ${TRUST_PASS_DEFAULT:-0.55}
      TRUST_REGEN_FLOOR: ${TRUST_REGEN_FLOOR:-0.30}
      SE_THRESHOLD_RAG: ${SE_THRESHOLD_RAG:-0.8}
      SE_K_SAMPLES: ${SE_K_SAMPLES:-5}
      PERSONA_ETA: ${PERSONA_ETA:-0.05}
      CMA_ES_MIN_CORRECTIONS: ${CMA_ES_MIN_CORRECTIONS:-50}
      AGENT_HTTP_TIMEOUT: ${AGENT_HTTP_TIMEOUT:-300}
      AGENT_HTTP_RETRIES: ${AGENT_HTTP_RETRIES:-2}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      core-migrate: { condition: service_completed_successfully }
      core-request-key: { condition: service_completed_successfully }
      ollama-init: { condition: service_completed_successfully }
    volumes:
      - trustedkeys:/trusted:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - hf-cache:/home/appuser/.cache/huggingface
    healthcheck:
      disable: true

  # The echo worker: tests and the smoke run only (spec §4), never in
  # production (it refuses to start outside development). Profile `test`;
  # the bff_direct echo.ping line for the BFF is in
  # services/nats/bff-clinical.test.conf only.
  echo:
    image: mhai-intelligence:${TORCH:-cpu}
    profiles: ["test"]
    restart: unless-stopped
    command: ["worker", "--service", "echo"]
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NATS_URL: nats://echo:${NATS_ECHO_PASSWORD:?set NATS_ECHO_PASSWORD in .env}@nats:4222
      INTELLIGENCE_TRUSTED_KEYS_PATH: /trusted/request-keys.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${INTELLIGENCE_OTEL_ENDPOINT:-}
    depends_on:
      nats: { condition: service_healthy }
      core-request-key: { condition: service_completed_successfully }
      pipeline: { condition: service_started }   # builds the shared image
    volumes:
      - trustedkeys:/trusted:ro
    healthcheck:
      disable: true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION:-0.162.0}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./services/intelligence/configs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  pgdata:
  natsdata:
  corekeys:
  trustedkeys:
  emr-keys:      # the emr service's sealing key pair (profile emr)
  emr-secrets:   # the emr service's file secret store (profile emr)
  emr-proxy-key: # K_proxy, for emr and egress-emr only (profile emr)
  emr-egress-conf: # the allow-list emr writes and egress-emr reads (profile emr)
  ollama:
  hf-cache:

networks:
  default: {}
  # Internal (no route out): Postgres and NATS for the emr service. Its
  # subnet is fixed so egress-emr can be told it (EGRESS_EMR_INTERNAL_CIDRS);
  # set EMR_BACKEND_SUBNET if 10.231.0.0/24 is taken on your machine.
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${EMR_BACKEND_SUBNET:-10.231.0.0/24}
  # Internal: the emr service and egress-emr only (profile emr).
  emr-proxy:
    internal: true
  # egress-emr's way out, and only its (profile emr).
  egress-emr: {}
