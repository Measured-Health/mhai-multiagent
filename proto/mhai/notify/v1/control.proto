syntax = "proto3";

// The notifications service's control operations, notify.v1.ctl.<op>
// (notifications design §7, ADR 0018). Core is the only caller; every
// request carries a request token (aud notifications) in its headers. Ids,
// closed codes and flags only: never an address, a name, a link, a token
// or any text.
package mhai.notify.v1;

option go_package = "github.com/Measured-Health/mhai-multiagent/services/gokit/notifypb;notifypb";

// notify.v1.ctl.health, as svc:core.
message HealthRequest {}

// Readiness flags and the enabled channels' names, no counts of anyone's
// messages. The service sends only when database_ready is true and at
// least one channel is enabled.
message HealthReply {
  // Its database login answers and holds mhai_notify and nothing more: not
  // a superuser, no BYPASSRLS, not a table owner, no other mhai_ role.
  bool database_ready = 1;
  // The channels NOTIFY_CHANNELS enables, by name ("log"; "email" from
  // PR 4). Empty: the service sends nothing.
  repeated string channels = 2;
}

// notify.v1.ctl.send_link, as svc:core, hospital-bound: the hospital is
// the token's hid, never a field (design §4.4). Core asks after an invite
// or a reset has committed; the link lives only in this request (NATS
// request/reply, never JetStream) and the service's memory. The service
// sends only to a user of the token's hospital with a token of this
// purpose issued in the last 2 minutes (notify_link_recipient).
message SendLinkRequest {
  // The recipient: a user id (a uuid), never an address.
  string user_id = 1;
  // invite or password_reset.
  string purpose = 2;
  // The secret link, on the app's address. Never logged or stored.
  string link = 3;
  // When the link stops working, Unix seconds.
  int64 expires_at = 4;
}

// outcome: accepted (the mail server took it); failed (refused, or kept
// failing after 3 tries); no_recipient (no such user of the hospital with a
// fresh token of the purpose); rate_limited; not_ready (no email channel,
// or the database didn't answer); invalid (a malformed request).
message SendLinkReply {
  string outcome = 1;
}
