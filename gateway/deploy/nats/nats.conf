# NATS server for the MHAI stack: the only link between the Go gateway and
# the Python workers (design section 4.3, 5.1).
#
# Dev: two password users. The passwords are read from the environment, never
# from this file or the repo:
#   NATS_GATEWAY_PASSWORD, NATS_WORKER_PASSWORD
# Use letters and digits only (the config parser treats other characters as
# syntax). The server refuses to start if either is unset.
#
# Production: replace `password:` with `nkey: <public key>` for each user (or
# switch to operator JWTs), generate the pair with `nk -gen user -pubout`,
# give each service its seed through a .creds / seed file (NATS_CREDS), and
# enable TLS in the `tls {}` block below.
#
# Permissions:
#   gateway  publish inference.v1.> and jobs.v1.>, plus the JetStream and KV
#            APIs; receives replies on its own inbox.
#   worker   subscribes inference.v1.>; publishes only replies (_INBOX.>) and
#            dead.v1.>. Nothing else can publish on inference.v1.>.

port: 4222
server_name: mhai-nats
http_port: 8222   # monitoring, for the container health check; not published

jetstream {
  store_dir: /data
}

# tls {
#   cert_file: /etc/nats/tls/server.pem
#   key_file:  /etc/nats/tls/server-key.pem
#   verify:    true
# }

authorization {
  users = [
    {
      user: gateway
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "inference.v1.>"
            "jobs.v1.>"
            "$JS.API.>"   # streams, consumers, KV bucket management
            "$JS.ACK.>"
            "$KV.>"       # KV puts, deletes
          ]
        }
        subscribe: {
          allow: ["_INBOX.>", "dead.v1.>"]
        }
      }
    }
    {
      user: worker
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "_INBOX.>"
            "dead.v1.>"
            "$JS.API.CONSUMER.INFO.JOBS.>"
            "$JS.API.CONSUMER.MSG.NEXT.JOBS.>"
            "$JS.ACK.JOBS.>"
          ]
        }
        subscribe: {
          allow: ["inference.v1.>", "_INBOX.>"]
        }
      }
    }
  ]
}
