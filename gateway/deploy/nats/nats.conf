# NATS server for the MHAI stack: the only link between the Go gateway and
# the Python workers (design section 4.3, 5.1).
#
# Dev: two password users. The passwords are read from the environment, never
# from this file or the repo:
#   NATS_GATEWAY_PASSWORD, NATS_WORKER_PASSWORD
# Use letters and digits only (the config parser treats other characters as
# syntax). The placeholder values in .env.example are rejected at startup.
#
# Production: replace `password:` with `nkey: <public key>` for each user.
# Generate a pair with `nk -gen user -pubout`; the service reads its seed file
# (gateway: NATS_NKEY_SEED_PATH, bus.Connect's nkeySeedPath). Enable the
# `tls {}` block below and keep the monitoring port off the network.
#
# Inboxes: each service replies on its own prefix (_INBOX_gateway,
# _INBOX_worker; bus.Connect / the worker's client set it with
# CustomInboxPrefix). A service may subscribe only to its own prefix, so
# nobody reads or forges another's replies. Workers answer requests through
# allow_responses, which permits one reply to a request they received.
#
# Permissions:
#   gateway  publish inference.v1.> and jobs.v1.>, the KV subjects, and the
#            JetStream management it needs (no stream delete or purge).
#   worker   subscribes inference.v1.>; publishes only replies and dead.v1.>,
#            plus pull-consumer calls on the JOBS stream. No KV access.

port: 4222
server_name: mhai-nats
http: 127.0.0.1:8222   # monitoring, for the container health check only

jetstream {
  store_dir: /data
}

# tls {
#   cert_file: /etc/nats/tls/server.pem
#   key_file:  /etc/nats/tls/server-key.pem
#   verify:    true
# }

authorization {
  users = [
    {
      user: gateway
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "inference.v1.>"
            "jobs.v1.>"
            "$KV.>"                          # KV puts and deletes
            "$JS.API.INFO"
            "$JS.API.STREAM.CREATE.>"
            "$JS.API.STREAM.UPDATE.>"
            "$JS.API.STREAM.INFO.>"
            "$JS.API.STREAM.NAMES"
            "$JS.API.STREAM.LIST"
            "$JS.API.STREAM.MSG.GET.>"
            "$JS.API.DIRECT.GET.>"           # KV reads
            "$JS.API.CONSUMER.>"             # KV watchers, JOBS consumers
          ]
          deny: [
            "$JS.API.STREAM.DELETE.>"
            "$JS.API.STREAM.PURGE.>"
          ]
        }
        subscribe: {
          allow: ["_INBOX_gateway.>", "dead.v1.>"]
        }
      }
    }
    {
      user: worker
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "dead.v1.>"
            "$JS.API.CONSUMER.INFO.JOBS.>"
            "$JS.API.CONSUMER.MSG.NEXT.JOBS.>"
            "$JS.ACK.JOBS.>"
          ]
        }
        subscribe: {
          allow: ["inference.v1.>", "_INBOX_worker.>"]
        }
        allow_responses: { max: 1, expires: "1m" }
      }
    }
  ]
}
