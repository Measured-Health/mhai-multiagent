# gitleaks configuration: the default rules, plus one narrow allowlist.
[extend]
useDefault = true

# The shared request-token vectors (Plan 3) are JWT-shaped test tokens signed
# with throwaway test keys generated for the vectors; they grant nothing. Only
# the jwt rule is waived, and only for these files: any other secret pattern
# in them still fails the scan.
[[allowlists]]
description = "Synthetic request-token test vectors"
targetRules = ["jwt"]
paths = ['''(^|/)testdata/request-tokens/[^/]+\.json$''']
