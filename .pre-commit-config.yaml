# Install once with `make install-dev` (runs `pre-commit install`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Ruff reads services/intelligence/pyproject.toml for these files.
      - id: ruff-check
        args: [--fix]
        files: ^services/intelligence/
      - id: ruff-format
        files: ^services/intelligence/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
        args: [--project, services/intelligence]
        files: ^services/intelligence/(uv\.lock|pyproject\.toml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
