  - {patient: rise-short, observation: c-106.4, rule_id: creatinine-rise-48h}
  - {patient: rise-outside-window, observation: c-110, rule_id: creatinine-rise-48h}
  - {patient: ratio-short, observation: c-119, rule_id: creatinine-ratio-7d}
  - {patient: baseline-not-final, observation: c-100, rule_id: creatinine-rise-48h}
  - {patient: baseline-not-final, observation: c-100, rule_id: creatinine-ratio-7d}
  - {patient: hb-fall-short, observation: hb-8, rule_id: haemoglobin-fall-24h}
