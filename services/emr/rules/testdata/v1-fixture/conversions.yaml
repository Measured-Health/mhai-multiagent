# The conversions rule set v1's golden tests run through (the normaliser's
# Maps.Convert, with the real unit table, services/emr/maps/common/units.yaml).
# A TEST FIXTURE: the production conversions for these LOINC codes come
# with the real code tables (plan Task 21, H6) and their clinical review
# (H4). The factors are the standard ones: glucose 1 mg/dL = 0.0555 mmol/L
# (molar mass 180.16 g/mol), creatinine 1 mg/dL = 88.4 umol/L (113.12
# g/mol), haemoglobin 10 g/L = 1 g/dL, platelets 10^3/uL = 10^9/L, and the
# exact ones: potassium and sodium (monovalent) 1 mEq/L = 1 mmol/L,
# troponin 1 pg/mL = 1 ng/L.
