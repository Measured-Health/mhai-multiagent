# NATS server for the MHAI stack: the only link between the core service
# (Go), the frontend's BFFs and the Python workers (intelligence boundary
# design, sections 5, 7.6, 9.2 and 17.4). Dev compose and every integration
# test run this file. services/nats/README.md explains it; the
# production-shaped config is deploy/nats/nats.conf.
#
# Dev: one password user per service. The passwords and the JetStream key
# come from the environment, never from this file or the repo:
#   NATS_GATEWAY_PASSWORD, NATS_PIPELINE_PASSWORD, NATS_ECHO_PASSWORD,
#   NATS_BFF_CLINICAL_PASSWORD, NATS_BFF_PLATFORM_PASSWORD, NATS_JS_KEY
# Use letters and digits only, starting with a letter (the config parser
# reads other characters as syntax and a leading digit as a number). An
# undefined variable stops the server; compose refuses placeholders.
#
# Production: NKeys instead of passwords (nkey: <public key>), TLS with
# verify, R3 streams (NATS_JS_REPLICAS=3 for core), and never the test
# include below. See README.md.
#
# Inboxes: each user receives replies only on its own prefix
# (_INBOX_gateway, _INBOX_worker.<service>, _INBOX_bff.<app>). Responders
# answer through allow_responses: one reply to a request they received.
# NATS does not check the reply subject a requester sets, so every
# responder checks the prefix itself before answering (README.md).
#
# The core service's user is named `gateway`: the name predates the rename
# to `core` and is kept so the security config stays stable.

port: 4222
server_name: mhai-nats
http: 127.0.0.1:8222   # monitoring, for the container health check only

# The outer bound on any message (request/reply bodies are at most 256 KB,
# jobs 64 KB, checked by the services).
max_payload: 1MB

# File storage, encrypted at rest. The key is a secret from the
# environment; losing it loses the store.
jetstream {
  store_dir: /data
  cipher: chachapoly
  key: $NATS_JS_KEY
}

# tls {
#   cert_file: /etc/nats/tls/server.pem
#   key_file:  /etc/nats/tls/server-key.pem
#   ca_file:   /etc/nats/tls/ca.pem
#   verify:    true
# }

authorization {
  users = [
    # The core service.
    {
      user: gateway
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "inference.v1.>"                             # requests to the workers
            "jobs.v1.>"                                  # jobs, on the JOBS stream
            "$KV.>"                                      # KV puts and deletes (only the four buckets' streams exist)
            # JetStream: the four KV streams, JOBS and DEAD only. No stream
            # delete or purge, no message delete, no other stream.
            "$JS.API.INFO"                                  # account info (nats.go checks it before opening a bucket)
            "$JS.API.STREAM.CREATE.KV_denylist"
            "$JS.API.STREAM.UPDATE.KV_denylist"
            "$JS.API.STREAM.INFO.KV_denylist"
            "$JS.API.STREAM.CREATE.KV_login_attempts"
            "$JS.API.STREAM.UPDATE.KV_login_attempts"
            "$JS.API.STREAM.INFO.KV_login_attempts"
            "$JS.API.STREAM.CREATE.KV_mfa_attempts"
            "$JS.API.STREAM.UPDATE.KV_mfa_attempts"
            "$JS.API.STREAM.INFO.KV_mfa_attempts"
            "$JS.API.STREAM.CREATE.KV_login_ceiling"
            "$JS.API.STREAM.UPDATE.KV_login_ceiling"
            "$JS.API.STREAM.INFO.KV_login_ceiling"
            "$JS.API.STREAM.CREATE.JOBS"
            "$JS.API.STREAM.UPDATE.JOBS"
            "$JS.API.STREAM.INFO.JOBS"
            "$JS.API.STREAM.CREATE.DEAD"
            "$JS.API.STREAM.UPDATE.DEAD"
            "$JS.API.STREAM.INFO.DEAD"
            "$JS.API.STREAM.MSG.GET.KV_denylist"
            "$JS.API.DIRECT.GET.KV_denylist.>"
            "$JS.API.STREAM.MSG.GET.KV_login_attempts"
            "$JS.API.DIRECT.GET.KV_login_attempts.>"
            "$JS.API.STREAM.MSG.GET.KV_mfa_attempts"
            "$JS.API.DIRECT.GET.KV_mfa_attempts.>"
            "$JS.API.STREAM.MSG.GET.KV_login_ceiling"
            "$JS.API.DIRECT.GET.KV_login_ceiling.>"
            "$JS.API.CONSUMER.CREATE.KV_denylist.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_denylist.>"
            "$JS.API.CONSUMER.INFO.KV_denylist.>"
            "$JS.API.CONSUMER.CREATE.KV_login_attempts.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_login_attempts.>"
            "$JS.API.CONSUMER.INFO.KV_login_attempts.>"
            "$JS.API.CONSUMER.CREATE.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.INFO.KV_mfa_attempts.>"
            "$JS.API.CONSUMER.CREATE.KV_login_ceiling.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.KV_login_ceiling.>"
            "$JS.API.CONSUMER.INFO.KV_login_ceiling.>"
            "$JS.API.CONSUMER.CREATE.JOBS.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.JOBS.>"
            "$JS.API.CONSUMER.INFO.JOBS.>"
            "$JS.API.CONSUMER.CREATE.DEAD.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.DEAD.>"
            "$JS.API.CONSUMER.INFO.DEAD.>"
            "$JS.API.CONSUMER.MSG.NEXT.DEAD.core_dead"     # the dead-letter consumer
            "$JS.ACK.DEAD.core_dead.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX_gateway.>"                           # its own replies
            "api.v1.> core"                              # the BFFs' requests, in queue group core only
            "authz.v1.grant.> core"                      # the workers' grant requests, in queue group core only
          ]
        }
        # Answers the BFF and the workers: one reply per request received,
        # within a minute, and no general publish right on their inboxes.
        allow_responses: { max: 1, expires: "1m" }
      }
    }
    # The pipeline worker: request/reply on its own subjects, its own
    # durable consumer on JOBS, dead letters and its own grant subject.
    {
      user: pipeline
      password: $NATS_PIPELINE_PASSWORD
      permissions: {
        publish: {
          allow: [
            "dead.v1.>"
            "authz.v1.grant.pipeline"
            "$JS.API.CONSUMER.INFO.JOBS.pipeline"
            "$JS.API.CONSUMER.MSG.NEXT.JOBS.pipeline"
            "$JS.ACK.JOBS.pipeline.>"
          ]
        }
        subscribe: {
          allow: [
            "inference.v1.pipeline.> pipeline"           # in queue group pipeline only
            "_INBOX_worker.pipeline.>"
          ]
        }
        allow_responses: { max: 1, expires: "1m" }
      }
    }
    # The echo worker (test and dev only; no jobs).
    {
      user: echo
      password: $NATS_ECHO_PASSWORD
      permissions: {
        publish: {
          allow: ["authz.v1.grant.echo"]
        }
        subscribe: {
          allow: [
            "inference.v1.echo.> echo"                   # in queue group echo only
            "_INBOX_worker.echo.>"
          ]
        }
        allow_responses: { max: 1, expires: "1m" }
      }
    }
    # The clinical app's BFF. The whole user is in the include, because its
    # bff_direct subjects here are test-only and an include can't add one
    # entry to an allow list. Production defines this user itself.
    { include "bff-clinical.test.conf" }
    # The platform app's BFF: its API subject and its own inbox, nothing else.
    {
      user: bff_platform
      password: $NATS_BFF_PLATFORM_PASSWORD
      permissions: {
        publish: {
          allow: ["api.v1.platform"]
        }
        subscribe: {
          allow: ["_INBOX_bff.platform.>"]
        }
      }
    }
  ]
}
