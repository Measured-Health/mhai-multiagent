# The emr service's NATS user, ON (ADR 0014; EMR design §3.2). nats.conf
# includes /etc/nats/emr.conf; dev compose mounts this file there only when
# NATS_EMR_CONF=emr.conf (with NATS_EMR_PASSWORD set), for the profile emr,
# and the tests mount it to check the emr user's rights. Off by default:
# emr-off.conf, which needs no variable.
#
# It answers core's control calls in queue group emr, publishes ids-only
# events onto the EMR stream and its dead letters, and pulls only its own
# two durables. No KV, no jobs.v1, no inference.v1, no api.v1, no stream or
# consumer management (core creates EMR and its durables).
user: emr
password: $NATS_EMR_PASSWORD
permissions: {
  publish: {
    allow: [
      "emr.v1.*.fetched"
      "emr.v1.*.finding"
      "emr.v1.*.signal"
      "records.v1.*.created"
      "dead.v1.*.emr_normalise"
      "dead.v1.*.emr_rules"
      "$JS.API.CONSUMER.INFO.EMR.emr_normalise"
      "$JS.API.CONSUMER.MSG.NEXT.EMR.emr_normalise"
      "$JS.ACK.EMR.emr_normalise.>"
      "$JS.API.CONSUMER.INFO.EMR.emr_rules"
      "$JS.API.CONSUMER.MSG.NEXT.EMR.emr_rules"
      "$JS.ACK.EMR.emr_rules.>"
    ]
  }
  subscribe: {
    allow: [
      "emr.v1.ctl.> emr"                           # in queue group emr only
      "_INBOX_worker.emr.>"
    ]
  }
  allow_responses: { max: 1, expires: "1m" }
}
