# The notifications service's NATS user, OFF: the default include for
# /etc/nats/notifications.conf (see notifications.conf). It needs no
# variable, so dev setups run without NATS_NOTIFICATIONS_PASSWORD. The user
# can't sign in and could do nothing if it did. Its NKey is a "nothing up my
# sleeve" public key: the Ed25519 point with y = 26 (the smallest y whose
# point has the group's prime order, so it is not a weak small-order key
# that accepts forged signatures). Nobody knows its private scalar, so no
# seed exists for it. It is not a random string, so the secret scanner has
# nothing to flag.
nkey: UANAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABKPD
permissions: {
  publish: { deny: [">"] }
  subscribe: { deny: [">"] }
}
