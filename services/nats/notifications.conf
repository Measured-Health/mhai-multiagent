# The notifications service's NATS user, ON (ADR 0018; notifications design
# §7). nats.conf includes /etc/nats/notifications.conf; dev compose mounts
# this file there only when NATS_NOTIFICATIONS_CONF=notifications.conf
# (with NATS_NOTIFICATIONS_PASSWORD set), for the profile notifications, and
# the tests mount it to check the user's rights. Off by default:
# notifications-off.conf, which needs no variable.
#
# It answers core's control calls (notify.v1.ctl.>) in queue group
# notifications only, through allow_responses. From PR 3 it pulls and acks
# its own NOTIFY durable, notify_send, and publishes its dead letters
# (dead.v1.<hid>.notify_send: ids and a code) onto DEAD, whose publish acks
# come to its own inbox. No KV, no jobs.v1, no inference.v1, no api.v1, no
# emr.v1, no documents.v1, no stream or consumer management (core creates
# NOTIFY and the durable), and never a due message: only core publishes
# notify.v1.*.due.
user: notifications
password: $NATS_NOTIFICATIONS_PASSWORD
permissions: {
  publish: {
    allow: [
      "dead.v1.*.notify_send"
      "$JS.API.CONSUMER.INFO.NOTIFY.notify_send"
      "$JS.API.CONSUMER.MSG.NEXT.NOTIFY.notify_send"
      "$JS.ACK.NOTIFY.notify_send.>"
    ]
  }
  subscribe: {
    allow: [
      "notify.v1.ctl.> notifications"              # in queue group notifications only
      "_INBOX_worker.notifications.>"              # its own replies (pull batches, publish acks)
    ]
  }
  allow_responses: { max: 1, expires: "1m" }
}
