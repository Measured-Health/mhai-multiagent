# The clinical app's BFF user for dev compose and the tests, included by
# nats.conf. It lives in its own file because its bff_direct subjects are
# test-only (echo.ping) and no test-only subject may reach production: the
# production config (deploy/nats/nats.conf and its successors) defines
# bff_clinical itself and never includes a *.test.conf file. A test checks
# both (services/core/internal/bus/conf_test.go).
#
# Publish: its API subject, and the bff_direct operations one by one
# (operations.json; spec 17.2). Subscribe: its own inbox only.
user: bff_clinical
password: $NATS_BFF_CLINICAL_PASSWORD
permissions: {
  publish: {
    allow: [
      "api.v1.clinical"
      "inference.v1.echo.ping"
    ]
  }
  subscribe: {
    allow: ["_INBOX_bff.clinical.>"]
  }
}
