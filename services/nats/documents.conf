# The documents service's NATS user, ON (ADR 0016; documents design §8 and
# §17 departure 3). nats.conf includes /etc/nats/documents.conf; dev compose
# mounts this file there only when NATS_DOCUMENTS_CONF=documents.conf (with
# NATS_DOCUMENTS_PASSWORD set), for the profile documents, and the tests
# mount it to check the user's rights. Off by default: documents-off.conf,
# which needs no variable.
#
# PR 1: it answers core's control calls in queue group documents, through
# allow_responses, and publishes nothing else. It makes no request, so it
# has no inbox yet (_INBOX_worker.documents.> comes with the first PR that
# asks something). intake, page, scanned and its
# DOCS durable come with the PRs that use them. No KV, no jobs.v1, no
# inference.v1, no api.v1, no emr.v1, no stream or consumer management.
user: documents
password: $NATS_DOCUMENTS_PASSWORD
permissions: {
  publish: {
    deny: [">"]
  }
  subscribe: {
    allow: [
      "documents.v1.ctl.> documents"               # in queue group documents only
    ]
  }
  allow_responses: { max: 1, expires: "1m" }
}
