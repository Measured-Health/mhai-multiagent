# The documents service's NATS user, ON (ADR 0016; documents design §8 and
# §17 departure 3). nats.conf includes /etc/nats/documents.conf; dev compose
# mounts this file there only when NATS_DOCUMENTS_CONF=documents.conf (with
# NATS_DOCUMENTS_PASSWORD set), for the profile documents, and the tests
# mount it to check the user's rights. Off by default: documents-off.conf,
# which needs no variable.
#
# It answers core's control calls in queue group documents, through
# allow_responses. From PR 4 it pulls and acks its own DOCS durable,
# documents_scan, and publishes documents.v1.<hid>.scanned (ids and a
# code) onto DOCS, whose publish acks come to its own inbox. intake and
# page come with the PRs that use them (7 and 10). No KV, no jobs.v1, no
# inference.v1, no api.v1, no emr.v1, no stream or consumer management
# (core creates DOCS and the durable), and no uploaded: only core and the
# emr service announce an upload.
user: documents
password: $NATS_DOCUMENTS_PASSWORD
permissions: {
  publish: {
    allow: [
      "documents.v1.*.scanned"
      "$JS.API.CONSUMER.INFO.DOCS.documents_scan"
      "$JS.API.CONSUMER.MSG.NEXT.DOCS.documents_scan"
      "$JS.ACK.DOCS.documents_scan.>"
    ]
  }
  subscribe: {
    allow: [
      "documents.v1.ctl.> documents"               # in queue group documents only
      "_INBOX_worker.documents.>"                  # its own replies (pull batches, publish acks)
    ]
  }
  allow_responses: { max: 1, expires: "1m" }
}
