# Minimal collector: receive OTLP from core and the intelligence workers
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 on each) and log it.
# Spans have already passed each service's attribute allow-list (ids, codes
# and numbers only), so nothing here needs to scrub PHI. Metrics are also
# served for Prometheus on :8889 (names like boundary_refusals_total). Swap
# the debug exporter for your backend (Tempo, Jaeger, an OTLP SaaS).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
