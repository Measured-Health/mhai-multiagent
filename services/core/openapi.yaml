        "503": { $ref: "#/components/responses/Problem" }

  /platform/audit/verify:
    post:
      operationId: startAuditCheck
      summary: Start a check of the audit chain, or get the running one.
      description: |
        Platform admins and auditors (an auditor write). No body, or `{}`.
        One check runs at a time: a start while one is running returns its
        id. The check walks the whole chain as `mhai_platform` with a
        10-minute budget; it is `intact` only when the whole chain was
        walked, and a spent budget is `error` (`timed_out`). Written as
        `audit.verify_started` and, when it ends, `audit.verify_finished`.
        A check also runs daily at 06:00 UTC.
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The new or running check.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                additionalProperties: false
                properties:
                  run_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

