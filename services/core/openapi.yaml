        `mfa_required`, a wrong one 403 `mfa_invalid` (audited).
        `cloud_provider` is `openai`, `anthropic`, `xai` or null (off: the
        hospital's questions run on the local models). A provider needs an
        `agreement_ref`, the reference of the recorded agreement check:
        `AGR-YYYY-NNNN` or `DPA-YYYY-NNNN` (2 to 8 digits after the year),
        or `DEMO-SYNTHETIC` for the synthetic demo. It is a document
        reference, never a person's or patient's name or identifier. Off
        has no reference: null clears it, and a reference with a null
        provider is 422. A provider this deployment
        hasn't enabled (`CORE_CLOUD_PROVIDERS`) is 409 `conflict`. The body
        is checked first (422), then the provider (409), the hospital
        (404), the session's 10 writes a minute (429 `rate_limited`), then
