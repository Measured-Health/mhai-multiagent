  /platform/guardrails/periods:
    get:
      operationId: getPlatformGuardrailPeriods
      summary: Guardrail (HGA) statistics across hospitals for the latest finished calendar period, under the small-group rules.
      description: |
        Platform admins and auditors, platform audience, two-step always.
        New (Plan 7c spec §9, rulings R41a, R41a-2, R41a-4). `period` is
        `week`, `month` or `quarter` (UTC). A week is month-aligned: days
        1–7, 8–14, 15–21 and 22 to the month's end (7 to 10 days); weeks nest
        in months and months in quarters. The response is the latest
        published period of that kind: `from` and `to` bound it, and
        `updated_at` is when its one stored snapshot was computed (15
        minutes or more after it ended). Its figures never change, so every
        read of a period is identical. Only periods that start at or after
        the 7c-1 release are published; until the first one of a kind is,
        or if its snapshot couldn't be computed, the answer is 503
        `not_ready`. The cells are the same ones, shown and hidden, as the
        analytics Answer quality area of the same period.

        Per hospital and across all of them (`all`): the answers (questions
        with a decision, counted in the question's week), and of those
        `pass`, `regenerate` and `escalate` (a missing or unknown decision
        counts as `escalate`), the `degraded` ones, and the three shares of
        `answers`.

        Every value is guarded, `{value, suppressed}`, by the small-group
        rules: a count of 1 to 4 is `{value: null, suppressed: true}`, 0 is
        0; in each set that adds up (a row's answers and its three parts,
        each column's `all` and its hospitals, a month and its weeks, a
        quarter and its months) enough is hidden that the hidden members
        together are at least 5 and never exactly one is hidden; `degraded`
        is hidden when its `answers` is, or when `answers − degraded` is 1 to
        4; a share is hidden when its numerator or its complement is 1 to 4
        or either count is hidden; and more is hidden until no hidden value,
        nor a hidden total of 1 to 4, can be worked out from everything
        published so far. A share is 0 to 1 with four decimal places;
        `{value: null, suppressed: false}` is no answers to divide by.

        Six reads a minute per session, shared with `/platform/guardrails`,
        then 429 `rate_limited`. Not recorded in the audit log (aggregates
        about no person).
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - { name: period, in: query, required: true, schema: { type: string, enum: [week, month, quarter] } }
      responses:
        "200":
          description: The guarded statistics of the latest published period.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardrailPeriodsOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/analytics:
    get:
      operationId: getPlatformAnalytics
      summary: Platform analytics across hospitals for the latest finished calendar period, from its one stored guarded snapshot.
      description: |
        Platform admins and auditors, platform audience, two-step always.
        New (Plan 7c spec §7.1, rulings R41a to R41a-5). `period` is `week`,
        `month` or `quarter` (UTC; a week is month-aligned, days 1–7, 8–14,
        15–21 and 22 to the month's end); anything else is 422
        `validation_failed`. `from` and `to` bound the latest published
        period of that kind. Every figure is read from that period's one
        stored snapshot, computed once after the period ended (`updated_at`),
        so every read of a period is identical; no read computes a figure.

        `use`, `quality` and `hospitals` each carry their data, or
        `{unavailable: true}` when the period's snapshot couldn't be
        computed or read. Before the first period of a kind is published
        (only periods that start at or after the 7c-1 release are), `from`
        and `to` are null and each of those areas is `{not_yet: true,
        first_from}`, the start of the first period that will be. `alerts`
        is null (no patient alerts yet).

        `changes` stays `{unavailable: true}`: What changed is the new
        `what_changed` (Plan 7c-3, spec §7.3; a property of its own because
        widening `changes` would not be additive). It is the same for every
        `period`:
        the newest weekly evaluation of What changed, `{updated_at, window,
        items}`, or `{unavailable: true}` before the first evaluation or
        when it can't be read. Once a week, after the week's snapshot is
        stored, the latest week is compared with the month that finished
        before it started (`window` runs from that month's start to the
        week's end), from the two stored snapshots' shown cells only: a
        change is flagged only when both sides, and the figures its minimum
        rests on, are shown. `current` is the week's shown value;
        `previous` the month's (for questions, per day scaled to the
        week's length, one decimal). Thresholds: questions at least 10 on
        both sides and a change of at least 50%; the needs-review share and
        the agreement rate with at least 20 answers or reviews on both sides
        and a change of at least 15 points. Active clinicians and questions
        per clinician are not compared (ruling C9: a week's distinct
        clinicians aren't comparable with a month's). A change keeps its `id` while each week flags it again
        and leaves the list when one doesn't. `summary` holds the two values
        and no hospital name; `serious` is always false (no patient alerts
        yet). Items not followed up come first, each group by size of
        change. `follow_up.note` is returned here and in the follow-up
        writes' replies only; `by_you` is set per caller.

        Rows are the hospitals the period lists. Every value is guarded,
        `{value, suppressed}`, as on `/platform/guardrails/periods`, whose
        cells for the same period are the same, shown and hidden. The
        confidence mix is the HGA decision (high pass, medium regenerate,
        low escalate); `needs_review_share` is escalated answers over
        answers; `agreement_rate` is agreed reviews over reviews. Each
        `median` is the median over the hospitals whose value is shown (a
        count median strictly between 0 and 5 is hidden; none shown is
        `{value: null, suppressed: false}`). `trend` is the all-hospitals
        cell (questions for Use, the needs-review share for Quality) of each
        published period of the latest 12 weeks, 12 months or 8 quarters,
        oldest first: one period each, never a total over several; a period
        whose snapshot couldn't be computed is hidden.

        Thirty reads a minute per session, shared with the series routes,
        then 429 `rate_limited`. Not recorded in the audit log (aggregates
        about no person).
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - { name: period, in: query, required: true, schema: { type: string, enum: [week, month, quarter] } }
      responses:
        "200":
          description: The latest published period's analytics.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/analytics/hospitals/{id}/series:
    get:
      operationId: getPlatformAnalyticsHospitalSeries
      summary: One hospital's stored figure for each of the latest periods, with the other hospitals' median.
      description: |
        Platform admins and auditors, platform audience, two-step always.
