  /platform/analytics/changes/{id}/follow-up:
    put:
      operationId: putPlatformAnalyticsFollowUp
      summary: Follow up an open change, or edit the note of your own follow-up.
      description: |
        Platform admins only (an auditor is 403 `forbidden`; hospital
        audiences `not_platform`), two-step always, `Idempotency-Key` as
        every write; no step-up (a follow-up changes no figure). New (Plan
        7c spec §7.4, Plan 7c-3). `version` must be the change's current
        `version`, or 409 `conflict`; of two writes with one version, one
        succeeds and the other is 409. A closed change is 409 `conflict`,
        an unknown id 404 `not_found`. With no follow-up in place this marks
        the change followed up; with the caller's own it replaces the note
        (`follow_up.version` moves on); with another admin's it is 403
        `forbidden` (they undo first). `note` is optional: 1 to 500
        characters, newlines allowed, no other control or format character
        and no line or paragraph separator, or 422 `validation_failed`;
        null or absent is no note. Every write moves the change's `version`
        on and writes one audit entry in the same transaction
        (`analytics.followed_up` with whether there is a note, or
        `analytics.follow_up_edited`), never the note itself. Ten writes a
        minute per session, `PUT` and `DELETE` together, then 429
        `rate_limited`. Answers the change as the changes list sends it.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 500, nullable: true }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsChange" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlatformAnalyticsFollowUp
      summary: Undo a change's follow-up.
      description: |
        Platform admins only (an auditor is 403 `forbidden`; hospital
        audiences `not_platform`), two-step always, `Idempotency-Key` as
        every write. New (Plan 7c spec §7.4, Plan 7c-3). Undoes the
        follow-up, whoever wrote it. A stale `version`, a closed change or
        no follow-up to undo is 409 `conflict`; an unknown id 404
        `not_found`. One `analytics.follow_up_undone` audit entry in the
        same transaction. Ten writes a minute per session, shared with the
        `PUT`, then 429 `rate_limited`. Answers the change as the changes
        list sends it.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsChange" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/jobs:
    get:
      operationId: listPlatformJobs
      summary: The failed jobs, newest failure first.
      description: |
        Platform admins and auditors, platform audience, two-step always.
        `run_query` (questions) and `approve_correction` jobs of every
        hospital, read through `mhai_platform_jobs()`: the contract's keys
        only, never the subject, the user or an error message. `status` is
        `failed` (default), `retrying`, `retried`, `cancelled` or `all`;
        retried and cancelled jobs are listed for 30 days. `kind` is the
        error kind (Plan 3's code-to-kind table). Ids are `q_<uuid>` for a
        question and `j_<uuid>` for a jobs row, opaque to the app. Pages of
        50; `cursor` is bound to the session and the filters (another
        session's, or one reused with other filters, is 422). Not recorded
        in the audit log.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - { name: status, in: query, schema: { type: string, enum: [failed, retrying, retried, cancelled, all] } }
        - name: type
          in: query
          schema: { type: string, enum: [run_query, submit_feedback, approve_correction, ingest_document, run_triage, kb_search, feedback_buffer_reset, retention_purge] }
        - { name: hospital, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [timeout, unreachable, unreadable, invalid, other] } }
        - { name: cursor, in: query, schema: { type: string, pattern: "^[0-9a-f]{80}$" } }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/jobs/retry:
    post:
      operationId: retryPlatformJobs
      summary: Retry failed jobs, each as the job's creator.
      description: |
        Platform admins only (an auditor is 403); no step-up. 1 to 50 ids.
        Each job that is `failed` now is re-queued (a retry: its attempts
        start a new budget) and re-minted as its creator with their current
        roles, under a new message id; it joins its kind's in-flight limit
        (a question at its hospital's cap, and a job whose audit facts are
        still being recorded, are skipped). A job whose creator was
        deactivated or no longer holds the operation's role, an approval
        whose correction no longer has a second person, an unknown id and a
        job that isn't failed are `skipped`, never an error. `retried` means
        attempted: a job can fail again. 10 calls a minute per session (429
        `rate_limited`). One `job.retried` audit entry per call with the
        count, when any job was retried.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, rate_limited, unavailable, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { $ref: "#/components/schemas/JobIDs" }
      responses:
        "200":
          description: What was retried and what was skipped.
          content:
            application/json:
              schema:
                type: object
                required: [retried, skipped]
                additionalProperties: false
                properties:
                  retried: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/jobs/cancel:
    post:
      operationId: cancelPlatformJobs
      summary: Cancel failed or waiting jobs (step-up).
      description: |
        Platform admins only (an auditor is 403), with a fresh TOTP code
        (`mfa_code`) or an unused backup code (`backup_code`): none is 403
        `mfa_required`, a wrong one 403 `mfa_invalid`. 1 to 50 ids; `reason`
        is `no_longer_needed`, `cant_succeed` or `other` (`other` needs a
        note); `note` is at most 500 characters, stored with the
        cancellation and never logged or audited. A `failed`, queued or
        retrying job is cancelled (a question then shows as failed,
        cancelled); a running or finished job, an unknown id and a job whose
        audit facts are still being recorded are `skipped`. One
        `job.cancelled` audit entry per call with the count and the reason,
        when any job was cancelled.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, validation_failed, unavailable, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reason]
              additionalProperties: false
              properties:
                ids: { $ref: "#/components/schemas/JobIDs" }
                reason: { type: string, enum: [no_longer_needed, cant_succeed, other] }
                note: { type: string, maxLength: 500 }
                mfa_code: { type: string }
                backup_code: { type: string }
      responses:
        "200":
          description: What was cancelled and what was skipped.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled, skipped]
                additionalProperties: false
                properties:
                  cancelled: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/hospitals/{id}/model-policy:
    get:
      operationId: getHospitalModelPolicy
      summary: A hospital's cloud model policy and this month's token usage.
      description: |
        Platform admins and auditors. The hospital is off (local models)
        exactly when `provider_code` is null. `provider_code` is the source
        of truth: `cloud_provider` is null for off and also for `gemini`,
        which its enum can't name. With no policy: `provider_code`,
        `cloud_provider` and `agreement_ref` null, the default budget,
        `updated_at` null. `usage` is this month's (UTC)
        token ledger, zeros when nothing was used. An id that is no
        hospital's, or not a canonical uuid, is 404 `not_found`.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, validation_failed, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setHospitalModelPolicy
      summary: Set a hospital's cloud model policy (step-up).
      description: |
        Platform admins only (an auditor is 403), with a fresh TOTP code
        (`mfa_code`) or an unused backup code (`backup_code`): none is 403
        `mfa_required`, a wrong one 403 `mfa_invalid` (audited).
        `cloud_provider` is `openai`, `anthropic`, `xai`, `gemini` (Google
        Gemini, added in 1.16.0) or null (off: the hospital's questions run on
        the local models). The reply reports the provider in `provider_code`. A provider needs an
        `agreement_ref`, the reference of the recorded agreement check:
        `AGR-YYYY-NNNN` or `DPA-YYYY-NNNN` (2 to 8 digits after the year),
        or `DEMO-SYNTHETIC` for the synthetic demo. It is a document
        reference, never a person's or patient's name or identifier. Off
        has no reference: null clears it, and a reference with a null
        provider is 422. A provider this deployment
        hasn't enabled (`CORE_CLOUD_PROVIDERS`) is 409 `conflict`. The body
        is checked first (422), then the provider (409), the hospital
        (404), the session's 10 writes a minute (429 `rate_limited`), then
        the code. One `hospital.model_policy_changed` audit entry per
        write. Answers as the GET.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, not_found, conflict, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cloud_provider, monthly_token_budget]
              additionalProperties: false
              properties:
                cloud_provider: { type: string, enum: [openai, anthropic, xai, gemini], nullable: true }
                agreement_ref: { type: string, pattern: "^(DEMO-SYNTHETIC|(AGR|DPA)-[0-9]{4}-[0-9]{2,8})$", nullable: true }
                monthly_token_budget: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
                mfa_code: { type: string }
                backup_code: { type: string }
      responses:
        "200":
          description: The policy as written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/hospitals/{id}/emr-rule-set:
    get:
      operationId: getHospitalEMRRuleSet
      summary: The EMR rule set activated for a hospital, or shadow.
      description: |
        Platform admins and auditors. `version` and `sha256` are the rule
        set file activated for the hospital (as `emr rules check` prints
        them), or both null: shadow, the default, in which every EMR
        finding is stored for review and none is an alert. An id that is
        no hospital's, or not a canonical uuid, is 404 `not_found`.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, validation_failed, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The hospital's rule set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EMRRuleSet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setHospitalEMRRuleSet
      summary: Activate an EMR rule set for a hospital, or go back to shadow (step-up).
      description: |
        Platform admins only (an auditor is 403), with a fresh TOTP code
        (`mfa_code`) or an unused backup code (`backup_code`). `version`
        and `sha256` (64 lower-case hex) name the exact rule set file to
        activate; null for both puts the hospital back in shadow. Both keys
        are required. Activation alone raises no alert: the emr service
        alerts only when the deployment also names the version
        (`EMR_RULE_SET_ACTIVE`) and its loaded file has the same hash.
        Off (no `CORE_EMR_ENABLED`) the PUT is 503 `not_ready`. The body
        is checked first (422), then the hospital (404), the session's 10
        writes a minute (429 `rate_limited`), then the code. One
        `emr.rule_set_switched` audit entry per write. Answers as the GET.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, not_found, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, sha256]
              additionalProperties: false
              properties:
                version: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", nullable: true }
                sha256: { type: string, pattern: "^[0-9a-f]{64}$", nullable: true }
                mfa_code: { type: string }
                backup_code: { type: string }
      responses:
        "200":
          description: The hospital's rule set as written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EMRRuleSet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/emr/connector-types:
    get:
      operationId: listEmrConnectorTypes
      summary: The record connection types this deployment offers.
      description: |
        Platform admins and auditors. The types named by
        `CORE_EMR_CONNECTOR_TYPES` that the emr service can run, each with
        the fields its form shows. `{types: []}` when EMR is off
        (`CORE_EMR_ENABLED` false, the default) or no type is offered.
        Types name a standard or a method, never a product.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The offered types.
          content:
            application/json:
              schema:
                type: object
                required: [types]
                additionalProperties: false
                properties:
                  types: { type: array, items: { $ref: "#/components/schemas/EmrConnectorType" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /platform/emr/connections:
    get:
      operationId: listEmrConnections
      summary: Record connections, and hospitals with none.
      description: |
        Platform admins and auditors. Ordered by hospital name, then source
        label. `hospital` limits both lists to one hospital; `state` is
        `all` (default), `needs_attention` (on, with errors or paused),
        `off` (switched off, tested or not) or `not_connected` (only the
        hospitals, not removed, with no connection). A summary carries no
        address, settings or credentials. Empty when EMR is off.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - { name: hospital, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [all, needs_attention, off, not_connected] } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The connections and the hospitals not connected.
          content:
            application/json:
              schema:
                type: object
                required: [connections, not_connected]
                additionalProperties: false
                properties:
                  connections: { type: array, items: { $ref: "#/components/schemas/EmrConnectionSummary" } }
                  not_connected: { type: array, items: { $ref: "#/components/schemas/EmrPerson" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /platform/emr/connections/{id}:
    get:
      operationId: getEmrConnection
      summary: One record connection.
      description: |
        Platform admins and auditors. Credentials read as the time each was
        set for the connection's current address (`set_at`), never a value;
        null when not set. 404 when EMR is off.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, validation_failed, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmrConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateEmrConnection
      summary: Change a record connection (step-up).
      description: |
        Platform admins only, with a fresh code (`mfa_code` or
        `backup_code`). Send only what changes, and `version` (a stale one
        is 409 `conflict`, as is a label the hospital already has). `settings` keys are merged (an empty string
        removes an optional one); `credentials` are only the ones being
        replaced. A change of the address, settings, credentials or private
        network clears `last_test`; a label or interval change keeps it.
        Credentials are bound to the address they were entered for: a
        change of the base address's or the token address's scheme, host
        or port deletes every credential in the emr service before the
        change is saved (no confirmation: 503 `unavailable` and nothing
        changes), switches the connection off, and leaves every `set_at`
        null; new credentials in the same request are kept for the new
        address. Credentials are sent to the emr service after the change
        is saved: if it doesn't confirm them, the change stays saved and
        the answer is 200 with `credentials_missing` true (on the same
        address the old credentials are deleted too and the connection is
        switched off); re-send them with PATCH. The request body is never
        logged or stored; the idempotency store keeps a keyed hash of it.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, not_found, conflict, hospital_removed, validation_failed, not_ready, unavailable, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmrConnectionPatch" }
      responses:
        "200":
          description: The connection as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmrConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /platform/emr/connections/{id}/enabled:
    put:
      operationId: setEmrConnectionEnabled
      summary: Switch a record connection on or off (step-up).
      description: |
        Platform admins only, with a fresh code. On needs an offered type
        (422 `no_type`) and a passing test of the saved settings (409
        `not_tested`); a hospital removed or being removed is 409
        `hospital_removed`. Off always works and keeps the credentials.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, not_found, conflict, not_tested, hospital_removed, validation_failed, no_type, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, version]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                version: { type: integer, minimum: 1 }
                mfa_code: { type: string }
                backup_code: { type: string }
      responses:
        "200":
          description: The connection as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmrConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /platform/emr/connections/{id}/test:
    post:
      operationId: testEmrConnection
      summary: Try a record connection's saved settings.
      description: |
        Platform admins only; no step-up (it changes nothing in the
        hospital's system, and credentials only go to the address they
        were entered for). The emr service tries the saved settings; the
        outcome is `last_test` (`code` null when it passed). A credential
        not set for the current address is `sign_in_refused` with nothing
        sent. A change saved meanwhile is 409 `conflict`, nothing recorded.
        No answer from the emr service is 503 `unavailable`. The body is
        empty or `{}` (under 1 KiB); anything else is 422
        `validation_failed`.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, hospital_removed, validation_failed, no_type, not_ready, unavailable, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The connection with its new `last_test`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmrConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /platform/hospitals/{id}/emr/connections:
    post:
      operationId: addEmrConnection
      summary: Add a record connection to a hospital (step-up).
      description: |
        Platform admins only, with a fresh code. Saved switched off and
        untested. `type` must be offered (422 `no_type`); `source_label`
        1 to 40 characters naming no product; `base_url` https (sftp for a
        file export), at most 500 characters, a DNS name, with no userinfo,
        query or fragment; every address setting gets the same checks, and
        a record link must be on the base address's host. `settings` are
        the type's text fields; `credentials` its secret fields, each 1 to
        4,000 characters, every required one present. Credentials are
        sealed to the emr service as they arrive and stored there only;
        if the emr service doesn't confirm them, the connection is still
        created (off) and answered with `credentials_missing` true and
        `set_at` null: re-send them with PATCH on that connection. A retry
        with the same `Idempotency-Key` answers the same connection; a
        label the hospital already has (in any case) is 409 `conflict`, so
        a retry without the key never adds a second connection. An unknown
        hospital is 404; one removed or being removed is 409
        `hospital_removed`. The request body is never
        logged or stored; the idempotency store keeps a keyed hash of it.
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, not_found, conflict, hospital_removed, validation_failed, no_type, not_ready, unavailable, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmrConnectionIn" }
      responses:
        "200":
          description: The connection as saved (off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmrConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-MHAI-Service
      description: The BFF's service key (BFF_SERVICE_KEYS). Never sent by a browser.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token: EdDSA (Ed25519), 15 minutes, iss `mhai-gateway`,
        aud `mhai-bff`, claims sub, hid, roles, mfa, amr, sid, jti, iat, exp.

  parameters:
    ClientIP:
      name: X-MHAI-Client-IP
      in: header
      required: false
      description: The end user's IP address, as the BFF saw it. Sign-in and password change need it.
      schema: { type: string }
    Audience:
      name: X-MHAI-Audience
      in: header
      required: false
      schema: { type: string, enum: [clinical, platform], default: clinical }
    CorrectionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalysisPeriod:
      name: period
      in: query
      description: The period's level (with `start`).
      schema: { type: string, enum: [week, month, quarter] }
    AnalysisStart:
      name: start
      in: query
      description: "The period's first day, a hospital day: a week is days 1-7, 8-14, 15-21 or 22 to the month's end."
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    Problem:
      description: An error. The `code` is one of the operation's `x-error-codes`.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Problem"
              - $ref: "#/components/schemas/PlatformProblem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, example: "urn:mhai:problem:unauthenticated" }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - unauthenticated
            - token_expired
            - mfa_required
            - mfa_invalid
            - mfa_locked
            - forbidden
            - not_platform
            - not_found
            - conflict
            - validation_failed
            - weak_password
            - rate_limited
            - login_locked
            - not_ready
            - unavailable
            - internal_error
            - method_not_allowed
            - payload_too_large
            - self_approval
            - already_decided
            - not_tested
            - hospital_removed
            - no_type
            - too_many_filters
            - invalid_range
            - already_handled
            - no_recipients
        detail: { type: string, description: Fixed per code; never echoes input. }
        request_id: { type: string }
    PlatformProblem:
      description: The error body on the platform audience.
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Ready:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready] }
    Empty:
      type: object
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 320, description: The work email; case and surrounding spaces are ignored. }
        password: { type: string, maxLength: 1024 }
        device_token: { type: string, maxLength: 256 }
    Tokens:
      type: object
      required: [access_token, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string, description: For the BFF only; never sent to the browser. }
        user: { $ref: "#/components/schemas/User" }
        device_token: { type: string, description: Only from the challenge, when trust_device was set and allowed. }
    MFARequired:
      type: object
      required: [mfa_required, mfa_token, mfa_enrolled]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_token: { type: string }
        mfa_enrolled:
          type: boolean
          description: |
            Whether the account already has two-step set up. False: send the
            challenge with an empty code to get the enrolment-only session.
            True: ask the user for a code. Sent only after the password was
            proven, and only in this reply.
    User:
      type: object
      required: [id, role, roles, email, display_name, full_name, role_title, specialty, hospital, mfa_enabled,
        must_change_password, terms_accepted_at, recovery_codes_left, idle_timeout_minutes, review_overdue_hours, features]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, description: The primary role. }
        roles:
          type: array
          items: { type: string, enum: [clinician, hospital_admin, analyst, platform_admin, auditor] }
        email: { type: string }
        display_name: { type: string }
        full_name: { type: string, nullable: true }
        role_title: { type: string, nullable: true }
        specialty: { type: string, nullable: true }
        hospital:
          nullable: true
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        mfa_enabled: { type: boolean }
        must_change_password: { type: boolean }
        terms_accepted_at: { type: string, format: date-time, nullable: true }
        recovery_codes_left: { type: integer }
        idle_timeout_minutes: { type: integer }
        review_overdue_hours: { type: integer }
        features:
          type: object
          description: >-
            What the user may open (Patient Analysis). analysis is true only when the
            hospital's analysis switch is on, the user is a hospital admin or an analyst,
            and two-step is on; it is off by default. named_access is false until named
            access exists. The BFF's own sign-off settings can only turn these off.
          required: [analysis, named_access]
          properties:
            analysis: { type: boolean }
            named_access: { type: boolean }

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
    RefreshResponse:
      type: object
      required: [access_token, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }

    ChallengeRequest:
      type: object
      required: [mfa_token, code]
      additionalProperties: false
      properties:
        mfa_token: { type: string }
        code: { type: string, description: A six-digit TOTP code or a backup code. }
        trust_device: { type: boolean }
    EnrollResponse:
      type: object
      required: [otpauth_uri, recovery_codes]
      properties:
        otpauth_uri: { type: string }
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }
    StepUpRequest:
      type: object
      additionalProperties: false
      properties:
        mfa_code: { type: string }
        backup_code: { type: string }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }

    PasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, minLength: 12, maxLength: 1024 }
    TermsRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 64 }

    Session:
      type: object
      required: [id, created_at, last_seen_at, ua_summary, ip_prefix, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        ua_summary: { type: string, nullable: true }
        ip_prefix: { type: string, nullable: true, description: The client's /24 (IPv4) or /48 (IPv6). }
        current: { type: boolean }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }

    QueryCreateIn:
      type: object
      required: [patient_data, clinical_question, urgency]
      additionalProperties: false
      properties:
        patient_data:
          type: object
          required: [age, sex, symptoms]
          additionalProperties: false
          properties:
            age: { type: integer, minimum: 0, maximum: 130 }
            sex: { type: string, enum: [female, male, other, unknown] }
            symptoms:
              type: array
              maxItems: 50
              items: { type: string, minLength: 1, maxLength: 200 }
            medical_history: { type: string, maxLength: 4000 }
        clinical_question: { type: string, minLength: 1, maxLength: 4000 }
        urgency: { type: string, enum: [routine, urgent, emergency] }
        specialty:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z][A-Za-z -]{0,31}$"
        client_created_at:
          type: string
          format: date-time
          description: When the app queued the question (offline); checked, not stored.
    QueryCreated:
      type: object
      required: [query_id, status]
      properties:
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
    QueryStatus:
      type: object
      required: [query_id, status, progress, current_stage]
      properties:
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        current_stage:
          type: string
          nullable: true
          enum: [pii_masking, retrieval, generation, nli_verification, hga_verification, decision, null]
        error_code:
          type: string
          description: |
            Only when failed: an intelligence error code (spec §10.1), or
            `cancelled`.
    Citation:
      type: object
      required: [chunk_id, source_title, excerpt, claim_text, nli_label, nli_confidence, action, reason]
      properties:
        chunk_id: { type: string }
        source_title: { type: string }
        excerpt: { type: string }
        claim_text: { type: string }
        nli_label: { type: string, enum: [ENTAILMENT, NEUTRAL, CONTRADICTION] }
        nli_confidence: { type: number }
        action: { type: string, enum: [PASS, FLAG, REDACT] }
        reason: { type: string }
    ClinicalResult:
      type: object
      required: [query_id, decision, verified, degraded, failed_agents, response_available, diagnosis, icd10_code,
                 response_text, trust_score, trust_band, citations, cited_chunk_ids, guardrail_details, retrieval_ms, generation_ms]
      properties:
        query_id: { type: string, format: uuid }
        decision: { type: string, enum: [PASS, REGENERATE, ESCALATE] }
        verified: { type: boolean }
        degraded: { type: boolean }
        failed_agents:
          type: array
          items: { type: string, enum: [CCA, HGA] }
        response_available: { type: boolean }
        diagnosis: { type: string, nullable: true }
        icd10_code: { type: string, nullable: true }
        response_text: { type: string }
        trust_score: { type: number, nullable: true }
        trust_band:
          type: string
          nullable: true
          enum: [low, mid, high, null]
          description: Provisional banding of a verified answer's trust; null when unverified.
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        cited_chunk_ids:
          type: array
          items: { type: string }
        guardrail_details:
          type: object
          required: [l1_persona, l2_entropy, l3_nli, l4_trust, cascade_pass]
          properties:
            l1_persona: { type: object, nullable: true }
            l2_entropy:
              type: object
              nullable: true
              properties:
                stability: { type: number }
            l3_nli:
              type: object
              required: [pass_rate, claims_checked, model_loaded]
              properties:
                pass_rate: { type: number }
                claims_checked: { type: integer }
                model_loaded: { type: boolean }
            l4_trust:
              type: object
              nullable: true
              required: [trust_score, base_trust, flag_penalty]
              properties:
                trust_score: { type: number }
                base_trust: { type: number }
                flag_penalty: { type: number }
            cascade_pass: { type: boolean }
        retrieval_ms: { type: number }
        generation_ms: { type: number }
        generated_by:
          type: object
          description: >-
            Where the answer was drafted, from the decision's own model versions:
            `local`, or `cloud` with the provider. It names the route that produced
            this answer and doesn't change when the hospital's model policy changes
            later. Absent when unknown (an answer from an older pipeline, or a cloud
            failure that produced no draft). Added in 1.10.0.
          required: [route, provider, provider_code]
          properties:
            route: { type: string, enum: [local, cloud] }
            provider:
              type: string
              nullable: true
              enum: [anthropic, openai, xai, null]
              description: >-
                The cloud provider; null on a local answer. This enum can't grow in
                /api/v1 (ADR 0012), so it is also null on a cloud answer from a
                provider added later (`gemini`): read `provider_code`.
            provider_code:
              type: string
              nullable: true
              description: >-
                The cloud provider, as a code: `anthropic`, `gemini` (Google Gemini),
                `openai` or `xai`; null on a local answer. More codes may be added
                without a new API version: show an unknown code as it is. Added in
                1.16.0.

    FeedbackIn:
      type: object
      required: [query_id, action]
      additionalProperties: false
      properties:
        query_id: { type: string, format: uuid }
        action: { type: string, enum: [validate, correct] }
        corrected_diagnosis: { type: string, minLength: 1, maxLength: 200, description: "`correct` only. One line." }
        reason: { type: string, minLength: 3, maxLength: 1000, description: "`correct` only. May span lines (`\\n`, `\\r\\n`)." }
        client_created_at: { type: string, format: date-time, description: When the app queued it (offline). }
    FeedbackOut:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [recorded, pending_review] }
        correction_id: { type: string, format: uuid, description: For a correction only. }
    RejectIn:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string, enum: [not_supported, needs_rewording, unsafe, out_of_scope] }
        note: { type: string, maxLength: 500, description: "May span lines (`\\n`, `\\r\\n`); no other control character, no Unicode format character and no U+2028 or U+2029." }
    FeedbackStatsOut:
      type: object
      required: [agreed, corrections_waiting, corrections_approved, corrections_rejected, corrections_withdrawn]
      properties:
        agreed: { type: integer }
        corrections_waiting: { type: integer }
        corrections_approved: { type: integer }
        corrections_rejected: { type: integer }
        corrections_withdrawn: { type: integer }
    PersonOut:
      type: object
      description: A person as the API shows them; never an id.
      required: [display_name, full_name, specialty, hospital]
      properties:
        display_name: { type: string }
        full_name: { type: string, nullable: true }
        specialty: { type: string, nullable: true }
        hospital: { type: string, nullable: true }
    CorrectionOut:
      type: object
      required: [id, query_id, status, corrected_diagnosis, reason, submitted_by, submitted_at, original, consultation,
                 decided_by, decided_at, rejection]
      properties:
        id: { type: string, format: uuid }
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
        corrected_diagnosis: { type: string }
        reason: { type: string }
        submitted_by: { $ref: "#/components/schemas/PersonOut" }
        submitted_at: { type: string, format: date-time }
        original:
          type: object
          description: What the system said.
          required: [decision, degraded, diagnosis, icd10_code, response_text, citations]
          properties:
            decision: { type: string, enum: [PASS, REGENERATE, ESCALATE] }
            degraded: { type: boolean }
            diagnosis: { type: string, nullable: true }
            icd10_code: { type: string, nullable: true }
            response_text: { type: string }
            citations:
              type: array
              items:
                type: object
                required: [source_title, claim_text, action]
                properties:
                  source_title: { type: string }
                  claim_text: { type: string }
                  action: { type: string, enum: [PASS, FLAG, REDACT] }
        consultation:
          type: object
          description: The consultation as it was asked, patient details already masked.
          required: [age, sex, symptoms, clinical_question, urgency, specialty]
          properties:
            age: { type: number }
            sex: { type: string, enum: [female, male, other, unknown] }
            symptoms: { type: array, items: { type: string } }
            clinical_question: { type: string }
            urgency: { type: string, enum: [routine, urgent, emergency] }
            specialty: { type: string, nullable: true }
        decided_by:
          allOf: [{ $ref: "#/components/schemas/PersonOut" }]
          nullable: true
        decided_at: { type: string, format: date-time, nullable: true, description: Also set when withdrawn. }
        rejection:
          type: object
          nullable: true
          required: [reason_code, note]
          properties:
            reason_code: { type: string, enum: [not_supported, needs_rewording, unsafe, out_of_scope] }
            note: { type: string, nullable: true }

    AuditHospital:
      type: object
      required: [id, name, removed]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        removed: { type: boolean }
    AuditPerson:
      type: object
      required: [id, name, email, role, kind, hospital]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [clinician, hospital_admin, platform_admin, auditor] }
        kind: { type: string, enum: [staff, platform] }
        hospital:
          type: object
          nullable: true
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
    PersonRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    VerifyRun:
      type: object
      description: |
        A chain check (mhai-web's VerifyRun). `intact` carries every proof
        field (`entries_checked` above 0, `to_seq`, `to_at`, `finished_at`,
        `from_first`); `first_broken_seq`, `first_broken_id` (the entry's
        decimal id) and `first_broken_at` are set together, on `broken`
        only. `from_checkpoint` is null until signed checkpoints exist.
      required: [id, started_at, finished_at, by, state, entries_checked, from_checkpoint, from_first, to_seq, to_at,
                 first_broken_seq, first_broken_id, first_broken_at, error_code, outcome, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        by:
          description: Who started it; null for the daily schedule.
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
          nullable: true
        state: { type: string, enum: [running, intact, broken, error] }
        entries_checked: { type: integer, nullable: true }
        from_checkpoint: { type: object, nullable: true }
        from_first: { type: boolean }
        to_seq: { type: integer, nullable: true }
        to_at: { type: string, format: date-time, nullable: true }
        first_broken_seq: { type: integer, nullable: true }
        first_broken_id: { type: string, nullable: true }
        first_broken_at: { type: string, format: date-time, nullable: true }
        error_code: { type: string, enum: [timed_out, unreachable, unexpected_reply], nullable: true }
        outcome:
          type: object
          nullable: true
          required: [note, by, at]
          additionalProperties: false
          properties:
            note: { type: string, maxLength: 1000 }
            by: { $ref: "#/components/schemas/PersonRef" }
            at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    HealthStatus: { type: string, enum: [ok, slow, problem] }
    HealthTiming:
      type: object
      required: [p50_ms, p95_ms]
      additionalProperties: false
      properties:
        p50_ms: { type: integer, minimum: 0 }
        p95_ms: { type: integer, minimum: 0 }
    HealthTimingBlock:
      type: object
      required: [overall, steps]
      additionalProperties: false
      properties:
        overall: { $ref: "#/components/schemas/HealthTiming" }
        steps:
          type: array
          description: The steps with samples in the window, in this order.
          items:
            type: object
            required: [step, p50_ms, p95_ms]
            additionalProperties: false
            properties:
              step: { type: string, enum: [privacy, guidelines, answer, evidence] }
              p50_ms: { type: integer, minimum: 0 }
              p95_ms: { type: integer, minimum: 0 }
    JobIDs:
      type: array
      minItems: 1
      maxItems: 50
      items: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    Job:
      type: object
      description: One failed job (contract §14.8.3). Never the subject, the user or the error message.
      required: [id, type, hospital, created_at, failed_at, attempts, kind, status, cancelled_by, cancelled_at]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[qj]_[0-9a-f-]{36}$" }
        type: { type: string, enum: [run_query, submit_feedback, approve_correction, ingest_document, run_triage, kb_search, feedback_buffer_reset, retention_purge] }
        hospital: { allOf: [{ $ref: "#/components/schemas/PersonRef" }], nullable: true }
        created_at: { type: string, format: date-time }
        failed_at: { type: string, format: date-time }
        attempts: { type: integer, minimum: 0 }
        kind: { type: string, enum: [timeout, unreachable, unreadable, invalid, other] }
        status: { type: string, enum: [failed, retrying, retried, cancelled] }
        cancelled_by: { allOf: [{ $ref: "#/components/schemas/PersonRef" }], nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
    JobList:
      type: object
      required: [jobs, next_cursor]
      additionalProperties: false
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: string, nullable: true }
    EMRRuleSet:
      type: object
      required: [hospital_id, version, sha256, activated_at]
      additionalProperties: false
      properties:
        hospital_id: { type: string, format: uuid }
        version: { type: string, nullable: true, description: "The activated rule set version; null is shadow." }
        sha256: { type: string, nullable: true, description: "The activated rule set file's SHA-256, hex." }
        activated_at: { type: string, format: date-time, nullable: true }
    ModelPolicy:
      type: object
      description: >-
        A hospital's cloud model policy and this month's token usage. The
        hospital is off (local models) exactly when `provider_code` is null;
        read the provider from `provider_code`, never from `cloud_provider`
        alone, which is also null for a provider its enum can't name
        (`gemini`).
      required: [hospital_id, cloud_provider, provider_code, agreement_ref, monthly_token_budget, updated_at, usage]
      additionalProperties: false
      properties:
        hospital_id: { type: string, format: uuid }
        cloud_provider:
          type: string
          enum: [openai, anthropic, xai]
          nullable: true
          description: >-
            The policy's provider when this enum names it. Null does not mean
            off: it is null when off and also for a provider added later
            (`gemini`), since a response enum can't grow in /api/v1 (ADR
            0012). Read `provider_code`.
        provider_code:
          type: string
          nullable: true
          description: >-
            The policy's cloud provider, as a code: `anthropic`, `gemini` (Google
            Gemini), `openai` or `xai`; null exactly when the policy is off (the
            source of truth for on and off). More codes may be added
            without a new API version: show an unknown code as it is. Added in
            1.16.0.
        agreement_ref: { type: string, pattern: "^(DEMO-SYNTHETIC|(AGR|DPA)-[0-9]{4}-[0-9]{2,8})$", nullable: true }
        monthly_token_budget: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        updated_at: { type: string, format: date-time, nullable: true }
        usage:
          type: object
          required: [month, used, reserved]
          additionalProperties: false
          properties:
            month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: "The month, UTC, as YYYY-MM." }
            used: { type: integer, format: int64, minimum: 0 }
            reserved: { type: integer, format: int64, minimum: 0 }
    EmrPerson:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    EmrConnectorType:
      type: object
      description: A kind of connection, as data. Named by standard or method, never by product.
      required: [id, label, summary, fields]
      additionalProperties: false
      properties:
        id: { type: string, enum: [fhir_r4, document_archive, file_export, stub] }
        label: { type: string }
        summary: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [key, label, kind, required, max]
            additionalProperties: false
            properties:
              key: { type: string, pattern: "^[a-z_]+$" }
              label: { type: string }
              kind: { type: string, enum: [text, secret], description: "A secret is write-only: never sent back." }
              required: { type: boolean }
              max: { type: integer, minimum: 1 }
    EmrSyncCode:
      type: string
      enum: [unreachable, sign_in_refused, timed_out, unreadable_data, unmapped_codes, too_many_requests]
    EmrConnectionSummary:
      type: object
      required: [id, hospital, type, type_label, source_label, enabled, health, last_test, last_sync, errors_24h, paused, credentials_missing]
      properties:
        id: { type: string, format: uuid }
        hospital: { $ref: "#/components/schemas/EmrPerson" }
        type: { type: string }
        type_label: { type: string }
        source_label: { type: string, minLength: 1, maxLength: 40 }
        enabled: { type: boolean }
        health: { type: string, enum: [never, ok, errors] }
        last_test:
          type: object
          nullable: true
          required: [at, ok, code]
          additionalProperties: false
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
            code: { allOf: [{ $ref: "#/components/schemas/EmrSyncCode" }], nullable: true }
        last_sync:
          type: object
          nullable: true
          required: [at, ok, records]
          additionalProperties: false
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
            records: { type: integer, minimum: 0 }
        errors_24h: { type: integer, minimum: 0 }
        paused: { type: boolean, description: "Additive: a source the breaker paused." }
        credentials_missing: { type: boolean, description: "Additive: a required credential isn't set for the current address; re-send it with PATCH on this connection." }
    EmrConnection:
      allOf:
        - $ref: "#/components/schemas/EmrConnectionSummary"
        - type: object
          required: [base_url, settings, credentials, errors, updated_by, updated_at, version, poll_seconds, private_network, private_cidrs]
          properties:
            base_url: { type: string, maxLength: 500 }
            settings: { type: object, additionalProperties: { type: string }, description: "The type's text fields only. Secrets are never here." }
            credentials:
              type: array
              description: One per secret field; `set_at` null when not set for the current address. Never a value.
              items:
                type: object
                required: [key, set_at]
                additionalProperties: false
                properties:
                  key: { type: string }
                  set_at: { type: string, format: date-time, nullable: true }
            errors:
              type: array
              maxItems: 5
              description: The last 24 hours, by code, newest first.
              items:
                type: object
                required: [at, code, count]
                additionalProperties: false
                properties:
                  at: { type: string, format: date-time }
                  code: { $ref: "#/components/schemas/EmrSyncCode" }
                  count: { type: integer, minimum: 1 }
            updated_by: { allOf: [{ $ref: "#/components/schemas/EmrPerson" }], nullable: true }
            updated_at: { type: string, format: date-time, nullable: true }
            version: { type: integer, minimum: 1 }
            poll_seconds: { type: integer, minimum: 60, maximum: 86400, description: Additive. }
            private_network: { type: boolean, description: Additive. }
            private_cidrs: { type: array, items: { type: string }, description: "Additive: the declared private ranges." }
    EmrConnectionIn:
      type: object
      required: [type, source_label, base_url, settings, credentials]
      additionalProperties: false
      properties:
        type: { type: string }
        source_label: { type: string, minLength: 1, maxLength: 40 }
        base_url: { type: string, maxLength: 500 }
        settings: { type: object, additionalProperties: { type: string } }
        credentials: { type: object, additionalProperties: { type: string, minLength: 1, maxLength: 4000 }, description: "The type's secret fields. Write-only." }
        poll_seconds: { type: integer, minimum: 60, maximum: 86400 }
        private_network: { type: boolean }
        private_cidrs: { type: array, maxItems: 8, items: { type: string }, description: "Private IPv4 networks of at most a /24; needs private_network." }
        mfa_code: { type: string }
        backup_code: { type: string }
    EmrConnectionPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        source_label: { type: string, minLength: 1, maxLength: 40 }
        base_url: { type: string, maxLength: 500 }
        settings: { type: object, additionalProperties: { type: string } }
        credentials: { type: object, additionalProperties: { type: string, minLength: 1, maxLength: 4000 }, description: "Only the ones being replaced. Write-only." }
        poll_seconds: { type: integer, minimum: 60, maximum: 86400 }
        private_network: { type: boolean }
        private_cidrs: { type: array, maxItems: 8, items: { type: string } }
        version: { type: integer, minimum: 1 }
        mfa_code: { type: string }
        backup_code: { type: string }
    AnalysisFilters:
      type: object
      required: [updated_at, periods, conditions, locations, specialties, sources]
      properties:
        updated_at: { type: string, format: date-time, nullable: true, description: "When the lists were stored; null when no month is frozen yet." }
        periods:
          type: object
          description: The answerable frozen periods' first days, per level, oldest first.
          required: [week, month, quarter]
          properties:
            week: { type: array, items: { type: string, format: date } }
            month: { type: array, items: { type: string, format: date } }
            quarter: { type: array, items: { type: string, format: date } }
        conditions: { type: array, items: { $ref: "#/components/schemas/AnalysisConditionRef" } }
        locations:
          type: array
          items:
            type: object
            required: [id, label, setting]
            properties:
              id: { type: string }
              label: { type: string }
              setting: { type: string, nullable: true, enum: [admitted, outpatient, emergency, null] }
        specialties: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
    AnalysisConditionRef:
      type: object
      required: [id, name, icd10]
      properties:
        id: { type: string }
        name: { type: string, nullable: true, description: 'null reads "Not standardised".' }
        icd10: { type: string, nullable: true }
    AnalysisDrillable:
      type: object
      description: A GuardedCount with its drill key; drill is null until the drill-down route exists, and on any count hidden or under 5.
      required: [value, suppressed, drill]
      properties:
        value: { type: integer, minimum: 0, nullable: true }
        suppressed: { type: boolean }
        drill: { type: string, nullable: true }
    AnalysisMinutes:
      type: object
      description: "A median in minutes (a whole number or a half); hidden is `{value: null, suppressed: true}`."
      required: [value, suppressed]
      properties:
        value: { type: number, nullable: true }
        suppressed: { type: boolean }
    AnalysisHistoryPoint:
      type: object
      required: [start, cases, new, patients]
      properties:
        start: { type: string, format: date }
        cases: { $ref: "#/components/schemas/GuardedCount" }
        new: { $ref: "#/components/schemas/GuardedCount" }
        patients: { $ref: "#/components/schemas/GuardedCount" }
    AnalysisView:
      type: object
      description: >
        Meta (updated_at, from, to, bucket, patients, period) and history, then the view's own fields
        (frontend requirements §10): prevalence {total, by_condition, series}; affected {by_age,
        by_sex, by_setting, by_location, by_specialty}; co-occurring {pairs}; findings {findings,
        alerts}; quality {by_condition}. A view hidden whole has every number hidden and every list
        empty.
      required: [updated_at, from, to, bucket, patients, period, history]
      properties:
        updated_at: { type: string, format: date-time }
        from: { type: string, format: date }
        to: { type: string, format: date }
        bucket: { type: string, enum: [week, month] }
        patients: { $ref: "#/components/schemas/GuardedCount" }
        period:
          type: object
          required: [level, start]
          properties:
            level: { type: string, enum: [week, month, quarter] }
            start: { type: string, format: date }
        history: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/AnalysisHistoryPoint" } }
      additionalProperties: true
    GuardedCount:
      type: object
      description: "A count under the small-group rule. Never 1 to 4; hidden is `{value: null, suppressed: true}`."
      required: [value, suppressed]
      additionalProperties: false
      properties:
        value: { type: integer, minimum: 0, nullable: true }
        suppressed: { type: boolean }
    GuardedShare:
      type: object
      description: "A share (0 to 1, four decimal places) under the small-group rule; `{value: null, suppressed: false}` is nothing to divide by."
      required: [value, suppressed]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0, maximum: 1, nullable: true }
        suppressed: { type: boolean }
    GuardrailRates:
      type: object
      required: [answers, pass, regenerate, escalate, degraded, pass_share, regenerate_share, escalate_share]
      properties:
        answers: { $ref: "#/components/schemas/GuardedCount" }
        pass: { $ref: "#/components/schemas/GuardedCount" }
        regenerate: { $ref: "#/components/schemas/GuardedCount" }
        escalate: { $ref: "#/components/schemas/GuardedCount" }
        degraded: { $ref: "#/components/schemas/GuardedCount" }
        pass_share: { $ref: "#/components/schemas/GuardedShare" }
        regenerate_share: { $ref: "#/components/schemas/GuardedShare" }
        escalate_share: { $ref: "#/components/schemas/GuardedShare" }
    GuardrailPeriodsOut:
      type: object
      description: Plan 7c spec §9 (New), the calendar periods.
      required: [period, from, to, updated_at, all, hospitals]
      additionalProperties: false
      properties:
        period: { type: string, enum: [week, month, quarter] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        all: { $ref: "#/components/schemas/GuardrailRates" }
        hospitals:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/GuardrailRates"
              - type: object
                required: [hospital]
                properties:
                  hospital: { $ref: "#/components/schemas/PersonRef" }
    GuardedNumber:
      type: object
      description: "A ratio, median or review time under the small-group rule: hidden is `{value: null, suppressed: true}`, nothing to show `{value: null, suppressed: false}`."
      required: [value, suppressed]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0, nullable: true }
        suppressed: { type: boolean }
    AnalyticsUnavailable:
      type: object
      required: [unavailable]
      additionalProperties: false
      properties:
        unavailable: { type: boolean, enum: [true] }
    AnalyticsNotYet:
      type: object
      description: Before the first published period of the kind (F19).
      required: [not_yet, first_from]
      additionalProperties: false
      properties:
        not_yet: { type: boolean, enum: [true] }
        first_from: { type: string, format: date-time }
    AnalyticsCountPoint:
      type: object
      required: [start, value]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        value: { $ref: "#/components/schemas/GuardedCount" }
    AnalyticsSharePoint:
      type: object
      required: [start, value]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        value: { $ref: "#/components/schemas/GuardedShare" }
    AnalyticsConfidence:
      type: object
      required: [high, medium, low]
      additionalProperties: false
      properties:
        high: { $ref: "#/components/schemas/GuardedCount" }
        medium: { $ref: "#/components/schemas/GuardedCount" }
        low: { $ref: "#/components/schemas/GuardedCount" }
    AnalyticsConfidenceMedian:
      type: object
      required: [high, medium, low]
      additionalProperties: false
      properties:
        high: { $ref: "#/components/schemas/GuardedNumber" }
        medium: { $ref: "#/components/schemas/GuardedNumber" }
        low: { $ref: "#/components/schemas/GuardedNumber" }
    AnalyticsUse:
      type: object
      required: [updated_at, rows, median, trend]
      additionalProperties: false
      properties:
        updated_at: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [hospital, questions, active_clinicians, questions_per_clinician]
            additionalProperties: false
            properties:
              hospital: { $ref: "#/components/schemas/PersonRef" }
              questions: { $ref: "#/components/schemas/GuardedCount" }
              active_clinicians: { $ref: "#/components/schemas/GuardedCount" }
              questions_per_clinician: { $ref: "#/components/schemas/GuardedNumber" }
        median:
          type: object
          required: [questions, active_clinicians, questions_per_clinician]
          additionalProperties: false
          properties:
            questions: { $ref: "#/components/schemas/GuardedNumber" }
            active_clinicians: { $ref: "#/components/schemas/GuardedNumber" }
            questions_per_clinician: { $ref: "#/components/schemas/GuardedNumber" }
        trend: { type: array, items: { $ref: "#/components/schemas/AnalyticsCountPoint" } }
    AnalyticsQuality:
      type: object
      required: [updated_at, rows, median, trend]
      additionalProperties: false
      properties:
        updated_at: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [hospital, answers, needs_review_share, confidence, reviews, agreement_rate, median_review_hours]
            additionalProperties: false
            properties:
              hospital: { $ref: "#/components/schemas/PersonRef" }
              answers: { $ref: "#/components/schemas/GuardedCount" }
              needs_review_share: { $ref: "#/components/schemas/GuardedShare" }
              confidence: { $ref: "#/components/schemas/AnalyticsConfidence" }
              reviews: { $ref: "#/components/schemas/GuardedCount" }
              agreement_rate: { $ref: "#/components/schemas/GuardedShare" }
              median_review_hours: { $ref: "#/components/schemas/GuardedNumber" }
        median:
          type: object
          required: [answers, needs_review_share, confidence, reviews, agreement_rate, median_review_hours]
          additionalProperties: false
          properties:
            answers: { $ref: "#/components/schemas/GuardedNumber" }
            needs_review_share: { $ref: "#/components/schemas/GuardedShare" }
            confidence: { $ref: "#/components/schemas/AnalyticsConfidenceMedian" }
            reviews: { $ref: "#/components/schemas/GuardedNumber" }
            agreement_rate: { $ref: "#/components/schemas/GuardedShare" }
            median_review_hours: { $ref: "#/components/schemas/GuardedNumber" }
        trend: { type: array, items: { $ref: "#/components/schemas/AnalyticsSharePoint" } }
    AnalyticsHospitals:
      type: object
      required: [updated_at, rows]
      additionalProperties: false
      properties:
        updated_at: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [hospital, size]
            additionalProperties: false
            properties:
              hospital: { $ref: "#/components/schemas/PersonRef" }
              size:
                type: object
                description: "`staff` is under the small-group rule until the privacy lead decides (spec §16, Q4)."
                required: [staff, active_clinicians, questions]
                additionalProperties: false
                properties:
                  staff: { $ref: "#/components/schemas/GuardedCount" }
                  active_clinicians: { $ref: "#/components/schemas/GuardedCount" }
                  questions: { $ref: "#/components/schemas/GuardedCount" }
    AnalyticsOut:
      type: object
      description: Plan 7c spec §7.1 (New).
      required: [period, from, to, changes, use, alerts, quality, hospitals, what_changed]
      additionalProperties: false
      properties:
        period: { type: string, enum: [week, month, quarter] }
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        changes: { $ref: "#/components/schemas/AnalyticsUnavailable" }
        use:
          oneOf:
            - $ref: "#/components/schemas/AnalyticsUse"
            - $ref: "#/components/schemas/AnalyticsUnavailable"
            - $ref: "#/components/schemas/AnalyticsNotYet"
        alerts: { type: object, nullable: true, additionalProperties: false, description: Always null until patient alerts exist (spec §3, F4). }
        quality:
          oneOf:
            - $ref: "#/components/schemas/AnalyticsQuality"
            - $ref: "#/components/schemas/AnalyticsUnavailable"
            - $ref: "#/components/schemas/AnalyticsNotYet"
        hospitals:
          oneOf:
            - $ref: "#/components/schemas/AnalyticsHospitals"
            - $ref: "#/components/schemas/AnalyticsUnavailable"
            - $ref: "#/components/schemas/AnalyticsNotYet"
        what_changed:
          description: "What changed (Plan 7c-3, spec §7.3), or `{unavailable: true}` before the first weekly evaluation."
          oneOf:
            - $ref: "#/components/schemas/AnalyticsChanges"
            - $ref: "#/components/schemas/AnalyticsUnavailable"
    AnalyticsSeriesOut:
      type: object
      description: Plan 7c spec §7.2 (New).
      required: [measure, hospital, points]
      additionalProperties: false
      properties:
        measure: { type: string, enum: [questions_per_clinician, needs_review_share] }
        hospital:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          nullable: true
        points:
          type: array
          items:
            type: object
            required: [start, value, median]
            additionalProperties: false
            properties:
              start: { type: string, format: date-time }
              value:
                description: "`GuardedNumber` for `questions_per_clinician` (two decimals), `GuardedShare` for `needs_review_share` (four)."
                oneOf:
                  - $ref: "#/components/schemas/GuardedNumber"
                  - $ref: "#/components/schemas/GuardedShare"
              median: { type: number, nullable: true }
    AnalyticsShownValue:
      type: object
      description: A shown value (`suppressed` false); a change is never flagged on a hidden one.
      required: [value, suppressed]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0 }
        suppressed: { type: boolean, enum: [false] }
    AnalyticsFollowUp:
      type: object
      description: Plan 7c spec §7.4 (New).
      required: [by, at, note, by_you, version]
      additionalProperties: false
      properties:
        by: { $ref: "#/components/schemas/PersonRef" }
        at: { type: string, format: date-time }
        note: { type: string, nullable: true }
        by_you: { type: boolean }
        version: { type: integer, minimum: 1 }
    AnalyticsChange:
      type: object
      description: Plan 7c spec §7.3 (New).
      required: [id, hospital, area, measure, direction, serious, previous, current, summary, follow_up, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        hospital:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          nullable: true
        area: { type: string, enum: [use, quality] }
        measure: { type: string, enum: [questions, needs_review_share, agreement_rate] }
        direction: { type: string, enum: [rising, falling, worse, better] }
        serious: { type: boolean, enum: [false] }
        previous: { $ref: "#/components/schemas/AnalyticsShownValue" }
        current: { $ref: "#/components/schemas/AnalyticsShownValue" }
        summary: { type: string, maxLength: 200 }
        follow_up:
          allOf:
            - $ref: "#/components/schemas/AnalyticsFollowUp"
          nullable: true
        version: { type: integer, minimum: 1 }
    AnalyticsChanges:
      type: object
      description: Plan 7c spec §7.3 (New).
      required: [updated_at, window, items]
      additionalProperties: false
      properties:
        updated_at: { type: string, format: date-time }
        window:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsChange" }
    AnalyticsChangeSeriesOut:
      type: object
      description: Plan 7c spec §7.2, a change's series (New). `change_id` is the change's id (the hospital series has none, so a reply matches one schema only). `hospital` and every `median` are null for a change across all hospitals.
      required: [change_id, measure, hospital, points]
      additionalProperties: false
      properties:
        change_id: { type: string, format: uuid }
        measure: { type: string, enum: [questions, needs_review_share, agreement_rate] }
        hospital:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          nullable: true
        points:
          type: array
          items:
            type: object
            required: [start, value, median]
            additionalProperties: false
            properties:
              start: { type: string, format: date-time }
              value:
                description: "`GuardedCount` for `questions`, `GuardedShare` for the shares (four decimals)."
                oneOf:
                  - $ref: "#/components/schemas/GuardedCount"
                  - $ref: "#/components/schemas/GuardedShare"
              median: { type: number, nullable: true }
    GuardrailsOut:
      type: object
      description: Plan 4 spec §6.3 (New).
      required: [period, from, to, updated_at, all, hospitals]
      additionalProperties: false
      properties:
        period: { type: string, enum: [7d, 30d, 90d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        all: { $ref: "#/components/schemas/GuardrailRates" }
        hospitals:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/GuardrailRates"
              - type: object
                required: [hospital]
                properties:
                  hospital: { $ref: "#/components/schemas/PersonRef" }
    HealthOut:
      type: object
      description: Contract §14.8.2's reading, without the parts and block that don't exist yet (Plan 4 decision 7).
      required: [updated_at, overall, parts, queue, failed_jobs, timing, errors, versions, triage]
      additionalProperties: false
      properties:
        updated_at: { type: string, format: date-time }
        overall: { $ref: "#/components/schemas/HealthStatus" }
        parts:
          type: array
          items:
            type: object
            required: [key, status, since]
            additionalProperties: false
            properties:
              key: { type: string, enum: [app, workers, evidence, guidelines] }
              status: { $ref: "#/components/schemas/HealthStatus" }
              since: { type: string, format: date-time }
        queue:
          type: object
          required: [waiting, oldest_wait_s]
          additionalProperties: false
          properties:
            waiting: { type: integer, minimum: 0 }
            oldest_wait_s: { type: integer, minimum: 0, nullable: true }
        failed_jobs:
          type: object
          required: [now, last_24h]
          additionalProperties: false
          properties:
            now: { type: integer, minimum: 0 }
            last_24h: { type: integer, minimum: 0 }
        timing:
          type: object
          required: [last_hour, last_24h]
          additionalProperties: false
          properties:
            last_hour: { $ref: "#/components/schemas/HealthTimingBlock" }
            last_24h: { $ref: "#/components/schemas/HealthTimingBlock" }
        errors:
          type: array
          description: One entry per kind, in this order.
          items:
            type: object
            required: [kind, last_hour, last_24h]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [timeout, unreachable, unreadable, invalid, other] }
              last_hour: { type: integer, minimum: 0 }
              last_24h: { type: integer, minimum: 0 }
        versions:
          type: array
          items:
            type: object
            required: [part, label]
            additionalProperties: false
            properties:
              part: { type: string, enum: [app, workers, evidence, guidelines] }
              label: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:+-]{0,63}$" }
        triage:
          type: object
          required: [enabled]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
    IntegrityStatus:
      type: object
      required: [latest, running, open_failure, security_contact, oldest_kept_at]
      additionalProperties: false
      properties:
        latest: { allOf: [{ $ref: "#/components/schemas/VerifyRun" }], nullable: true }
        running: { allOf: [{ $ref: "#/components/schemas/VerifyRun" }], nullable: true }
        open_failure: { allOf: [{ $ref: "#/components/schemas/VerifyRun" }], nullable: true }
        security_contact:
          type: object
          required: [name, email]
          additionalProperties: false
          properties:
            name: { type: string }
            email: { type: string }
        oldest_kept_at: { type: string, format: date-time }
    AuditBareEntry:
      type: object
      description: An entry the catalogue doesn't map; the app shows it as undisplayable.
      required: [id, seq, hash, at, type, kind]
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        hash: { type: string }
        at: { type: string, format: date-time }
        type: { type: string, enum: [security] }
        kind: { type: string, enum: [unknown] }
    AuditEvent:
      type: object
      description: Contract §14.9's event. `ip`, `device`, `reason` and `note` are null for now.
      required: [id, seq, hash, at, actor, hospital, type, kind, target, outcome, ip, device, flag, reason, note, refs, facts, after_break]
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, name, role, kind]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            role: { type: string, enum: [clinician, reviewer, hospital_admin, platform_admin, auditor, system] }
            kind: { type: string, enum: [staff, platform, system] }
        hospital:
          allOf: [{ $ref: "#/components/schemas/AuditHospital" }]
          nullable: true
        type: { type: string }
        kind: { type: string }
        target:
          type: object
          nullable: true
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        outcome: { type: string, enum: [succeeded, refused, failed] }
        ip: { type: string, nullable: true }
        device: { type: string, nullable: true }
        flag: { type: string, nullable: true, enum: [security, policy] }
        reason: { type: string, nullable: true }
        note: { type: string, nullable: true }
        refs:
          type: object
          required: [clearance_id, export_id, request_id]
          additionalProperties: false
          properties:
            clearance_id: { type: string, nullable: true }
            export_id: { type: string, nullable: true }
            request_id: { type: string, nullable: true }
        facts: { type: object, description: "Typed facts; keys from the contract's list only." }
        after_break: { type: boolean }
    AuditEntry:
      oneOf:
        - $ref: "#/components/schemas/AuditEvent"
        - $ref: "#/components/schemas/AuditBareEntry"
    AuditList:
      type: object
      required: [events, next_cursor, total, total_capped, oldest_kept_at, last_checkpoint]
      additionalProperties: false
      properties:
        events: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, minimum: 0, maximum: 10000 }
        total_capped: { type: boolean }
        oldest_kept_at: { type: string, format: date-time }
        last_checkpoint: { type: object, nullable: true, description: Always null until retention checkpoints exist. }
    AuditDetail:
      description: The entry (event or bare) plus `patients` and `letter`, both null for now.
      allOf:
        - $ref: "#/components/schemas/AuditEntry"
        - type: object
          required: [patients, letter]
          properties:
            patients: { type: object, nullable: true }
            letter: { type: object, nullable: true }
    AlertSettingsOut:
      type: object
      required: [connection, units, categories, recipients, updated_by, updated_at, version]
      properties:
        connection:
          type: object
          required: [status, sources]
          properties:
            status: { type: string, enum: [connected, problems, off, not_connected] }
            sources:
              type: array
              items:
                type: object
                required: [label, status, last_update_at]
                properties:
                  label: { type: string }
                  status: { type: string, enum: [connected, problems, off] }
                  last_update_at: { type: string, format: date-time, nullable: true }
        units:
          type: array
          items:
            type: object
            required: [id, label, kind, source_label, covered]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              kind: { type: string, enum: [ward, clinic, emergency, other] }
              source_label: { type: string, nullable: true }
              covered: { type: boolean }
        categories:
          type: array
          items:
            type: object
            required: [id, label, example, level]
            properties:
              id: { type: string, enum: [blood_chemistry, blood_count, kidney_function, blood_gases_lactate, heart_markers, blood_sugar, vital_signs, infection_markers] }
              label: { type: string }
              example: { type: string, nullable: true }
              level: { type: string, enum: [off, critical, critical_urgent, all] }
        recipients:
          type: object
          required: [queue, clinicians]
          properties:
            queue: { type: boolean }
            clinicians:
              type: array
              items:
                type: object
                required: [id, display_name, specialty]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  specialty: { type: string, nullable: true }
        updated_by:
          type: object
          nullable: true
          required: [display_name]
          properties:
            display_name: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 0 }
    AlertSettingsPatchIn:
      description: The version read, and exactly one section.
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0 }
        units:
          type: object
          required: [covered]
          additionalProperties: false
          properties:
            covered: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
        rules:
          type: object
          required: [levels]
          additionalProperties: false
          properties:
            levels:
              type: object
              minProperties: 1
              additionalProperties: { type: string, enum: [off, critical, critical_urgent, all] }
        recipients:
          type: object
          required: [queue, clinician_ids]
          additionalProperties: false
          properties:
            queue: { type: boolean }
            clinician_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    PatientCard:
      type: object
      required: [id, full_name, mrn, age, sex, sources, records]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        mrn: { type: string, nullable: true }
        age: { type: integer, nullable: true }
        sex: { type: string, enum: [female, male, other, unknown] }
        sources: { type: array, items: { type: string } }
        records: { type: integer, minimum: 0 }
    PatientMatchesOut:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, reason, a, b, proposed_at]
            properties:
              id: { type: string, format: uuid }
              reason: { type: string, enum: [mrn_birth_sex, mrn_only, source_merge, document_link] }
              a: { $ref: "#/components/schemas/PatientCard" }
              b: { $ref: "#/components/schemas/PatientCard" }
              proposed_at: { type: string, format: date-time }
    AlertEvidence:
      type: object
      required: [label, value, recorded_at]
      properties:
        label: { type: string }
        value: { type: string, nullable: true }
        recorded_at: { type: string, format: date-time, nullable: true }
    AlertOut:
      type: object
      required: [id, severity, status, finding, likely_causes, patient, age, sex, source_label, emr_link, handled_by,
                 handled_at, dismiss_reason, created_at, category, routing, arrived_late, preliminary, amended, withdrawn]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [critical, urgent, info] }
        status: { type: string, enum: [new, handled, dismissed], description: "`handled` means acknowledged." }
        finding:
          type: object
          required: [name, value, unit, flag, reference_range, recorded_at, code_system, standardised]
          properties:
            name: { type: string }
            value: { type: string, nullable: true }
            unit: { type: string, nullable: true }
            flag: { type: string, enum: [low, high, abnormal], nullable: true }
            reference_range: { type: string, nullable: true }
            recorded_at: { type: string, format: date-time, nullable: true }
            code_system: { type: string, enum: [loinc, local] }
            standardised: { type: boolean }
        likely_causes:
          type: array
          maxItems: 3
          items:
            type: object
            required: [label, confidence, evidence]
            properties:
              label: { type: string }
              confidence: { type: string, enum: [caution, review], description: "`high` is never sent in v1." }
              evidence: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/AlertEvidence" } }
        patient:
          type: object
          required: [full_name, mrn, location]
          properties:
            full_name: { type: string }
            mrn: { type: string, nullable: true, description: Null for a patient with no MRN. }
            location:
              type: object
              nullable: true
              required: [kind]
              properties:
                kind: { type: string, enum: [admitted, outpatient, emergency] }
                ward: { type: string }
                bed: { type: string, nullable: true }
                clinic: { type: string, nullable: true }
        age: { type: integer, nullable: true }
        sex: { type: string, enum: [female, male, other, unknown], nullable: true }
        source_label: { type: string, nullable: true }
        emr_link: { type: string, nullable: true }
        handled_by:
          type: object
          nullable: true
          required: [display_name]
          properties:
            display_name: { type: string }
        handled_at: { type: string, format: date-time, nullable: true }
        dismiss_reason: { type: string, enum: [not_relevant, already_known, wrong_patient, other], nullable: true }
        created_at: { type: string, format: date-time }
        category:
          type: object
          nullable: true
          required: [id, label]
          properties:
            id: { type: string }
            label: { type: string }
        routing:
          type: object
          required: [to_you, queue]
          properties:
            to_you: { type: boolean }
            queue: { type: boolean }
        arrived_late: { type: boolean }
        preliminary: { type: boolean }
        amended:
          type: object
          nullable: true
          required: [previous_value, amended_at]
          properties:
            previous_value: { type: string, nullable: true }
            amended_at: { type: string, format: date-time, nullable: true }
        withdrawn: { type: string, enum: [source_amended, source_retracted, excluded], nullable: true }
    AlertPageOut:
      type: object
      required: [alerts, next_cursor, sources, queue, sources_status, grouped]
      properties:
        alerts: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AlertOut" } }
        next_cursor: { type: string, nullable: true }
        sources: { type: array, items: { type: string } }
        queue: { type: boolean }
        sources_status:
          type: array
          items:
            type: object
            required: [label, status, last_update_at]
            properties:
              label: { type: string }
              status: { type: string, enum: [current, behind] }
              last_update_at: { type: string, format: date-time, nullable: true }
        grouped:
          type: object
          nullable: true
          description: Always null until grouped mode exists (EMR PR 8b).
          properties:
            since: { type: string, format: date-time }
            count: { type: integer }
    AlertHandledProblem:
      description: The 409 already_handled body. `status` is the alert's, not the HTTP status.
      type: object
      required: [type, title, status, code, detail, request_id, handled_by, handled_at]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: string, enum: [handled, dismissed] }
        code: { type: string, enum: [already_handled] }
        detail: { type: string }
        request_id: { type: string }
        handled_by:
          type: object
          nullable: true
          required: [display_name]
          properties:
            display_name: { type: string }
        handled_at: { type: string, format: date-time, nullable: true }
    NotificationSettingsOut:
      type: object
      required: [alert_popups, correction_popups]
      properties:
        alert_popups: { type: boolean }
        correction_popups: { type: boolean }
