  /platform/health:
    get:
      operationId: getPlatformHealth
      summary: System health, a sampled reading (polled in the background).
      description: |
        Platform admins and auditors, platform audience, two-step always.
        The reading one core copy takes every 30 s (pipeline.health and the
        database's aggregates) and stores in the `health` KV bucket; this
        route only reads it, so a poll runs no database statement and no
        worker call. `updated_at` is when the figures were taken. A reading
        that is missing, older than 2 minutes, or not of this shape is 503
        `unavailable`. No hospital, person, patient or content is in it.
        `parts` are `app`, `workers`, `evidence` and `guidelines`;
        `documents` and `clean_up` (and the `clean_up` block) are not sent
        until those services exist. `triage.enabled` is false until triage
        exists. `versions` is empty until the workers report model versions.
        Not recorded in the audit log. No query parameters (422).
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, unavailable, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The latest reading.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

