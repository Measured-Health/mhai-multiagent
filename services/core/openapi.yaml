  /corrections/{id}/approve:
    post:
      operationId: approveCorrection
      summary: Approve another clinician's waiting correction.
      description: |
        Guards in order: 404 `not_found` (unknown, another hospital's),
        403 `self_approval` (your own), 409 `already_decided` (no longer
        waiting), then the body (none, or `{}`; anything else is 422).
        409 `conflict` when the database no longer finds the caller an
        active clinician of the hospital. The decider is always the
        token's user. A refusal is audited. An approval queues the
        `approve_correction` job in the same transaction and publishes it
        after the commit; 204 even when the publish fails or the hospital
        has 20 such jobs in flight (the job then waits for the sweeper).
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &decideErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, self_approval, not_found, conflict, already_decided, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/CorrectionID"
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Approved. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

