  /platform/guardrails/periods:
    get:
      operationId: getPlatformGuardrailPeriods
      summary: Guardrail (HGA) statistics across hospitals for the latest finished calendar period, under the small-group rules.
      description: |
        Platform admins and auditors, platform audience, two-step always.
        New (Plan 7c spec §9, rulings R41a, R41a-2, R41a-4). `period` is
        `week`, `month` or `quarter` (UTC). A week is month-aligned: days
        1–7, 8–14, 15–21 and 22 to the month's end (7 to 10 days); weeks nest
        in months and months in quarters. The response is the latest
        published period of that kind: `from` and `to` bound it, and
        `updated_at` is when its one stored snapshot was computed (15
        minutes or more after it ended). Its figures never change, so every
        read of a period is identical. Only periods that start at or after
        the 7c-1 release are published; until the first one of a kind is,
        or if its snapshot couldn't be computed, the answer is 503
        `not_ready`. The cells are the same ones, shown and hidden, as the
        analytics Answer quality area of the same period.

        Per hospital and across all of them (`all`): the answers (questions
        with a decision, counted in the question's week), and of those
        `pass`, `regenerate` and `escalate` (a missing or unknown decision
        counts as `escalate`), the `degraded` ones, and the three shares of
        `answers`.

        Every value is guarded, `{value, suppressed}`, by the small-group
        rules: a count of 1 to 4 is `{value: null, suppressed: true}`, 0 is
        0; in each set that adds up (a row's answers and its three parts,
        each column's `all` and its hospitals, a month and its weeks, a
        quarter and its months) enough is hidden that the hidden members
        together are at least 5 and never exactly one is hidden; `degraded`
        is hidden when its `answers` is, or when `answers − degraded` is 1 to
        4; a share is hidden when its numerator or its complement is 1 to 4
        or either count is hidden; and more is hidden until no hidden value,
        nor a hidden total of 1 to 4, can be worked out from everything
        published so far. A share is 0 to 1 with four decimal places;
        `{value: null, suppressed: false}` is no answers to divide by.

        Six reads a minute per session, shared with `/platform/guardrails`,
        then 429 `rate_limited`. Not recorded in the audit log (aggregates
        about no person).
      tags: [platform]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - { name: period, in: query, required: true, schema: { type: string, enum: [week, month, quarter] } }
      responses:
        "200":
          description: The guarded statistics of the latest published period.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardrailPeriodsOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

