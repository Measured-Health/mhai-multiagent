      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, validation_failed, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
