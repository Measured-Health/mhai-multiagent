  /platform/audit:
    get:
      operationId: listAuditEvents
      summary: The audit log, newest first (the platform form of `GET /security/audit`).
      description: |
        Platform admins and auditors, platform audience, two-step always.
        Filters: `hospital` (an id, or `platform` for entries with no
        hospital), `person` (the actor's id), `type` (a comma list),
        `outcome`, `flagged`, `from` and `to` (instants with a zone,
        `[from, to)`). `q` is an exact event id (decimal) or request id
        (`[A-Za-z0-9_-]{8,64}`) and ignores the other filters; a
        pseudonym-shaped `q` is 422. An unknown, repeated or empty
        parameter is 422 `validation_failed`. `limit` 1–100 (default 50).
        `next_cursor` is opaque (hex), HMAC-bound to the session and the
        filters: under other filters, from another session, or altered, it
        is 422. `total` counts up to 10,000, then
        `total_capped`. Each entry is the contract's event, or the bare
        entry (`id`, `seq`, `hash`, `at`, `type: security`,
        `kind: unknown`) for one the catalogue doesn't map; no payload is
        ever sent as stored. Every page is recorded, collapsed to one
        entry per session and filter set (each distinct `q` its own) per
        5 minutes: `audit.viewed`, or `audit.searched` for `q`.
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &auditListErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - { name: hospital, in: query, required: false, schema: { type: string } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: type, in: query, required: false, schema: { type: string }, description: "A comma list of event types." }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [succeeded, refused, failed] } }
        - { name: flagged, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: q, in: query, required: false, schema: { type: string, pattern: "^([1-9][0-9]{0,18}|[A-Za-z0-9_-]{8,64})$" } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

