openapi: 3.0.3
info:
  title: MHAI core service
  version: "1.4.0"
  x-logo:
    url: /api/docs/logo.png
    altText: Measured Health
    backgroundColor: "#FFFFFF"
  description: |
    The core service's committed contract: every route it serves, with the
    exact request and response shapes and the error codes each can return.
    `internal/auth/contract_test.go` checks it against the permission table
    the service serves (both ways) and the error catalogue (`httpx.Codes`).

    Callers are the BFFs, server to server. Every route except the probes
    needs `X-MHAI-Service` (the BFF key). The BFF passes the end user's
    address in `X-MHAI-Client-IP` and the app in `X-MHAI-Audience`
    (`clinical` by default, or `platform`). Identity comes only from the
    bearer token, never from a body, query or header.

    Request bodies are JSON, at most 64 KB; an unknown field is
    422 `validation_failed`. Errors are `application/problem+json`
    (`Problem`); on the platform audience the body is `{code}` only. Every
    response has `X-Request-ID`; auth responses also send
    `Cache-Control: no-store`.

    Unsafe methods accept an optional `Idempotency-Key` (1–255 printable
    characters). A retry with the same key and body replays the stored reply
    (`Idempotent-Replayed: true`) for 72 hours; the same key with another
    body, or one still in flight, is 409 `conflict`. Replies that carry a
    credential are never stored, so their retry is 409 too.

    Over NATS (spec §17.1; `services/core/README.md`, "The API over NATS"):
    the same routes, one request per message on `api.v1.clinical` or
    `api.v1.platform`, with `Mhai-Method`, `Mhai-Path` and the reply status
    in `Mhai-Status-Code`. There the BFF's NATS user replaces
    `X-MHAI-Service`, the subject replaces `X-MHAI-Audience`, and the probes
    and docs are not served. Two codes occur only there: 405
    `method_not_allowed` (a method outside GET, HEAD, POST, PUT, PATCH,
    DELETE) and 413 `payload_too_large` (a body over 64 KB).

    Versioning (ADR 0012): the major version is in the path, `/api/v1`.
    Within it, changes are additive only, so clients must ignore unknown
    response fields. `info.version` is semver: minor for an additive
    change, patch for a documentation-only one.
servers:
  - url: /api/v1

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe. No BFF key.
      tags: [probes]
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe. No BFF key.
      description: |
        200 when Postgres answers and NATS is connected with every KV
        bucket reachable; otherwise 503 `not_ready`, never saying which
        dependency failed.
      tags: [probes]
      security: []
      x-error-codes: [not_ready]
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in with a work email and password.
      description: |
        Unknown, inactive and wrong-password logins get the same 401 after
        the same argon2 work. 5 failures per (login, client IP) in 15
        minutes, or 20 per login across every IP in an hour, give 429
        `login_locked`, the same for an unknown login. Without
        `X-MHAI-Client-IP`, or when the attempt counters or the password
        checker are unavailable, 503 `not_ready`. A clinical account on the
        platform audience is 403 `not_platform`; a platform account on the
        clinical audience is 403 `forbidden`. When two-step applies the reply
        is `MFARequired` instead of tokens.
      tags: [auth]
      security: [{ ServiceKey: [] }]
      x-error-codes: [unauthenticated, forbidden, not_platform, conflict, validation_failed, login_locked, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or a second factor is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Tokens"
                  - $ref: "#/components/schemas/MFARequired"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and mint a new access token.
      description: |
        Reusing a refresh token within 10 seconds of its rotation is 409
        `conflict` and revokes nothing (the BFF retries with its newer
        token). Reuse later revokes the whole family (401). Roles, two-step
        and account and hospital status are checked again on every refresh.
      tags: [auth]
      security: [{ ServiceKey: [] }]
      x-error-codes: [unauthenticated, forbidden, not_platform, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/mfa/challenge:
    post:
      operationId: mfaChallenge
      summary: Finish sign-in with a TOTP or backup code.
      description: |
        The `mfa_token` lasts 5 minutes, allows 5 attempts and is single
        use; it works only on the audience it was issued on and only until
        the password changes. 5 wrong codes in 15 minutes give 429
        `mfa_locked`. With `trust_device`, and only where the hospital allows
        it and no role forbids it, the reply also carries `device_token`.
      tags: [auth]
      security: [{ ServiceKey: [] }]
      x-error-codes: [unauthenticated, mfa_invalid, mfa_locked, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/mfa/enroll:
    post:
      operationId: mfaEnroll
      summary: Start two-step enrolment.
      description: |
        A new TOTP secret and 10 backup codes, replacing any enrolment not
        yet verified. Two-step stays off until `/auth/mfa/verify`. 409
        `conflict` when two-step is already on. Accepts a session limited to
        enrolment. The body is empty or `{}`.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &signedInErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "200":
          description: The secret (as an otpauth URI) and backup codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Confirm enrolment with a TOTP code; turns two-step on.
      description: |
        Marks the caller's session as proven by a code, so its next refresh
        mints a full token. No enrolment is 409 `conflict`. A wrong code is
        403 `mfa_invalid`; 5 in 15 minutes are 429 `mfa_locked`.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "204": { description: Two-step is on. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/mfa/recovery-codes:
    post:
      operationId: mfaRecoveryCodes
      summary: Regenerate the 10 backup codes (step-up required).
      description: |
        Needs a fresh TOTP code (`mfa_code`) or an unused backup code
        (`backup_code`). The old codes stop working. A wrong code is 403
        `mfa_invalid`; none given is 403 `mfa_required`.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-step-up: true
      x-error-codes: [unauthenticated, token_expired, mfa_required, mfa_invalid, mfa_locked, forbidden, not_platform, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "200":
          description: The new backup codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password.
      description: |
        A wrong current password is 403 `forbidden` and counts against the
        sign-in lockout (429 `login_locked`). The new password must be at
        least 12 characters, not on the breached list and not the current
        one, else 422 `weak_password`. On success every other session is
        revoked and trusted devices are removed.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, conflict, validation_failed, weak_password, login_locked, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Changed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session.
      description: Revokes the session and denylists it and its access tokens. The body is empty.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *signedInErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/terms:
    post:
      operationId: acceptTerms
      summary: Record acceptance of a terms version.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *signedInErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermsRequest" }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/sessions:
    get:
      operationId: listSessions
      summary: The caller's active sessions (devices), most recently seen first.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/sessions/{id}:
    delete:
      operationId: deleteSession
      summary: Sign out one of the caller's sessions.
      description: Another account's session, or an unknown id, is 404 `not_found`.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Sign out every session of the caller, this one included.
      tags: [auth]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *signedInErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Signed out everywhere. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /queries:
    post:
      operationId: createQuery
      summary: Ask a clinical question; it is answered in the background.
      description: |
        Clinicians only. Queues the question as an intelligence job
        (pipeline.run_query) and answers at once with its id; poll
        `GET /queries/{id}`. At most `INTELLIGENCE_QUERY_CAP` (default 10)
        questions per hospital may be queued or running at once: past it,
        429 `rate_limited`. The question and patient data are stored with the
        question only, never logged or audited. Send an `Idempotency-Key`
        so a retry doesn't ask twice.
      tags: [queries]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, conflict, validation_failed, rate_limited, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryCreateIn" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryCreated" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /queries/{id}:
    get:
      operationId: getQueryStatus
      summary: The status of one of the caller's questions.
      description: |
        Another clinician's question, another hospital's, or an unknown id
        is 404 `not_found`. A cancelled question (its creator or hospital
        was deactivated) is `failed` with `error_code` `cancelled`.
      tags: [queries]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &queryReadErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, not_ready, internal_error]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /queries/{id}/result:
    get:
      operationId: getQueryResult
      summary: The answer to one of the caller's completed questions.
      description: 404 `not_found` until the question is completed, and for anyone else's.
      tags: [queries]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *queryReadErrors
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /feedback:
    post:
      operationId: submitFeedback
      summary: Agree with an answer, or suggest a correction for review.
      description: |
        Clinicians only, on their own completed question. `validate` records
        agreement (`{status: recorded}`); `correct` records a correction
        that waits for a different clinician of the hospital
        (`{status: pending_review, correction_id}`). Guards in order: 404
        `not_found` (not the caller's, another hospital's, unknown, or not
        completed), 409 `conflict` (a live feedback exists for the
        question; a correction on an answer with no masked consultation),
        then 422 `validation_failed` (`corrected_diagnosis` 1–200 characters
        on one line and `reason` 3–1000 characters, which may span lines
        (`\n`, `\r\n`), both once trimmed, no other control character, no
        Unicode format character (bidi controls, zero-width) and no line or
        paragraph separator (U+2028, U+2029);
        `client_created_at` at most 5 minutes ahead). After a withdrawal a
        new correction is allowed. The text is never logged or audited.
        Send an `Idempotency-Key`.
      tags: [feedback]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackIn" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /feedback/stats/mine:
    get:
      operationId: getMyFeedbackStats
      summary: The caller's own feedback counts.
      tags: [feedback]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &feedbackReadErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackStatsOut" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections:
    get:
      operationId: listPendingCorrections
      summary: Corrections waiting for review in the caller's hospital.
      description: |
        Never the caller's own; oldest first; at most 100. The consultation
        is the masked copy only. `status` may be omitted or `pending`; any
        other value is 422 `validation_failed`.
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending] }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The waiting corrections.
          content:
            application/json:
              schema: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/CorrectionOut" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections/mine:
    get:
      operationId: listMyCorrections
      summary: The caller's own corrections, every status, newest first (at most 200).
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *feedbackReadErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The caller's corrections.
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/CorrectionOut" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections/reviewed:
    get:
      operationId: listReviewedCorrections
      summary: Corrections the caller decided in the last 30 days, newest first (at most 50).
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *feedbackReadErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The caller's decisions.
          content:
            application/json:
              schema: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/CorrectionOut" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections/{id}/approve:
    post:
      operationId: approveCorrection
      summary: Approve another clinician's waiting correction.
      description: |
        Guards in order: 404 `not_found` (unknown, another hospital's),
        403 `self_approval` (your own), 409 `already_decided` (no longer
        waiting), then the body (none, or `{}`; anything else is 422).
        409 `conflict` when the database no longer finds the caller an
        active clinician of the hospital. The decider is always the
        token's user. A refusal is audited. An approval queues the
        `approve_correction` job in the same transaction and publishes it
        after the commit; 204 even when the publish fails or the hospital
        has 20 such jobs in flight (the job then waits for the sweeper).
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &decideErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, self_approval, not_found, conflict, already_decided, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/CorrectionID"
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Approved. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections/{id}/reject:
    post:
      operationId: rejectCorrection
      summary: Reject another clinician's waiting correction, with a reason code.
      description: |
        The same guards and refusals as approve; the body is checked last.
        The note is shown to the submitter and the reviewer only, and never
        audited.
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *decideErrors
      parameters:
        - $ref: "#/components/parameters/CorrectionID"
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectIn" }
      responses:
        "204": { description: Rejected. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /corrections/{id}/withdraw:
    post:
      operationId: withdrawCorrection
      summary: Withdraw your own waiting correction.
      description: |
        Someone else's is 403 `forbidden`; a decided or withdrawn one is
        409 `already_decided`. No body (or `{}`).
      tags: [corrections]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, conflict, already_decided, validation_failed, not_ready, internal_error]
      parameters:
        - $ref: "#/components/parameters/CorrectionID"
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/audit:
    get:
      operationId: listAuditEvents
      summary: The audit log, newest first (the platform form of `GET /security/audit`).
      description: |
        Platform admins and auditors, platform audience, two-step always.
        Filters: `hospital` (an id, or `platform` for entries with no
        hospital), `person` (the actor's id), `type` (a comma list),
        `outcome`, `flagged`, `from` and `to` (instants with a zone,
        `[from, to)`). `q` is an exact event id (decimal) or request id
        (`[A-Za-z0-9_-]{8,64}`) and ignores the other filters; a
        pseudonym-shaped `q` is 422. An unknown, repeated or empty
        parameter is 422 `validation_failed`. `limit` 1–100 (default 50).
        `next_cursor` is opaque and bound to the filters: under other
        filters it is 422. `total` counts up to 10,000, then
        `total_capped`. Each entry is the contract's event, or the bare
        entry (`id`, `seq`, `hash`, `at`, `type: security`,
        `kind: unknown`) for one the catalogue doesn't map; no payload is
        ever sent as stored. The first page of a filter set is recorded
        once per session per 5 minutes (`audit.viewed`, or
        `audit.searched` for `q`); a page with a cursor is not.
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: &auditListErrors [unauthenticated, token_expired, mfa_required, forbidden, not_platform, validation_failed, not_ready, internal_error]
      parameters:
        - { name: hospital, in: query, required: false, schema: { type: string } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: type, in: query, required: false, schema: { type: string }, description: "A comma list of event types." }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [succeeded, refused, failed] } }
        - { name: flagged, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: q, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/audit/hospitals:
    get:
      operationId: listAuditHospitals
      summary: Every hospital the audit log names, removed ones included.
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *auditListErrors
      parameters:
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The hospitals, by name.
          content:
            application/json:
              schema:
                type: object
                required: [hospitals]
                additionalProperties: false
                properties:
                  hospitals: { type: array, items: { $ref: "#/components/schemas/AuditHospital" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/audit/people:
    get:
      operationId: searchAuditPeople
      summary: People whose name or email holds q (the person picker).
      description: |
        `q` of 2 to 100 characters once trimmed, no control or format
        character; at most 20 people, platform-wide by design.
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: *auditListErrors
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [people]
                additionalProperties: false
                properties:
                  people: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AuditPerson" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /platform/audit/{id}:
    get:
      operationId: getAuditEvent
      summary: One audit entry, with `patients` and `letter` (both null until named access exists).
      description: |
        `id` is the decimal event id; anything else, or no such entry, is
        404 `not_found`. `/platform/audit/{id}/patients`,
        `/platform/audit/named-access` and `/platform/audit/exports*` are
        not served yet (404 `not_found`).
      tags: [audit]
      security: [{ ServiceKey: [], Bearer: [] }]
      x-error-codes: [unauthenticated, token_expired, mfa_required, forbidden, not_platform, not_found, not_ready, internal_error]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]{0,18}$" } }
        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-MHAI-Service
      description: The BFF's service key (BFF_SERVICE_KEYS). Never sent by a browser.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token: EdDSA (Ed25519), 15 minutes, iss `mhai-gateway`,
        aud `mhai-bff`, claims sub, hid, roles, mfa, amr, sid, jti, iat, exp.

  parameters:
    ClientIP:
      name: X-MHAI-Client-IP
      in: header
      required: false
      description: The end user's IP address, as the BFF saw it. Sign-in and password change need it.
      schema: { type: string }
    Audience:
      name: X-MHAI-Audience
      in: header
      required: false
      schema: { type: string, enum: [clinical, platform], default: clinical }
    CorrectionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    Problem:
      description: An error. The `code` is one of the operation's `x-error-codes`.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Problem"
              - $ref: "#/components/schemas/PlatformProblem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, example: "urn:mhai:problem:unauthenticated" }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - unauthenticated
            - token_expired
            - mfa_required
            - mfa_invalid
            - mfa_locked
            - forbidden
            - not_platform
            - not_found
            - conflict
            - validation_failed
            - weak_password
            - rate_limited
            - login_locked
            - not_ready
            - unavailable
            - internal_error
            - method_not_allowed
            - payload_too_large
            - self_approval
            - already_decided
        detail: { type: string, description: Fixed per code; never echoes input. }
        request_id: { type: string }
    PlatformProblem:
      description: The error body on the platform audience.
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Ready:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready] }
    Empty:
      type: object
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 320, description: The work email; case and surrounding spaces are ignored. }
        password: { type: string, maxLength: 1024 }
        device_token: { type: string, maxLength: 256 }
    Tokens:
      type: object
      required: [access_token, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string, description: For the BFF only; never sent to the browser. }
        user: { $ref: "#/components/schemas/User" }
        device_token: { type: string, description: Only from the challenge, when trust_device was set and allowed. }
    MFARequired:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_token: { type: string }
    User:
      type: object
      required: [id, role, roles, email, display_name, full_name, role_title, specialty, hospital, mfa_enabled,
        must_change_password, terms_accepted_at, recovery_codes_left, idle_timeout_minutes, review_overdue_hours]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, description: The primary role. }
        roles:
          type: array
          items: { type: string, enum: [clinician, hospital_admin, analyst, platform_admin, auditor] }
        email: { type: string }
        display_name: { type: string }
        full_name: { type: string, nullable: true }
        role_title: { type: string, nullable: true }
        specialty: { type: string, nullable: true }
        hospital:
          nullable: true
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        mfa_enabled: { type: boolean }
        must_change_password: { type: boolean }
        terms_accepted_at: { type: string, format: date-time, nullable: true }
        recovery_codes_left: { type: integer }
        idle_timeout_minutes: { type: integer }
        review_overdue_hours: { type: integer }

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
    RefreshResponse:
      type: object
      required: [access_token, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }

    ChallengeRequest:
      type: object
      required: [mfa_token, code]
      additionalProperties: false
      properties:
        mfa_token: { type: string }
        code: { type: string, description: A six-digit TOTP code or a backup code. }
        trust_device: { type: boolean }
    EnrollResponse:
      type: object
      required: [otpauth_uri, recovery_codes]
      properties:
        otpauth_uri: { type: string }
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }
    StepUpRequest:
      type: object
      additionalProperties: false
      properties:
        mfa_code: { type: string }
        backup_code: { type: string }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }

    PasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, minLength: 12, maxLength: 1024 }
    TermsRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 64 }

    Session:
      type: object
      required: [id, created_at, last_seen_at, ua_summary, ip_prefix, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        ua_summary: { type: string, nullable: true }
        ip_prefix: { type: string, nullable: true, description: The client's /24 (IPv4) or /48 (IPv6). }
        current: { type: boolean }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }

    QueryCreateIn:
      type: object
      required: [patient_data, clinical_question, urgency]
      additionalProperties: false
      properties:
        patient_data:
          type: object
          required: [age, sex, symptoms]
          additionalProperties: false
          properties:
            age: { type: integer, minimum: 0, maximum: 130 }
            sex: { type: string, enum: [female, male, other, unknown] }
            symptoms:
              type: array
              maxItems: 50
              items: { type: string, minLength: 1, maxLength: 200 }
            medical_history: { type: string, maxLength: 4000 }
        clinical_question: { type: string, minLength: 1, maxLength: 4000 }
        urgency: { type: string, enum: [routine, urgent, emergency] }
        specialty:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z][A-Za-z -]{0,31}$"
        client_created_at:
          type: string
          format: date-time
          description: When the app queued the question (offline); checked, not stored.
    QueryCreated:
      type: object
      required: [query_id, status]
      properties:
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
    QueryStatus:
      type: object
      required: [query_id, status, progress, current_stage]
      properties:
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        current_stage:
          type: string
          nullable: true
          enum: [pii_masking, retrieval, generation, nli_verification, hga_verification, decision, null]
        error_code:
          type: string
          description: |
            Only when failed: an intelligence error code (spec §10.1), or
            `cancelled`.
    Citation:
      type: object
      required: [chunk_id, source_title, excerpt, claim_text, nli_label, nli_confidence, action, reason]
      properties:
        chunk_id: { type: string }
        source_title: { type: string }
        excerpt: { type: string }
        claim_text: { type: string }
        nli_label: { type: string, enum: [ENTAILMENT, NEUTRAL, CONTRADICTION] }
        nli_confidence: { type: number }
        action: { type: string, enum: [PASS, FLAG, REDACT] }
        reason: { type: string }
    ClinicalResult:
      type: object
      required: [query_id, decision, verified, degraded, failed_agents, response_available, diagnosis, icd10_code,
                 response_text, trust_score, trust_band, citations, cited_chunk_ids, guardrail_details, retrieval_ms, generation_ms]
      properties:
        query_id: { type: string, format: uuid }
        decision: { type: string, enum: [PASS, REGENERATE, ESCALATE] }
        verified: { type: boolean }
        degraded: { type: boolean }
        failed_agents:
          type: array
          items: { type: string, enum: [CCA, HGA] }
        response_available: { type: boolean }
        diagnosis: { type: string, nullable: true }
        icd10_code: { type: string, nullable: true }
        response_text: { type: string }
        trust_score: { type: number, nullable: true }
        trust_band:
          type: string
          nullable: true
          enum: [low, mid, high, null]
          description: Provisional banding of a verified answer's trust; null when unverified.
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        cited_chunk_ids:
          type: array
          items: { type: string }
        guardrail_details:
          type: object
          required: [l1_persona, l2_entropy, l3_nli, l4_trust, cascade_pass]
          properties:
            l1_persona: { type: object, nullable: true }
            l2_entropy:
              type: object
              nullable: true
              properties:
                stability: { type: number }
            l3_nli:
              type: object
              required: [pass_rate, claims_checked, model_loaded]
              properties:
                pass_rate: { type: number }
                claims_checked: { type: integer }
                model_loaded: { type: boolean }
            l4_trust:
              type: object
              nullable: true
              required: [trust_score, base_trust, flag_penalty]
              properties:
                trust_score: { type: number }
                base_trust: { type: number }
                flag_penalty: { type: number }
            cascade_pass: { type: boolean }
        retrieval_ms: { type: number }
        generation_ms: { type: number }

    FeedbackIn:
      type: object
      required: [query_id, action]
      additionalProperties: false
      properties:
        query_id: { type: string, format: uuid }
        action: { type: string, enum: [validate, correct] }
        corrected_diagnosis: { type: string, minLength: 1, maxLength: 200, description: "`correct` only. One line." }
        reason: { type: string, minLength: 3, maxLength: 1000, description: "`correct` only. May span lines (`\\n`, `\\r\\n`)." }
        client_created_at: { type: string, format: date-time, description: When the app queued it (offline). }
    FeedbackOut:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [recorded, pending_review] }
        correction_id: { type: string, format: uuid, description: For a correction only. }
    RejectIn:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string, enum: [not_supported, needs_rewording, unsafe, out_of_scope] }
        note: { type: string, maxLength: 500, description: "May span lines (`\\n`, `\\r\\n`); no other control character, no Unicode format character and no U+2028 or U+2029." }
    FeedbackStatsOut:
      type: object
      required: [agreed, corrections_waiting, corrections_approved, corrections_rejected, corrections_withdrawn]
      properties:
        agreed: { type: integer }
        corrections_waiting: { type: integer }
        corrections_approved: { type: integer }
        corrections_rejected: { type: integer }
        corrections_withdrawn: { type: integer }
    PersonOut:
      type: object
      description: A person as the API shows them; never an id.
      required: [display_name, full_name, specialty, hospital]
      properties:
        display_name: { type: string }
        full_name: { type: string, nullable: true }
        specialty: { type: string, nullable: true }
        hospital: { type: string, nullable: true }
    CorrectionOut:
      type: object
      required: [id, query_id, status, corrected_diagnosis, reason, submitted_by, submitted_at, original, consultation,
                 decided_by, decided_at, rejection]
      properties:
        id: { type: string, format: uuid }
        query_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
        corrected_diagnosis: { type: string }
        reason: { type: string }
        submitted_by: { $ref: "#/components/schemas/PersonOut" }
        submitted_at: { type: string, format: date-time }
        original:
          type: object
          description: What the system said.
          required: [decision, degraded, diagnosis, icd10_code, response_text, citations]
          properties:
            decision: { type: string, enum: [PASS, REGENERATE, ESCALATE] }
            degraded: { type: boolean }
            diagnosis: { type: string, nullable: true }
            icd10_code: { type: string, nullable: true }
            response_text: { type: string }
            citations:
              type: array
              items:
                type: object
                required: [source_title, claim_text, action]
                properties:
                  source_title: { type: string }
                  claim_text: { type: string }
                  action: { type: string, enum: [PASS, FLAG, REDACT] }
        consultation:
          type: object
          description: The consultation as it was asked, patient details already masked.
          required: [age, sex, symptoms, clinical_question, urgency, specialty]
          properties:
            age: { type: number }
            sex: { type: string, enum: [female, male, other, unknown] }
            symptoms: { type: array, items: { type: string } }
            clinical_question: { type: string }
            urgency: { type: string, enum: [routine, urgent, emergency] }
            specialty: { type: string, nullable: true }
        decided_by:
          allOf: [{ $ref: "#/components/schemas/PersonOut" }]
          nullable: true
        decided_at: { type: string, format: date-time, nullable: true, description: Also set when withdrawn. }
        rejection:
          type: object
          nullable: true
          required: [reason_code, note]
          properties:
            reason_code: { type: string, enum: [not_supported, needs_rewording, unsafe, out_of_scope] }
            note: { type: string, nullable: true }

    AuditHospital:
      type: object
      required: [id, name, removed]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        removed: { type: boolean }
    AuditPerson:
      type: object
      required: [id, name, email, role, kind, hospital]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [clinician, hospital_admin, platform_admin, auditor] }
        kind: { type: string, enum: [staff, platform] }
        hospital:
          type: object
          nullable: true
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
    AuditBareEntry:
      type: object
      description: An entry the catalogue doesn't map; the app shows it as undisplayable.
      required: [id, seq, hash, at, type, kind]
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        hash: { type: string }
        at: { type: string, format: date-time }
        type: { type: string, enum: [security] }
        kind: { type: string, enum: [unknown] }
    AuditEvent:
      type: object
      description: Contract §14.9's event. `ip`, `device`, `reason` and `note` are null for now.
      required: [id, seq, hash, at, actor, hospital, type, kind, target, outcome, ip, device, flag, reason, note, refs, facts, after_break]
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, name, role, kind]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            role: { type: string, enum: [clinician, reviewer, hospital_admin, platform_admin, auditor, system] }
            kind: { type: string, enum: [staff, platform, system] }
        hospital:
          allOf: [{ $ref: "#/components/schemas/AuditHospital" }]
          nullable: true
        type: { type: string }
        kind: { type: string }
        target:
          type: object
          nullable: true
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        outcome: { type: string, enum: [succeeded, refused, failed] }
        ip: { type: string, nullable: true }
        device: { type: string, nullable: true }
        flag: { type: string, nullable: true, enum: [security, policy] }
        reason: { type: string, nullable: true }
        note: { type: string, nullable: true }
        refs:
          type: object
          required: [clearance_id, export_id, request_id]
          additionalProperties: false
          properties:
            clearance_id: { type: string, nullable: true }
            export_id: { type: string, nullable: true }
            request_id: { type: string, nullable: true }
        facts: { type: object, description: "Typed facts; keys from the contract's list only." }
        after_break: { type: boolean }
    AuditEntry:
      oneOf:
        - $ref: "#/components/schemas/AuditEvent"
        - $ref: "#/components/schemas/AuditBareEntry"
    AuditList:
      type: object
      required: [events, next_cursor, total, total_capped, oldest_kept_at, last_checkpoint]
      additionalProperties: false
      properties:
        events: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, minimum: 0, maximum: 10000 }
        total_capped: { type: boolean }
        oldest_kept_at: { type: string, format: date-time }
        last_checkpoint: { type: object, nullable: true, description: Always null until retention checkpoints exist. }
    AuditDetail:
      description: The entry (event or bare) plus `patients` and `letter`, both null for now.
      allOf:
        - $ref: "#/components/schemas/AuditEntry"
        - type: object
          required: [patients, letter]
          properties:
            patients: { type: object, nullable: true }
            letter: { type: object, nullable: true }
