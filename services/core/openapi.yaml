    get:
      operationId: getAnalysisView
      summary: One Analysis view of one frozen period (Patient Analysis).
      description: >
        Hospital admins and analysts, with two-step, while the hospital's analysis switch is on
        (otherwise 404 not_found). One finished, frozen period: `period` and `start`, or `from` and
        `to` that span exactly one period (anything else is 422 invalid_range). A period that has
        ended but isn't frozen is 503 not_ready, as is a body that couldn't be computed within the
        cold budget (retry: it is being computed). At most two filters (422 too_many_filters); a
        location and a setting together are refused. A condition, location or source that isn't in the
        period's filter lists is 422 validation_failed (so is a specialty). A person may have at most 100 distinct
        contexts computed cold per period, counting the child periods and filter parents a request needs, and
        one request at most 32 (429 rate_limited past either; a history point past them is hidden whole). Every number is guarded under the small-group
        rule and served from the stored body unchanged; `history` lists up to 7 earlier periods of
