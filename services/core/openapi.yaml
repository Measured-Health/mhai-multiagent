        known unit is uncovered), `rules {levels}` (category to level) or
        `recipients {queue, clinician_ids}` (the named list is replaced),
        with the `version` it was read at: 409 `conflict` when it is stale.
        422 `validation_failed` for two sections, an unknown unit, category
        or level, or a clinician who isn't an active clinician of the
        hospital; 422 `no_recipients` for the queue off with nobody named.
        Clinicians taken off the list have their open alerts that no other
        active clinician was sent moved to the queue. Each save is audited
