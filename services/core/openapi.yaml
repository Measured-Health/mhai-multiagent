  /platform/analytics/changes/{id}/series:
    get:
      operationId: getPlatformAnalyticsChangeSeries
      summary: An open change's measure for each of the latest periods.
      description: |
        Platform admins and auditors, platform audience, two-step always.
        New (Plan 7c spec §7.2; built in Plan 7c-3). `period` is `week`,
        `month` or `quarter` (422 `validation_failed` otherwise). For a
