      deprecated: true
      x-sunset: "2027-02-14"
      description: |
        **Deprecated** (Plan 7c spec §9, rulings R41a-3 and R41a-4; ADR
        0012). Platform admins and auditors, platform audience, two-step
        always. Use `GET /platform/guardrails/periods` (`week`, `month`,
        `quarter`) instead.

        From the 7c-1 release every response of this route carries
        `Deprecation`, `Sunset` and `Link` headers (the notice at
        `/docs/notices/guardrails-rolling-windows`). `period` (`7d`, `30d` or
        `90d`, required) still answers in the same shape: `from` and `to` are
        whole UTC days ending at the start of today (until 00:15 UTC, the
        start of yesterday), `updated_at` is `to`, and the active hospitals
        are listed. **Every count and share is hidden**, `all` included
        (`{value: null, suppressed: true}`): rolling windows can be
        subtracted from each other and from the calendar periods to reveal a
        hidden small count. After the sunset (90 days after the release) the
        values are 422 `validation_failed`. Six reads a minute per session,
        shared with `/platform/guardrails/periods`, then 429 `rate_limited`.
        Not recorded in the audit log.
