        - $ref: "#/components/parameters/ClientIP"
        - $ref: "#/components/parameters/Audience"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { $ref: "#/components/schemas/JobIDs" }
      responses:
        "200":
          description: What was retried and what was skipped.
          content:
            application/json:
              schema:
                type: object
                required: [retried, skipped]
                additionalProperties: false
                properties:
                  retried: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

